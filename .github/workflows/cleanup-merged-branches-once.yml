name: Cleanup merged implementation branches once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified merged branches
