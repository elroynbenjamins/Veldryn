# Temporary branch-only regeneration; remove before merge.
name: Faith Edge bundle parity rebuild
on:
  push:
    branches: ['faith/category-blessings-progression']
    paths:
      - '.github/workflows/faith-edge-parity-rebuild.yml'
      - 'apps/mobile/src/**'
      - 'backend/online/**'
      - 'tools/build-online.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: faith-edge-parity-rebuild
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.ref == 'refs/heads/faith/category-blessings-progression'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faith/category-blessings-progression
          fetch-depth: 1
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate both Edge functions
        run: pnpm --dir backend build:online
      - name: Verify generated parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit only generated files to the Faith branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='faith/category-blessings-progression'
          [[ "$GITHUB_REF" == "refs/heads/$BRANCH" ]] || exit 1
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          [[ -z "$unexpected" ]] || { printf '%s\n' "$unexpected"; exit 1; }
          git diff --check
          git add -- backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then exit 0; fi
          unexpected=$(git diff --cached --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          [[ -z "$unexpected" ]] || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(faith): regenerate gameplay and coop bundles'
          git push origin "HEAD:refs/heads/$BRANCH"
