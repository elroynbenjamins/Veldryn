name: Manual chat translation contract

# Cancel superseded PR checks; never cancel main, scheduled, or manual release checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'apps/mobile/src/components/ChatTranslatableBody.tsx'
      - 'apps/mobile/src/components/ChatMessageRow.tsx'
      - 'apps/mobile/src/components/coop/CoopPartyChat.tsx'
      - 'apps/mobile/src/components/OnlineWorldChat.tsx'
      - 'apps/mobile/src/components/OnlinePartyChat.tsx'
      - 'apps/mobile/src/components/GuildChat.tsx'
      - 'apps/mobile/src/online/chat-translation.ts'
      - 'apps/mobile/src/core/release-flags.ts'
      - 'apps/mobile/src/i18n/chat-translation-privacy.ts'
      - 'apps/mobile/src/screens/SettingsScreen.tsx'
      - 'apps/mobile/tests/chat-translation-contract.cjs'
      - 'backend/supabase/functions/translate-chat-message/**'
      - 'backend/tests/chat-translation-edge.test.mjs'
      - '.github/workflows/manual-chat-translation-validation.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manual translation UI contract
        run: node --test apps/mobile/tests/chat-translation-contract.cjs
      - name: Test real Edge handler against mocked RLS and DeepL transport
        run: node --experimental-strip-types --test backend/tests/chat-translation-edge.test.mjs
