name: Weekly guild boss balance review
on:
  pull_request:
    paths:
      - 'tools/weekly-guild-boss-balance-review*'
      - 'docs/implementation/weekly-guild-boss-balance-20261130*'
      - 'apps/mobile/src/core/guild-pve-encounters.ts'
      - 'apps/mobile/src/components/GuildRaidEncounter.tsx'
      - '.github/workflows/weekly-guild-boss-balance-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/weekly-guild-boss-balance-review.test.mjs
