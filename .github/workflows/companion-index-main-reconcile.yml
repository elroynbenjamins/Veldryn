name: Reconcile companion index with main (branch only)

on:
  push:
    branches: [feat/companion-index-unlock-audit-20261113]
    paths:
      - '.github/workflows/companion-index-main-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref_name == 'feat/companion-index-unlock-audit-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/companion-index-unlock-audit-20261113
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Merge latest main, preserving companion features
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge --no-ff --no-commit origin/main; then
            echo 'Latest main merged without conflicts.'
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Unresolved paths: %s\n' "${conflicts[*]}"
            test "${#conflicts[@]}" -gt 0 || exit 1
            for file in "${conflicts[@]}"; do
              case "$file" in
                apps/mobile/src/core/game-commands.ts|backend/supabase/functions/gameplay/index.ts|backend/supabase/functions/coop/index.ts)
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "Unexpected conflict; preserving both branches and stopping: $file" >&2
                  exit 1
                  ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          if test -f .git/MERGE_HEAD; then
            git commit -m 'merge(main): retain companion index and current queue runtime'
          fi
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate server-owned Edge bundles and validate
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
          pnpm --dir apps/mobile typecheck:core
          pnpm --dir apps/mobile typecheck
          pnpm --dir apps/mobile test:companions
      - name: Commit generated bundles and update only this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/companion-index-unlock-audit-20261113'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build(edge): resync companion acquisition and food queue runtime'
          fi
          git push origin HEAD:"$GITHUB_REF_NAME"
