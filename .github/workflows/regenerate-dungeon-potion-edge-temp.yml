name: Temporary dungeon potion Edge bundle sync

on:
  push:
    branches: [feat/dungeon-crafted-healing-potions-106]
    paths:
      - '.github/workflows/regenerate-dungeon-potion-edge-temp.yml'
      - 'backend/online/**'
      - 'backend/src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install pinned backend tooling
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Regenerate canonical gameplay and co-op bundles
        run: node tools/build-online.mjs
      - name: Verify gameplay bundle parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(coop): synchronize crafted dungeon potion Edge bundles"
            git push origin HEAD:feat/dungeon-crafted-healing-potions-106
          fi
