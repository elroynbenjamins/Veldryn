name: Rankings v3 scoring proposal safety

on:
  pull_request:
    paths:
      - 'backend/src/server/rankings/**'
      - 'backend/supabase/tests/leaderboards_v3_*.sql'
      - 'backend/supabase/tests/leaderboards_v4_*.sql'
      - 'backend/supabase/tests/leaderboards_arena_*.sql'
      - 'backend/supabase/tests/leaderboards_world_boss_*.sql'
      - 'backend/tsconfig.rankings.json'
      - 'docs/roadmap/leaderboards-authoritative-scoring-v3-proposal.sql'
      - 'docs/roadmap/leaderboards-v4-frozen-snapshots-proposal.sql'
      - 'docs/roadmap/leaderboards-arena-final-history-v1-proposal.sql'
      - 'docs/roadmap/leaderboards-party-guild-final-archives-v1-proposal.sql'
      - 'docs/roadmap/leaderboards-world-boss-final-history-v1-proposal.sql'
      - 'docs/roadmap/leaderboards-competitive-policy-v1.md'
      - 'tools/verify-rankings-v3-draft.mjs'
      - 'tools/verify-rankings-v4-draft.mjs'
      - 'tools/verify-rankings-edge-handler.mjs'
      - 'backend/online/rankings-handler.ts'
      - 'backend/online/edge.ts'
      - '.github/workflows/rankings-v3-proposal-validation.yml'

jobs:
  rankings-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Compile isolated Rankings adapter and route contracts
        run: node backend/node_modules/typescript/lib/tsc.js -p backend/tsconfig.rankings.json
      - name: Verify v2 default, v3 opt-in and no silent fallback
        run: node backend/.rankings-build/server/rankings/__tests__/ranking-application.js
      - name: Verify frozen snapshot account binding and fail-closed gates
        run: node backend/.rankings-build/server/rankings/__tests__/frozen-rankings.js
      - name: Validate authenticated Edge snapshot routes (no active gates)
        run: node tools/verify-rankings-edge-handler.mjs
      - name: Verify Party Event and Guild PvE sealed archive gates
        run: node backend/.rankings-build/server/rankings/__tests__/final-mode-history.js
      - name: Verify World Boss and Arena independent finalized-history gates
        run: node backend/.rankings-build/server/rankings/__tests__/event-history-gates.js
      - name: Verify service-only staging SQL and fixture contracts
        run: node tools/verify-rankings-v3-draft.mjs
      - name: Verify frozen snapshot draft SQL safety contracts
        run: node tools/verify-rankings-v4-draft.mjs
