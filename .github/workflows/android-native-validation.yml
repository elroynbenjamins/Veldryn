name: Android native validation

on:
  pull_request:
    paths:
      - 'apps/mobile/app.json'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/pnpm-lock.yaml'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/modules/**'
      - 'apps/mobile/src/online/google-signin.ts'
      - 'apps/mobile/src/online/play-games.ts'
      - '.github/workflows/android-native-validation.yml'
  workflow_dispatch:

jobs:
  android-release-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      NODE_ENV: production
      EXPO_PUBLIC_GOOGLE_PLAY_GAMES_PROJECT_ID: '1011264688445'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: '1011264688445-389ovdnl0rk6bmk6scq8uooktt5jgb7m.apps.googleusercontent.com'
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            apps/mobile
            backend/src
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Android application version metadata
        run: |
          node -e "const app=require('./app.json').expo;const pkg=require('./package.json');if(app.version!==pkg.version)throw new Error('Expo and package versions differ');if(!(app.version.split('.').length===3&&app.version.split('.').every(x=>x.length>0&&Number.isSafeInteger(Number(x))&&String(Number(x))===x)))throw new Error('Invalid release version');console.log('Android native CI validation for '+app.version)"
      - name: Validate Expo SDK compatibility
        run: npx -y expo-doctor
      - name: Validate shared runtime sources
        shell: bash
        run: |
          test -f ../../backend/src/server/companions/trial-season.ts
          test -f ../../backend/src/server/companions/content.ts
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build release AAB
        working-directory: apps/mobile/android
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon
      - name: Verify native CI AAB exists and record its SHA-256
        working-directory: apps/mobile/android
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab
      - name: Retain native CI AAB for inspection (not a signed EAS release)
        uses: actions/upload-artifact@v4
        with:
          name: veldryn-native-validation-aab-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
