name: Regenerate regional gameplay bundles (temporary)
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-regional-area-bundles.yml
  push:
    branches:
      - feat/four-playable-sunscar-frostmarch-areas-20261107
    paths:
      - .github/workflows/rebuild-regional-area-bundles.yml
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/four-playable-sunscar-frostmarch-areas-20261107')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/four-playable-sunscar-frostmarch-areas-20261107
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Install shared mobile type dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build gameplay and co-op Edge entrypoints
        run: pnpm --dir backend build:online
      - name: Commit generated bundles to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(online): regenerate gameplay and co-op bundles after regional balancing"
            git push origin HEAD:feat/four-playable-sunscar-frostmarch-areas-20261107
          fi
