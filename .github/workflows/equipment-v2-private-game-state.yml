name: Equipment 2.0 private GameState boundary
on:
  pull_request:
    paths:
      - 'backend/tsconfig*.json'
      - 'backend/src/server/equipment/**'
      - 'apps/mobile/src/core/**'
      - 'apps/mobile/src/content/**'
      - 'apps/mobile/tsconfig.eq2-private-game-state.json'
      - 'apps/mobile/pnpm-lock.yaml'
      - 'backend/pnpm-lock.yaml'
      - '.github/workflows/equipment-v2-private-game-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-project-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            apps/mobile/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Backend strict typecheck without cross-project rehearsal modules
        run: pnpm --dir backend run typecheck
      - name: Compile all six exact cross-project tests with the existing mobile core TypeScript boundary
        if: ${{ !cancelled() }}
        id: compile_private
        run: pnpm --dir apps/mobile exec tsc -p tsconfig.eq2-private-game-state.json
      - name: Run all six private GameState rehearsals including negative cases
        if: ${{ !cancelled() && steps.compile_private.outcome == 'success' }}
        run: |
          for spec in delivery game-state gem-sidecar virtual-custody physical-delivery-staging effect-gem-policy; do
            node "apps/mobile/.eq2-private-state-build/backend/src/server/equipment/__tests__/equipment-crafting-v2-${spec}.test.js"
          done
      - name: Fail on hidden state routes or public imports
        if: ${{ !cancelled() }}
        run: |
          if git grep -n -E 'equipment-crafting-v2-(game-state|gem-sidecar|virtual-custody|private-game-state-type|authoritative-readiness|legacy-audit)' -- backend/online backend/supabase/functions apps/mobile/App.tsx apps/mobile/src/screens apps/mobile/src/navigation; then
            echo 'Private Equipment 2.0 GameState path imported by public code'
            exit 1
          fi
          grep -Eq 'export const EQUIPMENT_CRAFTING_V2_SERVER_RELEASED=false;' backend/src/server/equipment/equipment-crafting-v2-gate.ts
