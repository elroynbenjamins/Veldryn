name: Forge mastery temporary Edge regeneration

# Branch-scoped, single-purpose regeneration. Never runs on main or deploys.
on:
  push:
    branches:
      - feature/forge-mastery-dedicated-screen-20261121
    paths:
      - '.github/workflows/forge-mastery-codegen.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Regenerate Edge bundles from shared game engine
        run: pnpm --dir backend build:online
      - name: Commit generated code to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(forge): regenerate authoritative gameplay and coop Edge bundles"
            git push origin HEAD:refs/heads/feature/forge-mastery-dedicated-screen-20261121
          fi
