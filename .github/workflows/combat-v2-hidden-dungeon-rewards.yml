name: Combat 2.0 hidden dungeon reward QA
on:
  pull_request:
    paths:
      - 'backend/src/server/combat/v2/dungeon-reward*.ts'
      - 'backend/src/server/combat/v2/dungeon-rewards-v2.ts'
      - 'backend/src/server/combat/v2/dungeon-reward-engine-v2.ts'
      - 'backend/src/server/combat/v2/dungeon-reward-party-v2.ts'
      - 'backend/src/server/combat/v2/reactive-reflection-budget.ts'
      - 'backend/src/server/combat/v2/equipment-trait-engine-runtime.ts'
      - 'backend/src/server/combat/v2/__tests__/dungeon-reward-four-player-party.ts'
      - 'backend/src/server/combat/engine.ts'
      - 'backend/src/server/combat/types.ts'
      - 'backend/src/server/combat/v2/__tests__/dungeon-reward-reactive-engine.ts'
      - 'backend/src/server/combat/v2/__tests__/dungeon-rewards-and-combat-matrix.ts'
      - 'backend/src/server/combat/v2/__tests__/equipment-trait-exact-copy-boss-matrix.ts'
      - 'backend/src/server/combat/v2/unified-equipment-encounter.ts'
      - 'tools/combat-v2-live-edge-isolation.mjs'
      - 'tools/tests/combat-v2-edge-isolation.test.mjs'
      - 'tools/verify-gameplay-edge.mjs'
      - 'tools/build-online.mjs'
      - 'backend/online/**'
      - 'backend/supabase/functions/**'
      - 'apps/mobile/src/**'
      - '.github/workflows/combat-v2-hidden-dungeon-rewards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hidden-dungeon-reward-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Strict backend compile
        run: pnpm --dir backend build
      - name: Hidden dungeon reward choice/authority/combat matrix
        run: node backend/dist/server/combat/v2/__tests__/dungeon-rewards-and-combat-matrix.js
      - name: Signed reactive reward engine — bounded effects and legacy parity
        run: node backend/dist/server/combat/v2/__tests__/dungeon-reward-reactive-engine.js
      - name: Four-player party rewards, EQ2 shared reflection and forged ledger rejection
        run: node backend/dist/server/combat/v2/__tests__/dungeon-reward-four-player-party.js
      - name: Real unified Equipment/Skills/Boss reward integration and trait safety
        run: |
          node backend/dist/server/combat/v2/__tests__/equipment-trait-engine.js
          node backend/dist/server/combat/v2/__tests__/equipment-trait-exact-copy-boss-matrix.js
      - name: Legacy combat parity
        run: node backend/dist/server/combat/__tests__/combat-smoke.js
      - name: Reject hidden reward path imports in public runtime
        run: |
          # The two checked-in generated bundles legitimately contain deny-only shim names.
          # Require exact reproducible bytes, the private-source metafile fence, and
          # adversarial shim tests before excluding ONLY those two generated paths.
          node tools/tests/combat-v2-edge-isolation.test.mjs
          node tools/verify-gameplay-edge.mjs
          status=0
          git grep -n -E 'dungeon-rewards-v2|dungeon-reward-offers-v2|dungeon-reward-engine-v2|dungeon-reward-party-v2|reactive-reflection-budget|compileDraftDungeonRewardCombatV2|simulateDraftDungeonRewardCombatV2' -- ':(glob)backend/online/**/*.ts' ':(glob)backend/online/**/*.tsx' ':(glob)apps/mobile/src/**/*.ts' ':(glob)apps/mobile/src/**/*.tsx' ':(glob)backend/supabase/functions/**/*.ts' ':(glob)backend/supabase/functions/**/*.tsx' ':(exclude)backend/supabase/functions/gameplay/index.ts' ':(exclude)backend/supabase/functions/coop/index.ts' || status=$?
          if [ "$status" -ne 1 ]; then
            echo 'Hidden Dungeon 2.0 reward implementation leaked into public routes (or source scan failed)'
            exit 1
          fi
