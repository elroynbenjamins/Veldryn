name: Equipment 2.0 isolated server core (hidden)
on:
  pull_request:
    paths:
      - 'backend/src/server/equipment/equipment-crafting-v2-*.ts'
      - 'backend/src/server/equipment/__tests__/equipment-crafting-v2-*.test.ts'
      - 'backend/tsconfig.equipment-v2-core.json'
      - '.github/workflows/equipment-v2-server-core-hidden.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-server-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Typecheck server-only canonical EQ2 core (strict)
        run: pnpm --dir backend exec tsc -p tsconfig.equipment-v2-core.json
      - name: Test canonical rolls, exact copies, custody and transactional receipts
        run: |
          for spec in \
            equipment-crafting-v2-transaction \
            equipment-crafting-v2-instances \
            equipment-crafting-v2-custody \
            equipment-crafting-v2-commit-plan; do
            node "backend/dist-equipment-v2-core/server/equipment/__tests__/${spec}.test.js"
          done
