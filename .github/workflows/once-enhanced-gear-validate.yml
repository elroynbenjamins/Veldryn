name: One-time localization recheck after current Account UI contract
on:
  push:
    branches:
      - fix/auto-lock-enhanced-gear-and-allow-manual-sale
    paths:
      - '.github/workflows/once-enhanced-gear-validate.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-lock-enhanced-gear-and-allow-manual-sale
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Recheck localization and generated gameplay bundle
        shell: bash
        run: |
          set +e
          report=.enhanced-gear-localization-result.txt
          : > "$report"
          node tools/verify-gameplay-edge.mjs > /tmp/gear-bundle.txt 2>&1
          code=$?
          echo "bundle: $([ "$code" -eq 0 ] && echo PASS || echo FAIL)" >> "$report"
          if [ "$code" -ne 0 ]; then tail -n 8 /tmp/gear-bundle.txt >> "$report"; fi
          pnpm --dir apps/mobile test:localization > /tmp/gear-loc.txt 2>&1
          code=$?
          echo "localization: $([ "$code" -eq 0 ] && echo PASS || echo FAIL)" >> "$report"
          if [ "$code" -ne 0 ]; then tail -n 24 /tmp/gear-loc.txt >> "$report"; fi
          cat "$report"
          git config user.name "veldryn-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git commit -m "test: temporary localization recheck results"
          git push origin HEAD:refs/heads/fix/auto-lock-enhanced-gear-and-allow-manual-sale
