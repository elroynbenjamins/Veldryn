name: Material retirement review
on:
  pull_request:
    paths:
      - 'backend/supabase/review/material-retirement-*.sql'
      - 'tools/test-material-retirement-schema-fixture.mjs'
      - 'tools/test-echo-bat-wing-source-closure.mjs'
      - 'apps/mobile/tests/material-purpose-audit.ts'
      - 'tools/preview-echo-bat-wing-source-closure.mjs'
      - 'tools/material-retirement-review.mjs'
      - 'tools/audit-material-retirement-references.mjs'
      - '.github/workflows/material-retirement-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate read-only compensation fixture
        run: node tools/material-retirement-review.mjs
      - name: Preview exact drop closure without editing sources
        run: node tools/preview-echo-bat-wing-source-closure.mjs
      - name: Enumerate full checkout candidate references
        run: node tools/audit-material-retirement-references.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Audit expanded material registries and item-use regressions
        run: node tools/run-mobile-tests.mjs material-purpose-audit resource-codex
      - name: Exercise exact drop removal and rebuilt runtime bundles
        if: github.event_name == 'pull_request' && github.head_ref == 'review/material-purpose-loot-cleanup-20261124'
        run: |
          node tools/test-echo-bat-wing-source-closure.mjs --fixture-only
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
          node --input-type=module -e "import {readFileSync} from 'node:fs'; for(const p of ['gameplay','coop']) {const c=readFileSync('backend/supabase/functions/'+p+'/index.ts','utf8'); if(/itemId:\\s*['\x22]ECHO_BAT_WING['\x22]/.test(c)) throw Error('Remaining wing drop: '+p); if(!c.includes('RUNEBOUND_CORE')) throw Error('Protected core missing: '+p); console.log('PASS: '+p+' rebuilt without exact wing drop');}"
  atomic-retirement-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: retirement_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retirement_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test transaction and rollback on disposable database
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -U postgres -d retirement_fixture -v ON_ERROR_STOP=1 -f backend/supabase/review/material-retirement-atomic-pg17.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production-shaped transaction in disposable database
        env:
          PGPASSWORD: fixture-only
        run: |
          set -o pipefail
          node tools/test-material-retirement-schema-fixture.mjs | psql -h 127.0.0.1 -U postgres -d retirement_fixture -v ON_ERROR_STOP=1
