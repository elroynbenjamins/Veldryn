name: Weapon-swap canonical gameplay Edge parity (integration only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/mobile/src/core/game.ts'
      - 'apps/mobile/src/core/game-commands.ts'
      - 'apps/mobile/src/core/crafted-gear-ownership.ts'
      - '.github/workflows/weapon-swap-edge-sync.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/hp-safe-weapon-swap-post-v14-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Wire CombatScreen optional Inventory navigation on this integration branch
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path='apps/mobile/App.tsx';
          const current=fs.readFileSync(path,'utf8');
          const from="<CombatScreen state={state} onCommand={runCompanionCommand} initialMonsterId=";
          const to="<CombatScreen state={state} onCommand={runCompanionCommand} onOpenInventory={()=>setTab('Inventory')} initialMonsterId=";
          if(current.split(from).length!==2)throw Error('CombatScreen navigation callsite changed');
          fs.writeFileSync(path,current.replace(from,to));
          NODE
      - run: pnpm --dir backend build:online
      - run: node tools/verify-gameplay-edge.mjs
      - name: Commit only source-exact Edge bundles to this feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/mobile/App.tsx backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize weapon-swap gameplay and co-op Edge bundles'
            git push origin HEAD:refs/heads/integration/hp-safe-weapon-swap-post-v14-20261116
          fi
