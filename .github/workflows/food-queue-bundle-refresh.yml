name: Food queue branch bundle refresh (temporary)
on:
  push:
    branches:
      - feature/auto-eat-food-queue-20261113
    paths:
      - .github/workflows/food-queue-bundle-refresh.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-eat-food-queue-20261113
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build and verify canonical gameplay bundle
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(edge): sync generated gameplay bundle for food queue'
          git fetch origin feature/auto-eat-food-queue-20261113
          git rebase origin/feature/auto-eat-food-queue-20261113
          git push origin HEAD:feature/auto-eat-food-queue-20261113
