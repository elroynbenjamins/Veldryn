name: Regenerate gameplay bundle for character world progress fix

on:
  push:
    branches:
      - fix/character-world-progress-sunscar-20261114
    paths:
      - .github/workflows/repair-gameplay-bundle.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest repair branch tip
        run: |
          git fetch origin fix/character-world-progress-sunscar-20261114
          git checkout -B fix/character-world-progress-sunscar-20261114 origin/fix/character-world-progress-sunscar-20261114
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend and mobile dependencies for shared TypeScript imports
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build generated gameplay and coop Edge bundles from canonical engine
        run: pnpm --dir backend build:online
      - name: Commit deterministic generated artifacts to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(gameplay): regenerate Edge bundle after per-character world progress fix"
            git push origin HEAD:fix/character-world-progress-sunscar-20261114
          else
            echo "Generated bundles are already synchronized."
          fi
