name: Hidden Guild PvE V16 private reads + V17 real-engine effects

on:
  pull_request:
    paths:
      - 'backend/src/server/combat/guild-pve-authority-v16.ts'
      - 'backend/src/server/combat/guild-pve-effects-v17.ts'
      - 'apps/mobile/tests/guild-pve-v16-authority.ts'
      - 'apps/mobile/tests/guild-pve-v17-effects.ts'
      - 'apps/mobile/tests/guild-pve-v17-balance-matrix.ts'
      - 'apps/mobile/tsconfig.guild-pve-v16-v17.json'
      - 'docs/roadmap/guild-pve-v16-v17-20261122.md'
      - '.github/workflows/guild-pve-v16-v17-hidden-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-read-and-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ../../backend install --frozen-lockfile
      - name: Typecheck V16/V17 source and inherited contracts
        run: pnpm exec tsc -p tsconfig.guild-pve-v16-v17.json --noEmit
      - name: Compile isolated files
        run: pnpm exec tsc -p tsconfig.guild-pve-v16-v17.json --outDir .core-build
      - name: Validate V16 account/roster privacy and snapshot version
        run: node .core-build/apps/mobile/tests/guild-pve-v16-authority.js
      - name: Validate V17 combat evidence and phase counterplay
        run: node .core-build/apps/mobile/tests/guild-pve-v17-effects.js
      - name: Survey nine-class 729-scenario deterministic matrix (synthetic only)
        run: node .core-build/apps/mobile/tests/guild-pve-v17-balance-matrix.js
