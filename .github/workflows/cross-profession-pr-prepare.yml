name: Prepare cross-profession PR artifacts

# One-shot branch maintenance: update Expo-compatible patch pins and rebuild the
# authoritative generated Edge bundles. This file is removed before merge.
on:
  push:
    branches: [feature/cross-profession-components-20261112]
    paths: [.github/workflows/cross-profession-pr-prepare.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cross-profession-components-20261112
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install locked app and backend dependencies
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Update Expo SDK-compatible dependencies and lockfile
        run: |
          pnpm --dir apps/mobile add 'expo@~58.0.24' 'expo-crypto@~58.0.8' 'expo-linking@~58.0.17' 'expo-secure-store@~58.0.3' 'expo-splash-screen@~58.0.14' 'expo-status-bar@~58.0.5'
          pnpm --dir apps/mobile exec expo install --check
      - name: Rebuild and verify both gameplay Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit only regenerated release artifacts to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package.json apps/mobile/pnpm-lock.yaml backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Expo dependencies and generated bundles are already synchronized."
            exit 0
          fi
          git commit -m 'build: align Expo dependencies and synchronize shared Edge bundles'
          git push origin HEAD:feature/cross-profession-components-20261112
