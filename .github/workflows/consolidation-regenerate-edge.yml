name: Generate Edge parity for 1.0.5 consolidation

on:
  pull_request:
    paths:
      - '.github/workflows/consolidation-regenerate-edge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'consolidate/1-0-5-combat-and-account-collections-20261103' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install pinned backend
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Generate both gameplay and co-op Edge entrypoints
        run: pnpm --dir backend build:online
      - name: Verify generated gameplay is byte-for-byte current
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated artifacts to consolidation branch only
        run: |
          git diff --check
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Both generated bundles already match source.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(1.0.5): regenerate gameplay and coop Edge bundles from reconciled engine'
            git push origin HEAD:refs/heads/consolidate/1-0-5-combat-and-account-collections-20261103
          fi
