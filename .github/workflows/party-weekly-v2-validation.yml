name: Hidden weekly Party Event validation
on:
  pull_request:
    paths:
      - 'backend/src/server/party/weekly-party-events-v2.ts'
      - 'backend/src/server/party/weekly-party-boss-v2.ts'
      - 'backend/src/server/party/weekly-party-stage-prototype-v3.ts'
      - 'backend/src/server/party/weekly-party-finale-readiness-v3.ts'
      - 'backend/src/server/party/__tests__/weekly-party-finale-readiness-v3.ts'
      - 'backend/src/server/party/__tests__/weekly-party-stages-prototype-v3.ts'
      - 'tools/party-events-gear-calibration*'
      - 'tools/party-events-authoritative-calibration*'
      - 'backend/online/party-event-loadout-v4.ts'
      - 'backend/src/server/party/__tests__/weekly-party-events-v2.ts'
      - 'backend/package.json'
      - '.github/workflows/party-weekly-v2-validation.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/server/party/weekly-party-events-v2.ts'
      - 'backend/src/server/party/weekly-party-boss-v2.ts'
      - 'backend/src/server/party/weekly-party-stage-prototype-v3.ts'
      - 'backend/src/server/party/weekly-party-finale-readiness-v3.ts'
      - 'backend/src/server/party/__tests__/weekly-party-finale-readiness-v3.ts'
      - 'backend/src/server/party/__tests__/weekly-party-stages-prototype-v3.ts'
      - 'tools/party-events-gear-calibration*'
      - 'tools/party-events-authoritative-calibration*'
      - 'backend/online/party-event-loadout-v4.ts'
      - 'backend/src/server/party/__tests__/weekly-party-events-v2.ts'
      - 'backend/package.json'
      - '.github/workflows/party-weekly-v2-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  party-weekly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:party-weekly-v2
      - run: node ../tools/party-events-gear-calibration.mjs
      - run: node ../tools/party-events-authoritative-calibration.mjs
