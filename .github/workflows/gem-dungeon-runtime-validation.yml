name: Gem and dungeon runtime validation

# Cancel superseded PR checks; never cancel main, scheduled, or manual release checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Focused tests must still run while the separate release gate detects
# out-of-date generated Edge bundles. This does not weaken that release gate.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/core/**'
      - 'apps/mobile/src/content/gems-v1.ts'
      - 'apps/mobile/tests/stat-gem-runtime-v1.ts'
      - 'backend/src/server/combat/**'
      - 'backend/src/server/equipment/**'
      - 'backend/src/server/coop/**'
      - 'backend/online/**'
      - '.github/workflows/gem-dungeon-runtime-validation.yml'
  pull_request:
    paths:
      - 'apps/mobile/src/core/**'
      - 'apps/mobile/src/content/gems-v1.ts'
      - 'apps/mobile/tests/stat-gem-runtime-v1.ts'
      - 'backend/src/server/combat/**'
      - 'backend/src/server/equipment/**'
      - 'backend/src/server/coop/**'
      - 'backend/online/**'
      - '.github/workflows/gem-dungeon-runtime-validation.yml'
  workflow_dispatch:

jobs:
  mobile:
    name: Mobile typing and full core regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      # Full app and core typechecks plus all 429 checks run in mobile-core-validation.yml.
      # Keep this workflow's early, domain-specific failure signal only.
      - name: Run focused mobile gem regressions
        run: node tools/run-mobile-core-tests.mjs --match gem

  dungeon:
    name: Dungeon combat, effect gems and co-op simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Run all gem, composition and dungeon assertions (shared builds)
        run: |
          node tools/run-backend-test-batch.mjs \
            test:gems test:coop-composition test:dungeon-tier-balance \
            test:live-pacing test:qmode-merchant
      - name: Prove equipped gems persist through frozen dungeon snapshots
        run: node backend/dist/online/backend/online/tests/coop-loadout.js

