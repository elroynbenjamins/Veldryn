name: Verify gameplay Edge bundle parity

on:
  push:
    branches: [main]
    paths:
      - 'backend/online/**'
      - 'backend/src/**'
      - 'backend/data/**'
      - 'backend/supabase/functions/gameplay/index.ts'
      - 'backend/supabase/functions/coop/index.ts'
      - 'backend/package.json'
      - 'backend/pnpm-lock.yaml'
      - 'tools/verify-gameplay-edge.mjs'
      - '.github/workflows/verify-gameplay-edge.yml'
  pull_request:
    paths:
      - 'backend/online/**'
      - 'backend/src/**'
      - 'backend/data/**'
      - 'backend/supabase/functions/gameplay/index.ts'
      - 'backend/supabase/functions/coop/index.ts'
      - 'backend/package.json'
      - 'backend/pnpm-lock.yaml'
      - 'tools/verify-gameplay-edge.mjs'
      - '.github/workflows/verify-gameplay-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Verify committed Edge bundle exactly matches shared engine
        run: node tools/verify-gameplay-edge.mjs
      - name: Install mobile dependencies used by shared equipment and theme imports
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Verify server-owned dungeon loadouts change when equipment path changes
        run: |
          pnpm --dir backend exec tsc -p tsconfig.online.json
          node backend/dist/online/backend/online/tests/coop-loadout.js
