name: Regenerate Expo SDK lockfile (temporary)
on:
  push:
    branches:
      - fix/mobile-ci-and-navigation-measurements-20261022
    paths:
      - 'apps/mobile/package.json'
      - '.github/workflows/repair-expo-pnpm-lock-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-ci-and-navigation-measurements-20261022
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Reconcile lockfile using the real npm registry
        working-directory: apps/mobile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit the generated reproducible lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate pnpm lockfile for Expo SDK 57.0.31"
            git push origin HEAD:fix/mobile-ci-and-navigation-measurements-20261022
          fi
