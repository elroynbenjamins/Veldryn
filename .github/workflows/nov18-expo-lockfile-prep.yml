name: Temporary Expo lockfile regeneration

on:
  pull_request:
    paths:
      - 'apps/mobile/package.json'
      - 'apps/mobile/pnpm-lock.yaml'
      - '.github/workflows/nov18-expo-lockfile-prep.yml'

jobs:
  prepare-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Expo package and lockfile without bypassing frozen installs
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Export regenerated lockfile for connector read-back
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const content=fs.readFileSync('pnpm-lock.yaml','utf8');
          console.log('VELDRYN_LOCK_START '+content.length);
          for(let i=0;i<content.length;i+=400){
            console.log('VELDRYN_LOCK_CHUNK '+JSON.stringify(content.slice(i,i+400)));
          }
          console.log('VELDRYN_LOCK_END');
          NODE
