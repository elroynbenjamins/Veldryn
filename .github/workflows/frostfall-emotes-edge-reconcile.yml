name: Frostfall emotes Edge reconciliation
on:
  push:
    branches: [frostfall-emotes-integration]
    paths:
      - '.github/workflows/frostfall-emotes-edge-reconcile.yml'
permissions:
  contents: write
concurrency:
  group: frostfall-emotes-edge-reconcile
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frostfall-emotes-integration
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild and verify canonical Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Verify Frostfall regressions
        run: node tools/run-mobile-tests.mjs annual-events-v2 live-event-catalog frostfall-companion-rework
      - name: Commit only generated server bundles to the candidate
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generator changes:\n%s\n' "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(edge): sync Frostfall emote gameplay and co-op bundles'
          git fetch origin frostfall-emotes-integration
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/frostfall-emotes-integration)"
          git push origin HEAD:frostfall-emotes-integration
