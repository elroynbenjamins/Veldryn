name: Crafting batch feature bundle sync
on:
  push:
    branches:
      - feature/crafting-batch-slider-ux
    paths:
      - .github/workflows/crafting-batch-bundle-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-feature-bundle:
    if: github.ref == 'refs/heads/feature/crafting-batch-slider-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install shared dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Generate canonical gameplay and co-op bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit bundles on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Bundles already up to date"
            exit 0
          fi
          git commit -m "build(edge): regenerate gameplay bundle for crafting batches"
          git push origin HEAD:feature/crafting-batch-slider-ux
