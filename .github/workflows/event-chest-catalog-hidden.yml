  workflow_dispatch:
permissions:
  contents: read
jobs:
  chest-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Compile the hidden chest catalogs and focused scenarios
        run: pnpm exec tsc -p tsconfig.event-chests.json
      - name: Verify equal Party Event gear and three chest sources
        run: node .event-chest-tests/server/party/__tests__/weekly-party-event-chests-v51.js
      - name: Verify Equipment 2.0 Party Event equipped bonuses and conditional procs
        run: node .event-chest-tests/server/party/__tests__/weekly-party-event-combat-v59.js
      - name: Verify transactional Party Event chest and exchange replay
        run: node .event-chest-tests/server/party/__tests__/weekly-party-event-claim-v60.js
      - name: Verify hidden Party Event V61 canonical reward evidence and V62 read model
        run: |
          node .event-chest-tests/server/party/__tests__/weekly-party-event-proof-v61.js
          node .event-chest-tests/server/party/__tests__/weekly-party-event-rewards-v62.js
      - name: Execute review-only Party Event reward ledger in disposable PGlite
        run: node tests/party-event-reward-ledger-v61.mjs
      - name: Verify V63 transaction-boundary, lost ACK, rollback and V64 Equipment 2.0 issuer safety
        run: |
          node .event-chest-tests/server/party/__tests__/weekly-party-event-equipment-v64.js
          node .event-chest-tests/server/party/__tests__/weekly-party-event-atomic-store-v63.js
      - name: Verify canonical Party Sigils wallet source and 180 Event Equipment template descriptors
        run: |
          node .event-chest-tests/server/party/__tests__/weekly-party-sigils-ledger-v65.js
          node .event-chest-tests/server/party/__tests__/weekly-party-equipment-templates-v66.js
      - name: Exercise review-only V65 Party Sigils ledger on disposable PostgreSQL
        run: node tests/party-sigils-ledger-v65.mjs
      - name: Verify mobile Party Event treasure remains a read-only QA design
        run: node ../apps/mobile/tests/party-event-treasure-preview-ui.cjs
      - name: Guard mobile World Boss chest cards as read-only previews
        run: node ../apps/mobile/tests/world-boss-chest-preview-ui.cjs
      - name: Verify consolidated V64/V65 30-piece catalog, rarity and skill-only set thresholds
        run: node .event-chest-tests/server/combat/__tests__/world-boss-gathering-regression-v64.js
      - name: Verify original World Boss gathering gear, 1 percent odds, source caps
        run: node .event-chest-tests/server/combat/__tests__/world-boss-chests-v58.js
      - name: Verify World Boss milestone proof and cross-account replay safety
        run: node .event-chest-tests/server/combat/__tests__/world-boss-chest-proof-v59.js
      - name: Verify World Boss V60 1 percent settlement plans and gathering-only gear
        run: node .event-chest-tests/server/combat/__tests__/world-boss-chest-resolution-v60.js
      - name: Verify World Boss V61 exactly-once ledger, rollback, and V62 issued gear
        run: node .event-chest-tests/server/combat/__tests__/world-boss-chest-settlement-v61.js
      - name: Verify V77 canonical Party settlement-source to chest entitlement bridge
        run: node .event-chest-tests/server/party/__tests__/weekly-party-event-chest-source-v77.js
      - name: Verify generic V67 chest tables and V68 legacy parity
        run: node .event-chest-tests/server/loot/__tests__/chest-loot-engine-v67.js
      - name: Verify World Boss V72 account-bound replay-proof source for reusable chests
        run: node .event-chest-tests/server/loot/__tests__/world-boss-chest-source-v72.js
      - name: Verify V73 pinned World Boss SQL proof and V57 event-first privacy gate
        run: node .event-chest-tests/server/loot/__tests__/world-boss-chest-pg-source-v73.js
      - name: Verify V69 shared receipt-first settlement, rollback, replay and source locks
        run: node .event-chest-tests/server/loot/__tests__/chest-reward-settlement-v69.js
      - name: Reject tampered Party/Event reward legs and phantom item custody on replay
        run: node .event-chest-tests/server/loot/__tests__/chest-postgres-replay-guard-v85.js
      - name: Run V70 real SQL account-locked receipt/physical payout regression
        run: |
          node tests/chest-reward-ledger-v70.mjs
          node tests/chest-postgres-store-v70.mjs
      - name: Verify V87 trusted Party SQL source, independent tier/victory and three chest entitlements
        run: |
          node .event-chest-tests/server/party/__tests__/weekly-party-event-canonical-pg-v87.js
          node tests/party-event-canonical-source-v87.mjs
      - name: Exercise V88 integrated V87 authoritative SQL plus V86 real rewards in one V70 transaction
        run: node tests/party-event-real-rewards-v86.mjs
      - name: Verify original Party V80 paid-Inbox history and V81 legacy claim guard
        run: node tests/party-event-inbox-v80.mjs
      - name: Verify V83 real World Boss wallet, account-state and Inbox custody in disposable PostgreSQL
        run: node tests/world-boss-real-reward-ports-v83.mjs
      - name: Verify V84 immutable World Boss Equipment 2.0 account-unclaimed custody
        run: node tests/world-boss-eq2-unclaimed-v84.mjs
      - name: Verify V80 immutable earned chests in disposable private PostgreSQL
        run: node tests/chest-earned-entitlement-v80.mjs
      - name: Verify V81 Equipment 2.0 T1–T5 gate and T6–T9 deferred guarantees
        run: node .event-chest-tests/server/loot/__tests__/chest-eq2-release-gate-v81.js
      - name: Verify V82 frozen earned-chest EQ2 candidate, tier and ownership parity
        run: node .event-chest-tests/server/loot/__tests__/chest-eq2-earned-bridge-v82.js
      - name: Verify V71 Party/World Equipment 2.0 binding and owner custody
        run: node .event-chest-tests/server/loot/__tests__/chest-equipment-bridge-v71.js
      - name: Verify private World Boss V63 PG adapter and catalog-derived V67 tiers
        run: node .event-chest-tests/server/combat/__tests__/world-boss-chest-private-pg-v63.js
      - name: Verify server-only deterministic chest entropy and replay safety
        run: node .event-chest-tests/server/loot/__tests__/event-chest-server-roll-v1.js
      - name: Verify non-paying read-only Party/World chest panel states and collection
        run: node .event-chest-tests/server/loot/__tests__/event-chest-preview-v2.js
      - name: Reject accidental live server runtime import or reward enablement
        run: |
          set -euo pipefail
          grep -q 'PARTY_EVENT_GEAR_V51_RELEASED=false' src/server/party/weekly-party-event-gear-v51.ts
          grep -q 'PARTY_EVENT_CHESTS_V51_RELEASED=false' src/server/party/weekly-party-event-chests-v51.ts
          grep -q 'PARTY_EVENT_COMBAT_V59_RELEASED=false' src/server/party/weekly-party-event-combat-v59.ts
          grep -q 'PARTY_EVENT_REWARD_GATEWAY_V60_RELEASED=false' src/server/party/weekly-party-event-claim-v60.ts
          grep -q 'PARTY_EVENT_PROOF_V61_RELEASED=false' src/server/party/weekly-party-event-proof-v61.ts
          grep -q 'PARTY_EVENT_REWARD_READ_V62_RELEASED=false' src/server/party/weekly-party-event-rewards-v62.ts
          grep -q 'PARTY_EVENT_ATOMIC_STORE_V63_RELEASED=false' src/server/party/weekly-party-event-atomic-store-v63.ts
          grep -q 'PARTY_EVENT_EQUIPMENT_BRIDGE_V64_RELEASED=false' src/server/party/weekly-party-event-equipment-v64.ts
          grep -q 'PARTY_SIGILS_V65_RELEASED=false' src/server/party/weekly-party-sigils-ledger-v65.ts
          grep -q 'PARTY_EVENT_TEMPLATES_V66_RELEASED=false' src/server/party/weekly-party-equipment-templates-v66.ts
          test ! -f supabase/migrations/20261119094500_party_sigils_account_ledger_v65.sql
          test ! -f supabase/migrations/20261119070000_party_event_reward_ledger_v61.sql
          grep -q 'WORLD_BOSS_CHESTS_V58_RELEASED=false' src/server/combat/world-boss-chests-v58.ts
          grep -q 'WORLD_BOSS_GATHERING_LOOT_V64_LIVE=false' src/server/combat/world-boss-gathering-loot-v64.ts
          grep -q 'WORLD_BOSS_CHEST_PROOF_V59_LIVE=false' src/server/combat/world-boss-chest-proof-v59.ts
          grep -q 'WORLD_BOSS_CHEST_RESOLUTION_V60_LIVE=false' src/server/combat/world-boss-chest-resolution-v60.ts
          grep -q 'WORLD_BOSS_CHEST_GATEWAY_V61_LIVE=false' src/server/combat/world-boss-chest-settlement-v61.ts
          grep -q 'WORLD_BOSS_GATHERING_INSTANCE_V62_LIVE=false' src/server/combat/world-boss-gathering-instance-v62.ts
          grep -q 'WORLD_BOSS_CHEST_PRIVATE_PG_V63_LIVE=false' src/server/combat/world-boss-chest-private-pg-v63.ts
          grep -q 'WORLD_BOSS_TIER_POLICY_V67_LIVE=false' src/server/combat/world-boss-tier-policy-v67.ts
          test ! -f supabase/migrations/20261119_world_boss_gathering_items_v67_review_only.sql
          test ! -f supabase/migrations/20261119_world_boss_chest_ledger_v61_review_only.sql
          grep -q 'EVENT_CHEST_SERVER_ROLL_V1_RELEASED=false' src/server/loot/event-chest-server-roll-v1.ts
          grep -q 'CHEST_LOOT_ENGINE_V67_RELEASED=false' src/server/loot/chest-loot-engine-v67.ts
          grep -q 'WORLD_BOSS_CHEST_PG_SOURCE_V73_RELEASED=false' src/server/loot/world-boss-chest-pg-source-v73.ts
          grep -q 'WORLD_BOSS_REAL_REWARDS_V83_RELEASED=false' src/server/loot/world-boss-real-reward-ports-v83.ts
          grep -q 'WORLD_BOSS_EQ2_ESCROW_V84_RELEASED=false' src/server/loot/world-boss-eq2-unclaimed-v84.ts
          test ! -f supabase/migrations/20261119201000_world_boss_eq2_quarantine_v84_review_only.sql
          test ! -f supabase/migrations/20261119200000_world_boss_real_wallet_v83_review_only.sql
          grep -q 'WORLD_BOSS_SHARED_CHEST_SOURCE_V72_RELEASED=false' src/server/loot/world-boss-chest-source-v72.ts
          grep -q 'PARTY_EVENT_CHEST_SOURCE_V77_RELEASED=false' src/server/party/weekly-party-event-chest-source-v77.ts
          grep -q 'CHEST_REWARD_SETTLEMENT_V69_RELEASED=false' src/server/loot/chest-reward-settlement-v69.ts
          grep -q 'CHEST_POSTGRES_STORE_V70_RELEASED=false' src/server/loot/chest-postgres-store-v70.ts
          grep -q 'PARTY_EVENT_INBOX_HISTORY_V80_RELEASED=false' src/server/party/weekly-party-event-inbox-v80.ts
          grep -q 'PARTY_EVENT_REAL_REWARDS_V86_RELEASED=false' src/server/party/weekly-party-event-real-reward-ports-v86.ts
          grep -q 'PARTY_EVENT_CANONICAL_PG_V87_RELEASED=false' src/server/party/weekly-party-event-canonical-pg-v87.ts
          grep -q 'PARTY_EVENT_ATOMIC_PORTS_V88_RELEASED=false' src/server/party/weekly-party-event-atomic-ports-v88.ts
          test ! -f supabase/migrations/20261121161500_party_event_authoritative_settlement_v87_REVIEW_ONLY.sql
          test ! -f supabase/migrations/20261121144000_party_event_real_rewards_v86_REVIEW_ONLY.sql
          test ! -f supabase/migrations/20261119120000_party_event_inbox_history_guard_v81.sql
          grep -q 'CHEST_EARNED_ENTITLEMENT_V80_RELEASED=false' src/server/loot/chest-earned-entitlement-v80.ts
          grep -q 'CHEST_EQ2_RELEASE_GATE_V81_RELEASED=false' src/server/loot/chest-eq2-release-gate-v81.ts
          grep -q 'CHEST_EARNED_EQ2_BRIDGE_V82_RELEASED=false' src/server/loot/chest-eq2-earned-bridge-v82.ts
          test ! -f supabase/migrations/20261119172000_chest_earned_entitlements_v80_review_only.sql
          grep -q 'CHEST_EQUIPMENT_BRIDGE_V71_RELEASED=false' src/server/loot/chest-equipment-bridge-v71.ts
          test ! -f supabase/migrations/20261119104500_universal_chest_ledger_v70.sql
          grep -q 'EVENT_CHEST_REWARD_PANEL_V2_RELEASED=false' src/server/loot/event-chest-preview-v2.ts
          test ! -f supabase/migrations/20261118_event_chests_v51_v58.sql
          echo 'EVENT_CHESTS_HIDDEN_VALIDATION_OK'
