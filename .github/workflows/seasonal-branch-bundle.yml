name: Rebuild seasonal quest branch gameplay bundle
on:
  push:
    branches:
      - feature/per-character-seasonal-quests-20261114
    paths:
      - '.github/workflows/seasonal-branch-bundle.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-character-seasonal-quests-20261114
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend and mobile locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild canonical gameplay and co-op Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit only generated Edge artifacts to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Generated bundles already match shared source."
            exit 0
          fi
          git commit -m "build(edge): sync hardened seasonal quest migration bundle"
          git push origin HEAD:feature/per-character-seasonal-quests-20261114
