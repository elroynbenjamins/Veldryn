# Temporary release-integrity workflow: regenerate the authoritative gameplay and
# co-op Edge bundles on the isolated weapon-bonus engine branch only.
name: Reconcile all-tier weapon bonus Edge bundles

on:
  push:
    branches: ['feat/weapon-bonus-all-tiers-engine-20261120']
    paths: ['.github/workflows/weapon-bonus-reconcile-edge.yml']

permissions:
  contents: write

concurrency:
  group: weapon-bonus-edge-reconcile
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weapon-bonus-all-tiers-engine-20261120
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild and commit only authoritative generated Edge bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin feat/weapon-bonus-all-tiers-engine-20261120
            git reset --hard origin/feat/weapon-bonus-all-tiers-engine-20261120
            pnpm --dir backend build:online
            node tools/verify-gameplay-edge.mjs
            unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index[.]ts$' || true)
            if [ -n "$unexpected" ]; then
              printf 'Unexpected files modified by build:\\n%s\\n' "$unexpected" >&2
              exit 1
            fi
            git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
            if git diff --cached --quiet; then
              echo 'Generated Edge bundles already synchronized.'
              exit 0
            fi
            git commit -m 'build(edge): reconcile T1-T9 weapon bonus gameplay and co-op bundles'
            if git push origin HEAD:feat/weapon-bonus-all-tiers-engine-20261120; then
              echo 'Canonical bundles committed to feature branch.'
              exit 0
            fi
            echo "Branch moved during bundle synchronization, retrying ($attempt)."
          done
          echo 'Unable to push generated bundles without racing new commits.' >&2
          exit 1
