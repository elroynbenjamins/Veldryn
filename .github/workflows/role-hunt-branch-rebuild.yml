# Temporary PR-only rebuild to verify server bundle before merge.
# Re-run after measured tank class solo hunt calibration.
name: Solo hunt PR generated gameplay parity
on:
  push:
    branches: [balance/solo-role-hunt-parity-20261113]
    paths:
      - '.github/workflows/role-hunt-branch-rebuild.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/solo-role-hunt-parity-20261113
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated server-owned Edge artifacts on PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated Edge bundles already match.'
          else
            git commit -m 'build(edge): sync solo-hunt balance on PR branch'
            git push origin HEAD:balance/solo-role-hunt-parity-20261113
          fi
