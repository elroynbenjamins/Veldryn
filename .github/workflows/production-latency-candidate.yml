name: Idle reward reuse candidate bundle and regression validation
on:
  push:
    branches: ['perf/idle-reward-reuse-20261126']
    paths:
      - '.github/workflows/production-latency-candidate.yml'
      - 'backend/online/**'
      - 'apps/mobile/src/core/game.ts'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: idle-reward-reuse-candidate
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.ref == 'refs/heads/perf/idle-reward-reuse-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/idle-reward-reuse-20261126
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build and verify canonical Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Run gameplay, dungeon and guild regressions
        run: pnpm --dir backend test:online
      - name: Commit generated files only to the isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          branch=perf/idle-reward-reuse-20261126
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected tracked changes:\n%s\n' "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(edge): synchronize validated idle reward reuse bundles'
          git fetch origin "$branch"
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse "origin/$branch")" ]; then
            echo 'Candidate advanced; refusing to push stale bundles.'
            exit 1
          fi
          git push origin "HEAD:$branch"
