name: Admin QA generated bundle

on:
  pull_request:
    paths:
      - 'backend/online/**'
      - 'apps/mobile/src/**'
      - 'tools/build-online.mjs'
      - '.github/workflows/admin-qa-generated-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    if: github.head_ref == 'feature/online-admin-qa-account' || github.ref_name == 'feature/online-admin-qa-account'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/online-admin-qa-account
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir backend install --frozen-lockfile
      - run: node tools/build-online.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: admin-qa-gameplay-bundle
          path: backend/supabase/functions/gameplay/index.ts
          if-no-files-found: error
      - name: Commit generated gameplay bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate online gameplay bundle for Admin QA"
            git push origin HEAD:feature/online-admin-qa-account
          fi
