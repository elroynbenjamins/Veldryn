name: Temporary guild commission gameplay bundle regeneration
on:
  push:
    branches:
      - feat/guild-bank-inventory-and-component-crafting-20261103
    paths:
      - .github/workflows/guild-commission-bundle-sync.yml
permissions:
  contents: write
jobs:
  rebuild-bundle:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - name: Commit only the generated gameplay bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "build(gameplay): sync released guild crafting recipes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
