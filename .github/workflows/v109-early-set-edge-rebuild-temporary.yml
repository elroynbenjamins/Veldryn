name: Temporary Veldryn v1.0.9 equipment Edge bundle sync

on:
  push:
    branches:
      - fix/early-set-bonuses-asterfall-l10-20261114
    paths:
      - '.github/workflows/v109-early-set-edge-rebuild-temporary.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build and verify deployable Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundle synchronization to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated bundles already match shared sources.'
            exit 0
          fi
          git commit -m 'build(edge): synchronize T1-T4 equipment bonus runtime bundles'
          git push origin HEAD:fix/early-set-bonuses-asterfall-l10-20261114
