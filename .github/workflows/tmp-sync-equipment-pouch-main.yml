name: Temporary Equipment Pouch main reconciliation
on:
  push:
    branches: [feat/character-equipment-pouch-automatic-rewards]
    paths: [.github/workflows/tmp-sync-equipment-pouch-main.yml]
permissions:
  contents: write
concurrency:
  group: tmp-equipment-pouch-main-sync
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/character-equipment-pouch-automatic-rewards
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest main, favor new main for overlapping hunks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs origin/main -m "Merge latest main into Equipment Pouch feature while retaining boss potion changes"
          git push origin HEAD:feat/character-equipment-pouch-automatic-rewards
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Check both feature sets survived merge
        run: |
          grep -q 'equipment_pouch_move' apps/mobile/src/core/game-commands.ts
          grep -q 'equipment_pouch_upgrade' apps/mobile/src/core/game-commands.ts
          grep -q 'equipmentPouch' apps/mobile/src/core/types.ts
          grep -q 'tryStoreEquipmentInPouch' apps/mobile/src/core/game.ts
          grep -q 'select_healing_potion' apps/mobile/src/core/game-commands.ts
          grep -q 'selectHealingPotion' apps/mobile/src/core/game.ts
          grep -q 'equippedHealingPotionId' apps/mobile/src/core/types.ts
      - name: Compile gameplay and run affected regressions
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm exec tsc -p tsconfig.core.json --outDir .core-build
          export NODE_PATH=../../backend/node_modules
          for test in equipment-pouch equipment-timed-crafting-queue equipment-crafted-instance-results gem-pouch character-delete-management v40-idle-rule-boundaries combat-presentation ui-feedback-microinteraction-contract; do
            node ".core-build/apps/mobile/tests/$test.js"
          done
          node tests/storage-dungeon-refinement-ui.cjs
          node tests/online-loading-interactions.cjs
          node ../../tools/validate-scroll-indicators.mjs
      - name: Build and verify gameplay Edge bundle against merged engine
        run: |
          node tools/build-online.mjs
          node tools/verify-gameplay-edge.mjs
      - name: Commit authoritative gameplay Edge bundle
        run: |
          set -euo pipefail
          git add backend/supabase/functions/gameplay/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(gameplay): regenerate bundle after reconciling main"
            git push origin HEAD:feat/character-equipment-pouch-automatic-rewards
          fi
