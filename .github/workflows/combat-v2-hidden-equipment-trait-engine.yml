name: Combat 2.0 hidden equipment trait engine
on:
  pull_request:
    paths:
      - 'backend/src/server/combat/engine.ts'
      - 'backend/src/server/combat/types.ts'
      - 'backend/src/server/combat/v2/equipment-trait-engine-*.ts'
      - 'backend/src/server/combat/v2/equipment-trait-exact-copy-adapter.ts'
      - 'backend/src/server/combat/v2/unified-equipment-encounter.ts'
      - 'backend/src/server/combat/v2/__tests__/equipment-trait-*.ts'
      - '.github/workflows/combat-v2-hidden-equipment-trait-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Strict real backend TypeScript compilation
        run: pnpm --dir backend build
      - name: Token, hit, reflection, heal and replay safety
        run: node backend/dist/server/combat/v2/__tests__/equipment-trait-engine.js
      - name: Six regional bosses x nine classes x two real specialization paths with exact item receipts
        run: node backend/dist/server/combat/v2/__tests__/equipment-trait-exact-copy-boss-matrix.js
      - name: Baseline legacy engine parity and Enemy V2 token coexistence
        run: |
          node backend/dist/server/combat/v2/__tests__/enemy-engine-coexistence.js
          node backend/dist/server/combat/__tests__/combat-smoke.js
      - name: Reject new trait engine authority in live/public mobile or online code
        run: |
          if grep -R -E 'issueEquipmentV2TraitAuthority|authorizeEquipmentV2TraitEngine|EquipmentTraitRuntimeV2' backend/online apps/mobile/src backend/supabase/functions --include='*.ts' --include='*.tsx'; then
            echo 'Hidden Equipment 2.0 trait engine leaked into public routes'
            exit 1
          fi
