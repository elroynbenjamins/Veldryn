name: v1.0.10 Q-Mode roster diagnostic (branch only)
on:
  push:
    branches: ['diagnostics/v1010-qmode-roster-clear-rate-20261116']
    paths: ['.github/workflows/v1010-qmode-roster-scan-temp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Run Q-Mode power/level diagnostic
        run: |
          pnpm --dir backend exec tsc -p tsconfig.online.json
          node backend/dist/online/backend/online/tests/qmode-pressure-baseline.js
