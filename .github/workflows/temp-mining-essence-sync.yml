name: Temporary Mining Essence gameplay bundle sync

on:
  push:
    branches: [feat/mining-essence-for-early-equipment-enchanting-106]
    paths:
      - '.github/workflows/temp-mining-essence-sync.yml'
      - 'apps/mobile/src/core/game.ts'
      - 'apps/mobile/src/core/equipment-enhancement.ts'
      - 'apps/mobile/src/content/mining-essence.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install pinned backend tooling
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Regenerate authoritative shared gameplay and co-op bundles
        run: node tools/build-online.mjs
      - name: Verify deterministic gameplay bundle parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated gameplay bundle to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(gameplay): sync Mining Essence and enchanting rules"
            git push origin HEAD:feat/mining-essence-for-early-equipment-enchanting-106
          fi
