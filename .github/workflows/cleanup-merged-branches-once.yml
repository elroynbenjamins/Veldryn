          deleted=0
          skipped=0
          while IFS=$'\t' read -r branch expected; do
            [ -n "$branch" ] || continue
            if [ "$branch" = "main" ]; then
              echo "Refusing to delete main"
              exit 1
            fi
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$current" = "$expected" ]; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "Deleted $branch"
              deleted=$((deleted+1))
            else
              echo "Skipped $branch: expected $expected, current ${current:-missing}"
              skipped=$((skipped+1))
            fi
          done < /tmp/merged-branches.tsv
          echo "Deleted $deleted branches; skipped $skipped."
