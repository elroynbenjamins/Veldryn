name: Mobile UX validation

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'tools/mobile-core-tests.json'
      - '.github/workflows/mobile-ux-validation.yml'
  workflow_dispatch:

jobs:
  typecheck-and-core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck app and core
        run: pnpm typecheck && pnpm typecheck:core
      - name: Run mobile core tests
        run: pnpm test:core
