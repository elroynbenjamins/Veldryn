name: v1.0.10 three-role roster candidate Edge sync
# Disposable release-only integration helper. Remove before release-branch merge.
on:
  push:
    branches: ['integration/v1010-three-role-roster-afk-20261116']
    paths: ['.github/workflows/v1010-three-role-rebuild-temp.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v1010-three-role-roster-edge-temp
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1010-three-role-roster-afk-20261116
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked dependencies
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Verify three-role, legacy, queue and AFK account contracts
        run: |
          node tools/run-mobile-tests.mjs account-progression offline-cap character-creation-onboarding character-delete-management account-collectibles equipment-timed-crafting-queue equipment-timed-crafting-ui-contract online-roster
          pnpm --dir apps/mobile typecheck
      - name: Build authoritative gameplay and coop Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Reject unexpected generated changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated changes:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit only rebuilt canonical Edge bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Canonical Edge sources already match.'
            exit 0
          fi
          git commit -m 'build(edge): synchronize three-role 1.0.10 release gameplay and coop'
          git push origin HEAD:integration/v1010-three-role-roster-afk-20261116
