name: Veldryn v1.0.9 merge regression

# Cancel superseded PR checks; never cancel main, scheduled, or manual release checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      # Keep historical badge/gear/profile regression coverage without rerunning
      # the entire legacy suite for unrelated social, cooking or world UI edits.
      - 'apps/mobile/package.json'
      - 'apps/mobile/pnpm-lock.yaml'
      - 'apps/mobile/src/core/player-badges.ts'
      - 'apps/mobile/src/core/profile-*.ts'
      - 'apps/mobile/src/core/equipment-*.ts'
      - 'apps/mobile/src/core/crafted-gear-*.ts'
      - 'apps/mobile/src/core/weapon-bonus-rolls.ts'
      - 'apps/mobile/src/components/profile/**'
      - 'apps/mobile/src/components/*Badge*.tsx'
      - 'apps/mobile/src/components/OptionPager.tsx'
      - 'apps/mobile/src/screens/Profile*.tsx'
      - 'apps/mobile/tests/profile-*.ts'
      - 'apps/mobile/tests/*badge*.ts'
      - 'apps/mobile/tests/weapon-bonus-rolls.ts'
      - 'backend/supabase/migrations/*badge*'
      - 'backend/supabase/tests/profile_badges_tenure_fixture.sql'
      - 'tools/test-player-badge-tenure-db.mjs'
      - 'tools/run-mobile-core-tests.mjs'
      - 'tools/mobile-core-tests.json'
      - '.github/workflows/v1-0-9-merge-validation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Install backend dependencies (including PGlite)
        run: pnpm --dir backend install --frozen-lockfile
      # Full core coverage is enforced by mobile-core-validation.yml for these paths.
      # This focused selection also includes the PGlite badge tenure fixture.
      - name: Run focused badge, profile and weapon regressions
        shell: bash
        run: |
          set -euo pipefail
          node tools/run-mobile-core-tests.mjs --match badge --match profile --match weapon 2>&1 | tee core-results.log
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v109-focused-regression-results
          path: core-results.log
          if-no-files-found: ignore
          retention-days: 7
