name: Integrate latest main into class balance and synchronize Edge
on:
  push:
    branches:
      - balance/class-gear-stat-identity
    paths:
      - '.github/workflows/class-balance-integrate-main-once.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate newer Guild Project work without resetting class rebalance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          # Both branches translated the same Guild copy. Prefer the newer
          # main wording for conflicting localization hunks; untouched class
          # and combat sources retain the feature branch changes.
          git merge --no-edit --no-ff -X theirs origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Rebuild both authoritative Edge functions with merged content
        run: pnpm --dir backend build:online
      - name: Commit generated bundles and push merge
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize Edge with main Guild choices and class rebalance'
          fi
          git push origin HEAD:refs/heads/balance/class-gear-stat-identity
