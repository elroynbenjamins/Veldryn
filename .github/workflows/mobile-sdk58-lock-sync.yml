name: Release PR-only Expo SDK lock sync

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - 'apps/mobile/package.json'
      - '.github/workflows/mobile-sdk58-lock-sync.yml'

concurrency:
  group: mobile-sdk58-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-lock:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/mobile-ci-baseline-20261113' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Resolve exactly the currently pinned mobile SDK dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
            git reset --hard "refs/remotes/origin/${GITHUB_HEAD_REF}"
            pnpm --dir apps/mobile install --lockfile-only --no-frozen-lockfile
            pnpm --dir apps/mobile install --frozen-lockfile
            pnpm --dir apps/mobile exec expo install --check
            git add apps/mobile/pnpm-lock.yaml
            if git diff --cached --quiet; then
              echo 'Locked mobile dependencies already satisfy Expo SDK.'
              exit 0
            fi
            git commit -m 'chore(release): sync Expo 58.0.25 dependency lockfile'
            if git push origin "HEAD:${GITHUB_HEAD_REF}"; then
              echo 'Dependency lockfile updated on draft release PR only.'
              exit 0
            fi
            echo "PR head moved while locking (attempt ${attempt}); re-resolving."
          done
          echo 'Unable to synchronize dependency lock without overwriting a newer commit.' >&2
          exit 1
