<script>const classes=[{"id":"IRONWARDEN","name":"Ironwarden","role":"Tank","description":"Runic defender built around guard, threat and counterplay.","hp":155,"attack":15,"defense":19,"starterEquipment":{"weapon":"basic_sword"},"skin":"aster-iron","accent":"#70BDFA","traits":"Guard · Threat · Counterplay"},{"id":"BASTION","name":"Bastion","role":"Tank","description":"Fortress tank using layered barriers and heavy protection.","hp":164,"attack":14,"defense":20,"starterEquipment":{"weapon":"basic_tower_shield"},"skin":"lastwall-panoply","accent":"#E8C875","traits":"Barriers · Fortification · Protection"},{"id":"DREADGUARD","name":"Dreadguard","role":"Tank","description":"Aggressive control tank using threat, dread and self-sustain.","hp":150,"attack":17,"defense":17,"starterEquipment":{"weapon":"basic_chained_weapon"},"skin":"mournchain-harness","accent":"#BC91EF","traits":"Dread · Control · Self-sustain"},{"id":"DAWNKEEPER","name":"Dawnkeeper","role":"Support","description":"Solar support focused on healing, cleansing and protection.","hp":118,"attack":14,"defense":13,"starterEquipment":{"weapon":"basic_mace"},"skin":"thread-of-dawn","accent":"#F6D884","traits":"Healing · Cleansing · Protection"},{"id":"WAYFINDER","name":"Wayfinder","role":"Damage","description":"Precise ranged hunter with reliable sustained damage.","hp":110,"attack":21,"defense":11,"starterEquipment":{"weapon":"basic_bow"},"skin":"regretwalker","accent":"#9EC57F","traits":"Range · Precision · Sustained damage"},{"id":"RAVAGER","name":"Ravager","role":"Damage","description":"Aggressive heavy melee fighter built around breaking defenses.","hp":128,"attack":22,"defense":10,"starterEquipment":{"weapon":"basic_two_handed_weapon"},"skin":"lanternsteel-array","accent":"#E99881","traits":"Heavy melee · Breaking defenses"},{"id":"HEXWEAVER","name":"Hexweaver","role":"Damage","description":"Arcane damage caster weaving hexes through wand and focus.","hp":108,"attack":17,"defense":11,"starterEquipment":{"weapon":"basic_wand"},"skin":"runespark-adept","accent":"#C4A0FA","traits":"Hexes · Arcane damage · Focus"},{"id":"KNIFE_DANCER","name":"Knife Dancer","role":"Damage","description":"Fast melee attacker built around precision, crits and execution.","hp":106,"attack":22,"defense":10,"starterEquipment":{"weapon":"basic_main_hand_blade"},"skin":"gloamstep-regalia","accent":"#EC97BC","traits":"Precision · Critical strikes · Execution"},{"id":"STONECALLER","name":"Stonecaller","role":"Support","description":"Earth-and-storm support caster using resonance, geomancy and totems.","hp":120,"attack":20,"defense":12,"starterEquipment":{"weapon":"basic_staff"},"skin":"resonant-tempest","accent":"#85D8D2","traits":"Resonance · Geomancy · Totems"}],capNames=["top_left","top_center","top_right","middle_left","middle_center","middle_right","bottom_left","bottom_center","bottom_right"];let role='All',index=0,body='male';const base='../../apps/mobile/assets/';const emblem=id=>base+'class-emblems-v2/icon/'+id.toLowerCase()+'.png';function render(){const list=role==='All'?classes:classes.filter(c=>c.role===role),c=list[index];document.querySelector('.filters').innerHTML=['All','Tank','Support','Damage'].map(r=>'<button class="'+(r===role?'active':'')+'" data-role="'+r+'">'+r+'</button>').join('');const slices=capNames.map(n=>'<img alt="" src="'+base+'creation-ui-v2/character_card_selected_9slice/'+n+'.png">').join('');document.querySelector('#carousel').innerHTML='<div class="heading"><strong>CHOOSE YOUR CALLING</strong><span>'+String(index+1).padStart(2,'0')+' / '+String(list.length).padStart(2,'0')+'</span></div><div class="frame" style="--accent:'+c.accent+'"><div class="slices">'+slices+'</div><div class="hero"><img class="figure" alt="'+c.name+' '+body+' illustration" src="'+base+'character-runtime/accepted-front-v1/'+c.skin+'/'+body+'-front.png"><div class="top"><span class="role">'+c.role.toUpperCase()+'</span><img class="crest" alt="" src="'+emblem(c.id)+'"></div><div class="arrows"><button aria-label="Previous class" data-dir="-1"><img alt="" src="'+base+'creation-ui-v2/carousel_back.png"></button><button aria-label="Next class" data-dir="1"><img alt="" src="'+base+'creation-ui-v2/carousel_next.png"></button></div></div><div class="nameplate"><h2>'+c.name+'</h2><div class="traits">'+c.traits+'</div></div></div><div class="browse"><span class="hint">Swipe or select a crest</span><div class="bodies">'+['male','female'].map(b=>'<button class="'+(b===body?'active':'')+'" data-body="'+b+'">'+(b==='male'?'Male':'Female')+'</button>').join('')+'</div></div><div class="strip">'+list.map((x,i)=>'<button class="thumb '+(i===index?'active':'')+'" aria-label="Select '+x.name+'" data-index="'+i+'"><img alt="" src="'+emblem(x.id)+'"></button>').join('')+'</div><p class="description">'+c.description+'</p><div class="stats">'+[['HEALTH',c.hp],['ATTACK',c.attack],['DEFENSE',c.defense]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div>';document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{const id=c.id;role=b.dataset.role;const next=role==='All'?classes:classes.filter(x=>x.role===role);index=Math.max(0,next.findIndex(x=>x.id===id));render()});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{index=(index+Number(b.dataset.dir)+list.length)%list.length;render()});document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.index);render()});document.querySelectorAll('[data-body]').forEach(b=>b.onclick=()=>{body=b.dataset.body;render()});let start;document.querySelector('.hero').onpointerdown=e=>start=[e.clientX,e.clientY];document.querySelector('.hero').onpointerup=e=>{if(start&&Math.abs(e.clientX-start[0])>40&&Math.abs(e.clientX-start[0])>Math.abs(e.clientY-start[1])*1.5){index=(index+(e.clientX<start[0]?1:-1)+list.length)%list.length;render()}start=null;};}render();document.querySelector('#continue').onclick=()=>alert('Visual review only. The connected creation flow runs in the mobile app.');</script></html>
