name: Endurance checkpoint balance and bundle rebuild (temporary)
on:
  push:
    branches:
      - feat/endurance-boss-camp-boon-choice-v2-20261121
    paths:
      - .github/workflows/checkpoint-balance-rebuild-temp.yml
permissions:
  contents: write
jobs:
  rebuild-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked build packages
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild exact co-op runtime
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Typecheck, route tests, and regional boss balance
        run: |
          pnpm --dir backend typecheck:online
          pnpm --dir backend build
          pnpm --dir backend coop-phase4
          pnpm --dir backend coop-phase5
          pnpm --dir backend test:dungeon-variety
          node backend/dist/online/backend/online/tests/regional-dungeon-clear-rates.js
      - name: Commit tested Edge bundles to exact branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/coop/index.ts backend/supabase/functions/gameplay/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(edge): synchronize RNG-stable checkpoint runtime'
          git push origin HEAD:feat/endurance-boss-camp-boon-choice-v2-20261121
