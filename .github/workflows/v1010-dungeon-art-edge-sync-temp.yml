name: v1.0.10 Dungeon Shop art branch-only Edge sync
# Disposable integration helper. Never merge this workflow into the release branch.
on:
  push:
    branches: ['integration/v1010-dungeon-shop-approved-artwork-20261116']
    paths: ['.github/workflows/v1010-dungeon-art-edge-sync-temp.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1010-art-edge-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1010-dungeon-shop-approved-artwork-20261116
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned backend and mobile dependencies
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Validate approved art/locale guards and mobile types
        run: |
          cd apps/mobile
          node tests/german-expedition-shop-localization.cjs
          cd ../..
          pnpm --dir apps/mobile typecheck
      - name: Rebuild gameplay and co-op Edge bundles from authoritative source
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Reject any changes outside the generated Edge bundles
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated changes:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit only the two canonical Edge function bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated bundles already match source.'
            exit 0
          fi
          git commit -m 'build(edge): sync approved Dungeon Shop regional portrait catalogue'
          git push origin HEAD:integration/v1010-dungeon-shop-approved-artwork-20261116
