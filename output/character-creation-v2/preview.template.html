<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veldryn character creation — visual review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e17;color:#eef4ff;font:14px/1.5 'Segoe UI',sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #8bd6ee;outline-offset:3px}img{image-rendering:pixelated}main{max-width:520px;padding:12px 16px 100px;margin:auto}.brand{display:block;width:232px;height:70px;object-fit:contain;margin:auto}.kicker{text-align:center;font-size:10px;letter-spacing:2px;color:#a5b2c4;margin:12px 0}.language{display:block;margin:auto;min-height:44px;min-width:150px;border:1px solid #314259;background:#111d2b}.steps{margin:12px 0;display:flex;padding:10px 0;border-block:1px solid #413c30}.step{flex:1;text-align:center;font-size:10px;color:#8f9cae}.step b{display:flex;width:24px;height:24px;align-items:center;justify-content:center;margin:0 auto 5px;border:1px solid #526176;background:#121d2a;font-size:12px}.step:first-child{color:#e9c782}.step:first-child b{background:#214660;border-color:#8bd6ee;color:#dfeff5}h1{font-size:23px;line-height:30px;text-align:center;color:#f1d89f;margin:12px 0;font-weight:900}.filters{display:flex;gap:6px;margin-bottom:12px}.filters button{flex:1;padding:0 4px;min-height:44px;border:1px solid #514630;background:#111b29;font-size:12px;font-weight:700;color:#a5b2c4}.filters .active{border-color:#8bd6ee;background:#183a52;color:#e1f4fa}.heading{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:8px}.heading strong{font-size:11px;letter-spacing:1.7px;color:#e9c782}.heading span{font-size:12px;color:#a5b2c4}.frame{position:relative;background:#020303;padding:14px 14px 18px}.slices{position:absolute;inset:0;display:grid;pointer-events:none;grid-template-columns:32px 1fr 32px;grid-template-rows:32px 1fr 32px}.slices img{width:100%;height:100%;min-width:0;min-height:0}.hero{height:324px;position:relative;background:#020303}.figure{height:100%;width:100%;object-fit:contain}.top{position:absolute;left:12px;right:12px;top:14px;display:flex;justify-content:space-between;align-items:flex-start}.role{padding:6px 9px;border:1px solid var(--accent);background:#0b111ced;font-size:10px;font-weight:900;letter-spacing:1.4px;color:var(--accent)}.crest{width:50px;height:50px}.arrows{position:absolute;left:-7px;right:-7px;top:142px;display:flex;justify-content:space-between}.arrows button{width:48px;height:48px;padding:4px;border:0;background:none}.arrows img{width:40px;height:40px}.nameplate{position:relative;text-align:center;background:#101a27;border-top:1px solid #6b5530;padding:12px 8px}.nameplate h2{color:#f5deaa;font-size:27px;line-height:34px;font-weight:900;margin:0 0 4px}.traits{font-size:11px;line-height:17px;color:var(--accent)}.browse{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.hint{font-size:11px;color:#a5b2c4}.bodies{display:flex;gap:4px}.bodies button{min-height:44px;padding:0 12px;border:1px solid #384759;background:none;font-size:12px;color:#a5b2c4}.bodies .active{background:#17334a;border-color:#76badd;color:#cbefff;font-weight:800}.strip{display:flex;gap:8px;overflow:auto;padding:2px 0;scrollbar-width:none}.thumb{width:56px;min-width:56px;height:62px;padding:3px;border:1px solid #384352;background:#101925}.thumb img{width:48px;height:48px}.thumb.active{background:#17354d;border-color:#84d4f1}.thumb.active:after{content:'';display:block;width:14px;height:2px;margin:auto;background:#e9c782}.description{text-align:center;padding:0 8px;color:#c0cbd8;font-size:14px;line-height:21px;margin:12px 0}.stats{display:flex;gap:6px}.stat{flex:1;text-align:center;background:#111d2b;border-block:1px solid #514830;padding:10px 0}.stat small{display:block;font-size:10px;letter-spacing:.8px;color:#a5b2c4}.stat strong{color:#e9c782;font-size:20px;font-weight:900}.note{text-align:center;color:#a5b2c4;font-size:12px;line-height:18px;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:#0d1825;border-top:1px solid #746039;padding:8px 16px;z-index:5}footer button{position:relative;display:block;max-width:488px;width:100%;min-height:52px;margin:auto;background:#111d2b;border:1px solid #8bd6ee;box-shadow:inset 0 0 0 3px #101b29,inset 0 0 0 4px #685333;color:#e9c782;font-size:16px;font-weight:800;padding:12px 28px}.reviewOnly{max-width:488px;margin:60px auto 10px;color:#8998aa;font-size:12px}
@media(prefers-reduced-motion:no-preference){.figure{animation:appear .18s ease-out}@keyframes appear{from{opacity:.25}to{opacity:1}}}
.brandRow{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{flex:1;max-width:184px;width:0;height:62px;margin:0}.language{min-width:94px;margin:0;font-size:12px}.steps{padding-block:8px}.step{display:flex;align-items:center;justify-content:center;gap:6px}.step b{margin:0}.heading{display:none}.hero{height:clamp(240px,36vh,324px)}.arrows{top:calc(50% - 24px)}</style>
<main><div class="brandRow"><img class="brand" alt="Veldryn" src="../../apps/mobile/assets/events-startup-v1/branding/veldryn_logo.png"><button class="language">English +</button></div><p class="kicker">CREATE YOUR FIRST CHARACTER</p><div class="steps"><div class="step"><b>1</b>Class</div><div class="step"><b>2</b>Identity</div><div class="step"><b>3</b>Review</div></div><h1>Choose your calling</h1><div class="filters"></div><section id="carousel"></section><p class="note">Class equipment illustration. You begin with a neutral outfit and earn your armor through play.</p></main><footer><button id="continue">Choose your identity</button></footer>
<script>const classes=__CLASS_DATA__,capNames=["top_left","top_center","top_right","middle_left","middle_center","middle_right","bottom_left","bottom_center","bottom_right"];let role='All',index=0,body='male';const base='../../apps/mobile/assets/';const emblem=id=>base+'class-emblems-v2/icon/'+id.toLowerCase()+'.png';function render(){const list=role==='All'?classes:classes.filter(c=>c.role===role),c=list[index];document.querySelector('.filters').innerHTML=['All','Tank','Support','Damage'].map(r=>'<button class="'+(r===role?'active':'')+'" data-role="'+r+'">'+r+'</button>').join('');const slices=capNames.map(n=>'<img alt="" src="'+base+'creation-ui-v2/character_card_selected_9slice/'+n+'.png">').join('');document.querySelector('#carousel').innerHTML='<div class="heading"><strong>CHOOSE YOUR CALLING</strong><span>'+String(index+1).padStart(2,'0')+' / '+String(list.length).padStart(2,'0')+'</span></div><div class="frame" style="--accent:'+c.accent+'"><div class="slices">'+slices+'</div><div class="hero"><img class="figure" alt="'+c.name+' '+body+' illustration" src="'+base+'character-runtime/accepted-front-v1/'+c.skin+'/'+body+'-front.png"><div class="top"><span class="role">'+c.role.toUpperCase()+'</span><img class="crest" alt="" src="'+emblem(c.id)+'"></div><div class="arrows"><button aria-label="Previous class" data-dir="-1"><img alt="" src="'+base+'creation-ui-v2/carousel_back.png"></button><button aria-label="Next class" data-dir="1"><img alt="" src="'+base+'creation-ui-v2/carousel_next.png"></button></div></div><div class="nameplate"><h2>'+c.name+'</h2><div class="traits">'+c.traits+'</div></div></div><div class="browse"><span class="hint">Swipe or select a crest</span><div class="bodies">'+['male','female'].map(b=>'<button class="'+(b===body?'active':'')+'" data-body="'+b+'">'+(b==='male'?'Male':'Female')+'</button>').join('')+'</div></div><div class="strip">'+list.map((x,i)=>'<button class="thumb '+(i===index?'active':'')+'" aria-label="Select '+x.name+'" data-index="'+i+'"><img alt="" src="'+emblem(x.id)+'"></button>').join('')+'</div><p class="description">'+c.description+'</p><div class="stats">'+[['HEALTH',c.hp],['ATTACK',c.attack],['DEFENSE',c.defense]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div>';document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{const id=c.id;role=b.dataset.role;const next=role==='All'?classes:classes.filter(x=>x.role===role);index=Math.max(0,next.findIndex(x=>x.id===id));render()});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{index=(index+Number(b.dataset.dir)+list.length)%list.length;render()});document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.index);render()});document.querySelectorAll('[data-body]').forEach(b=>b.onclick=()=>{body=b.dataset.body;render()});let start;document.querySelector('.hero').onpointerdown=e=>start=[e.clientX,e.clientY];document.querySelector('.hero').onpointerup=e=>{if(start&&Math.abs(e.clientX-start[0])>40&&Math.abs(e.clientX-start[0])>Math.abs(e.clientY-start[1])*1.5){index=(index+(e.clientX<start[0]?1:-1)+list.length)%list.length;render()}start=null;};}render();document.querySelector('#continue').onclick=()=>alert('Visual review only. The connected creation flow runs in the mobile app.');</script></html>
