name: Temporary regenerate dungeon Edge bundle

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-regenerate-dungeon-edge.yml'
      - 'backend/online/**'
      - 'backend/src/server/coop/**'
      - 'backend/src/server/expeditions/**'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == 'elroynbenjamins/Veldryn' && github.event.pull_request.head.ref == 'feat/dungeon-three-tier-rewards-sunscar-20261109'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
      - name: Build canonical bundles from source
        run: pnpm build:online
        working-directory: backend
      - name: Commit generated function artifacts to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(dungeons): regenerate verified co-op Edge bundle"
            git push origin HEAD:refs/heads/feat/dungeon-three-tier-rewards-sunscar-20261109
          fi
