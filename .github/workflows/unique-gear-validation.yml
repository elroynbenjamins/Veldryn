name: Unique forged equipment validation
on:
  pull_request:
    paths:
      - 'apps/mobile/src/core/**'
      - 'apps/mobile/src/content/equipment-v2-*.ts'
      - 'apps/mobile/src/components/EquipmentCraftingV2*.tsx'
      - 'backend/src/server/equipment/equipment-crafting-v2-*.ts'
      - 'backend/src/server/combat/v2-integration/equipment-exact-copy-interop-v1.mjs'
      - 'backend/src/server/combat/v2-integration/__tests__/equipment-crafting-v2-real-manifest-interop.test.mjs'
      - 'backend/src/server/combat/v2-integration/__tests__/equipment-skills-enemies-v2-staging-readiness.test.mjs'
      - 'backend/src/server/equipment/__tests__/equipment-crafting-v2-*.test.ts'
      - 'backend/sql/drafts/equipment_crafting_v2_*.sql'
      - 'backend/tsconfig.equipment-v2.json'
      - 'backend/online/tests/gameplay.ts'
      - 'apps/mobile/src/screens/InventoryScreen.tsx'
      - 'apps/mobile/src/components/EquipmentCraftQueuePanel.tsx'
      - 'apps/mobile/src/components/ForgeOddsGuide.tsx'
      - 'apps/mobile/src/components/SmithingCollection.tsx'
      - 'apps/mobile/tests/equipment-crafted-instance-results.ts'
      - 'apps/mobile/tests/weapon-bonus-rolls.ts'
      - 'apps/mobile/tests/equipment-crafting-v2-hidden.ts'
      - 'apps/mobile/tests/equipment-crafting-v2-*.cjs'
      - 'apps/mobile/tsconfig.unique-gear.json'
      - '.github/workflows/unique-gear-validation.yml'
  workflow_dispatch:
jobs:
  unique-equipment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        run: pnpm --dir ../../backend install --frozen-lockfile
      - name: Compile unique equipment gameplay and tests
        run: node node_modules/typescript/lib/tsc.js -p tsconfig.unique-gear.json --outDir .unique-gear-build
      - name: Run exact-copy crafting and retention regressions
        run: NODE_PATH=../../backend/node_modules node .unique-gear-build/apps/mobile/tests/equipment-crafted-instance-results.js
      - name: Verify dual weapon rolls and exact-copy combat bonuses
        run: NODE_PATH=../../backend/node_modules node .unique-gear-build/apps/mobile/tests/weapon-bonus-rolls.js
      - name: Verify hidden Equipment 2.0 and Crafting 2.0 foundations
        run: NODE_PATH=../../backend/node_modules node .unique-gear-build/apps/mobile/tests/equipment-crafting-v2-hidden.js
      - name: Compile hidden Equipment/Crafting 2.0 server transaction model
        run: pnpm --dir ../../backend exec tsc -p tsconfig.equipment-v2.json
      - name: Test server-side Gold reservation, one-time claims and replay
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-transaction.test.js
      - name: Validate exact-copy 2.0 stat snapshots, class and weapon-hand safety
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-instances.test.js
      - name: Validate hidden exact-copy Bank, equip and cross-character custody policies
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-custody.test.js
      - name: Verify hidden V2 atomic gameplay commit plan and Gold conservation
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-commit-plan.test.js
      - name: Verify hidden immutable claim ledger, storage capacity and custody proposal
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-delivery.test.js
      - name: Verify hidden permanent Stat Gem replacement, one-time consumption and receipt replay
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-gem-sidecar.test.js
      - name: Verify hidden custody receipts, Bank transfer and equip replay
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-virtual-custody.test.js
      - name: Rehearse physical EQ2 copy delivery against the existing online CAS payload in isolated staging
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-physical-delivery-staging.test.js
      - name: Verify Effect Gem family caps and no legacy-loadout bypass
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-effect-gem-policy.test.js
      - name: Verify canonical Equipment 2.0 exact copies in Combat 2.0 evidence
        run: node ../../backend/src/server/combat/v2-integration/__tests__/equipment-crafting-v2-real-manifest-interop.test.mjs
      - name: Exercise 9 classes by 8 enemies with canonical Equipment, Skills and Enemy V2 blockers
        run: node ../../backend/src/server/combat/v2-integration/__tests__/equipment-skills-enemies-v2-staging-readiness.test.mjs
      - name: Rehearse V2 in the existing GameState with original Forge and wallet preserved
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-game-state.test.js
      - name: Test shadow store compare-and-swap and crash recovery
        run: node ../../backend/dist-equipment-v2/server/equipment/__tests__/equipment-crafting-v2-shadow.test.js
      - name: Audit shadow SQL security and safe rollout boundary
        run: node tests/equipment-crafting-v2-shadow-sql.cjs
      - name: Compile authoritative online gameplay
        run: pnpm --dir ../../backend exec tsc -p tsconfig.online.json
      - name: Verify concurrent copy writes, replay and Gold integrity
        run: node ../../backend/dist/online/backend/online/tests/gameplay.js
