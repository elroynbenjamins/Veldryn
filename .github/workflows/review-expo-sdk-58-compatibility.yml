name: Review Expo SDK 58 compatibility
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/review-expo-sdk-58-compatibility.yml'
      - 'apps/mobile/package.json'
      - 'apps/mobile/pnpm-lock.yaml'
permissions:
  contents: read
concurrency:
  group: expo-sdk-58-review
  cancel-in-progress: true
jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/expo-sdk-58-compatibility-20261126'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Resolve only the three Expo packages flagged by existing CI
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('package.json')
          s=p.read_text()
          for name, old, new in [('expo','~58.0.26','~58.1.0'),('expo-crypto','58.0.8','58.0.9'),('expo-splash-screen','~58.0.14','~58.0.15')]:
              value=json.loads(s)['dependencies'][name]
              if value == new: continue
              assert value == old, f'Unexpected current range {name}: {value}'
              pattern=r'("'+re.escape(name)+r'"\s*:\s*")'+re.escape(old)+r'(")'
              s,count=re.subn(pattern,lambda m:m.group(1)+new+m.group(2),s)
              assert count==1, name
          p.write_text(s)
          PY
          pnpm install --no-frozen-lockfile
          pnpm exec expo install --check
          pnpm run typecheck:core
      - name: Verify and package exact dependency outputs
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only | grep -v -E '^apps/mobile/(package.json|pnpm-lock.yaml)$' || true)"
          mkdir -p "$RUNNER_TEMP/expo-review"
          cp apps/mobile/package.json apps/mobile/pnpm-lock.yaml "$RUNNER_TEMP/expo-review/"
          cd "$RUNNER_TEMP/expo-review"
          sha256sum package.json pnpm-lock.yaml > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: expo-sdk-58-review-lock
          path: ${{ runner.temp }}/expo-review/
          retention-days: 1
          if-no-files-found: error
  commit-dependencies:
    needs: resolve
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/expo-sdk-58-compatibility-20261126'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: expo-sdk-58-review-lock
          path: ${{ runner.temp }}/expo-review
      - name: Commit only validated package and lockfile to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cd "$RUNNER_TEMP/expo-review"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/expo-review/package.json" apps/mobile/package.json
          cp "$RUNNER_TEMP/expo-review/pnpm-lock.yaml" apps/mobile/pnpm-lock.yaml
          git add -- apps/mobile/package.json apps/mobile/pnpm-lock.yaml
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Resolve CI-required Expo SDK compatibility versions'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/review/expo-sdk-58-compatibility-20261126
