name: Forge mastery isolated Edge regeneration
on:
  push:
    branches: ['integration/forge-mastery-main-reconcile-20261121']
    paths: ['.github/workflows/forge-mastery-reconcile-edge-sync-20261121.yml']
permissions:
  contents: write
concurrency:
  group: forge-mastery-edge-reconcile-20261121
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/forge-mastery-main-reconcile-20261121
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate authoritative gameplay and co-op Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit canonical generated bundles and remove one-time helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          git rm -- .github/workflows/forge-mastery-reconcile-edge-sync-20261121.yml
          git commit -m 'build(edge): sync Forge mastery with current gameplay and co-op bundles'
          git push origin HEAD:integration/forge-mastery-main-reconcile-20261121
          echo 'Isolated branch regenerated and one-time helper removed.'
