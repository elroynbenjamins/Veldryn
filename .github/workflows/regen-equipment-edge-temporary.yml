name: Rebuild equipment sale Edge bundle (temporary)
on:
  push:
    branches:
      - fix/equipment-bulk-selling-ux-2026-11-07
    paths:
      - .github/workflows/regen-equipment-edge-temporary.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - name: Commit generated Edge bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize generated gameplay Edge bundle after equipment sale changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
