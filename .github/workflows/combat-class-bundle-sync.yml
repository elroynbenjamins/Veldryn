name: Temporary combat-class Edge bundle sync
on:
  push:
    branches:
      - feature/combat-skill-activation-feedback-20261114
    paths:
      - .github/workflows/combat-class-bundle-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Install mobile dependencies shared by backend
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild canonical gameplay and coop bundles
        run: pnpm --dir backend build:online
      - name: Verify generated bundles against the shared engine
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated bundles to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(combat): regenerate authoritative gameplay Edge bundles"
            git push origin HEAD:feature/combat-skill-activation-feedback-20261114
          fi
