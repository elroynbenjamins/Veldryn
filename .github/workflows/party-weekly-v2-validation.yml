permissions:
  contents: read
jobs:
  party-weekly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:party-weekly-v2
      - run: node ../tools/party-events-gear-calibration.mjs
      - run: node ../tools/party-events-authoritative-calibration.mjs
