name: Prepare account icon migration (review only)
on:
  push:
    branches: ['chatgpt/account-wide-profile-icon-first-character']
    paths: ['.github/workflows/account-profile-icon-migration-review.yml']
permissions:
  contents: write
concurrency:
  group: account-profile-icon-migration-review
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/account-wide-profile-icon-first-character
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - name: Generate migration locally (no database connection)
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          cd backend
          supabase migration new --help
          supabase migration new account_profile_icon_first_character
          cd ..
          mapfile -t files < <(git ls-files --others --exclude-standard backend/supabase/migrations)
          test "${#files[@]}" -eq 1
          migration="${files[0]}"
          [[ "$migration" =~ ^backend/supabase/migrations/[0-9]{14}_account_profile_icon_first_character\.sql$ ]]
          cp backend/supabase/drafts/account_profile_icon_first_character.sql "$migration"
          test -z "$(git diff --name-only)"
          git add "$migration"
          test "$(git diff --cached --name-only)" = "$migration"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'db: generate first-character profile icon migration for review'
          branch=chatgpt/account-wide-profile-icon-first-character
          test "$(git branch --show-current)" = "$branch"
          git fetch origin "$branch"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse "origin/$branch")"
          git push origin "HEAD:$branch"
