name: One-time regenerate Party unlock Edge bundles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-party-edge-regeneration.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Regenerate canonical gameplay and co-op Edge bundles
        working-directory: backend
        run: pnpm build:online
      - name: Verify exact Edge parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated bundles
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Generated bundles are already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Edge bundles after Guild default alignment"
          git push origin HEAD:main
