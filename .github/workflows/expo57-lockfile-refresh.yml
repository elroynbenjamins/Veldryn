name: Expo 57 lockfile refresh

on:
  push:
    branches:
      - upgrade/expo57-api36-edge-to-edge-20261006
    paths:
      - 'apps/mobile/package.json'
      - 'apps/mobile/pnpm-lock.yaml'
      - '.github/workflows/expo57-lockfile-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/expo57-api36-edge-to-edge-20261006
          sparse-checkout: |
            apps/mobile
          sparse-checkout-cone-mode: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Refresh SDK 57 lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit refreshed lockfile
        working-directory: .
        run: |
          if git diff --quiet -- apps/mobile/pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/pnpm-lock.yaml
          git commit -m "chore: refresh Expo 57 mobile lockfile"
          git push origin HEAD:upgrade/expo57-api36-edge-to-edge-20261006
