name: Temporary companion Edge bundle refresh

on:
  push:
    branches:
      - fix/class-neutral-companion-unlocks-20261125
    paths:
      - '.github/workflows/companion-edge-refresh-20261125.yml'

permissions:
  contents: write

jobs:
  refresh-edge-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - name: Commit canonical generated Edge bundles
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate gameplay and co-op Edge bundles for class-neutral companion unlocks'
            git push origin HEAD:fix/class-neutral-companion-unlocks-20261125
          fi
