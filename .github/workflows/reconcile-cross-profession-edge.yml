# One-shot source-of-truth rebuild on this isolated reconciliation branch.
# Never deploy, tag, or modify main.
name: Reconcile cross-profession generated Edge
on:
  push:
    branches: ['feat/cross-profession-components-reconciled-20261116']
    paths: ['.github/workflows/reconcile-cross-profession-edge.yml']
permissions:
  contents: write
concurrency:
  group: cross-profession-edge-rebuild-20261116
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-profession-components-reconciled-20261116
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install frozen backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build canonical backend Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Refuse unrelated modifications
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\\.ts$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unrelated files modified:\\n%s\\n' "$unexpected"
            exit 1
          fi
      - name: Commit generated bundles to this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated bundles already match authoritative shared sources.'
            exit 0
          fi
          git commit -m 'build(edge): synchronize cross-profession gameplay and co-op bundles'
          git push origin HEAD:feat/cross-profession-components-reconciled-20261116
