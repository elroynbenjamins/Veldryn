name: Rebuild Expedition Shop Edge bundle (branch only)

on:
  push:
    branches: [feat/expedition-marks-shop-secure-release-20261113]
    paths: ['.github/workflows/expedition-shop-bundle-rebuild.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref_name == 'feat/expedition-marks-shop-secure-release-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/expedition-marks-shop-secure-release-20261113
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Build updated authenticated co-op Edge handlers
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Run shop-specific backend test
        run: |
          node backend/dist/online/backend/online/tests/dungeon-shop.js
          pnpm --dir backend test:dungeon-shop-catalog
      - name: Commit bundle changes to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/coop/index.ts backend/supabase/functions/gameplay/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build(edge): synchronize Expedition Marks Shop verified release route'
          fi
          git push origin HEAD:feat/expedition-marks-shop-secure-release-20261113
