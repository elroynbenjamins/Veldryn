name: Inventory protection Edge bundle sync (temporary)
on:
  push:
    branches:
      - feat/inventory-bulk-lock-favorite-20261122
    paths:
      - .github/workflows/inventory-protection-edge-sync-temporary.yml
      - apps/mobile/src/core/inventory-protection-bulk.ts
      - apps/mobile/src/core/game-commands.ts
permissions:
  contents: write
concurrency:
  group: inventory-protection-edge-sync
  cancel-in-progress: false
jobs:
  build-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inventory-bulk-lock-favorite-20261122
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild and verify generated shared Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit artifacts to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated bundles are already synchronized.'
            exit 0
          fi
          git commit -m 'build(edge): include atomic inventory protection command'
          git push origin HEAD:feat/inventory-bulk-lock-favorite-20261122
