name: Wave 2 Android release export audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wave2-android-release-export-audit.yml'
permissions:
  contents: read
jobs:
  android-release-export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/wave2-android-release-export-audit'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate Expo dependency compatibility
        run: pnpm exec expo install --check
      - name: Export Android production JS and assets and enforce release budget
        run: pnpm test:release-bundle
      - name: Confirm Wave 2 certification is in the exported source graph
        run: |
          grep -F "['tideborne','clockwork','stormforged','crimson-oath']" src/core/profile-cosmetic-wave2.ts
          node tests/profile-pet-art-assets.cjs
