name: Temporary story boss class gameplay bundle sync
on:
  push:
    branches: [feature/story-boss-class-skill-identity-20261114]
    paths:
      - '.github/workflows/story-boss-class-bundle-sync-temporary.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/story-boss-class-skill-identity-20261114
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Install mobile dependencies shared by backend
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate canonical gameplay and co-op Edge entrypoints
        run: pnpm --dir backend build:online
      - name: Verify server gameplay bundle parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles and remove one-time helper from feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          git rm .github/workflows/story-boss-class-bundle-sync-temporary.yml
          git diff --cached --quiet || git commit -m "build(boss): sync server gameplay bundle with class abilities"
          git push origin HEAD:feature/story-boss-class-skill-identity-20261114
