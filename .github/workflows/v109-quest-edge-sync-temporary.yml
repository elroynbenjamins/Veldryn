name: Temporary per-character quest Edge regeneration

on:
  push:
    branches:
      - release/v109-personal-quests-consolidation-20261114
    paths:
      - '.github/workflows/v109-quest-edge-sync-temporary.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Compile and verify Edge bundles and online contracts
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles on integration branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Edge bundles already synchronized.'
            exit 0
          fi
          git commit -m 'build(edge): integrate per-character quest claim settlement'
          git push origin HEAD:release/v109-personal-quests-consolidation-20261114
