name: Temporary enchantment Edge bundle regeneration
on:
  push:
    branches:
      - balance/enchantment-gold-tiers-plus200-rank1-20261109
    paths:
      - .github/workflows/temporary-enchant-bundle-sync-20261109.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/enchantment-gold-tiers-plus200-rank1-20261109
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install locked mobile dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Install locked backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Regenerate shared gameplay and co-op Edge bundles
        run: pnpm --dir backend build:online
      - name: Verify both committed bundles match the shared engine
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit only generated Edge files
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Bundles already match"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(edge): regenerate enchantment gameplay and co-op bundles"
          git push origin HEAD:balance/enchantment-gold-tiers-plus200-rank1-20261109
