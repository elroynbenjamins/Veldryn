name: Diagnose v1.0.9 main conflicts (read-only)

on:
  push:
    branches: [integration/v1-0-9-badges-pager-tier-memory-20261112]
    paths:
      - '.github/workflows/v109-main-merge-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.ref_name == 'integration/v1-0-9-badges-pager-tier-memory-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1-0-9-badges-pager-tier-memory-20261112
          fetch-depth: 0
      - name: Dry-run merge of current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git -c user.name='Veldryn QA' -c user.email='qa@users.noreply.github.com' merge --no-ff --no-commit origin/main; then
            echo 'NO_CONFLICTS: main can be incorporated mechanically.'
          else
            echo 'CURRENT_MAIN_CONFLICTS_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'CURRENT_MAIN_CONFLICTS_END'
            python3 - <<'PY'
          import pathlib,re,subprocess
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          for path in paths:
              content=pathlib.Path(path).read_text(encoding='utf-8',errors='replace')
              chunks=re.findall(r'(?ms)^<<<<<<< HEAD\n.*?^>>>>>>> .*?$',content)
              print('CONFLICT_BLOCKS',path,'count=',len(chunks))
              for i,chunk in enumerate(chunks[:8]):
                  print('BLOCK',i+1,chunk[:3500])
          PY
            echo 'No files written to a remote branch.'
          fi
          git merge --abort || true
