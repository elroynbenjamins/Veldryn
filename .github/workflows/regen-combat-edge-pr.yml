name: Rebuild combat Edge bundle for PR
on:
  push:
    branches:
      - feature/early-regional-damage-hunts
    paths:
      - .github/workflows/regen-combat-edge-pr.yml
      - apps/mobile/src/core/game.ts
      - apps/mobile/src/core/combat-timing.ts
      - apps/mobile/src/core/combat-hit-timeline.ts
      - apps/mobile/src/core/ordinary-hunt.ts

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/early-regional-damage-hunts
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - name: Commit regenerated gameplay output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts
          if git diff --cached --quiet; then
            echo "Gameplay bundle already matches shared engine."
            exit 0
          fi
          git commit -m "Regenerate gameplay Edge bundle for early-region hunt pacing"
          git push origin HEAD:feature/early-regional-damage-hunts
