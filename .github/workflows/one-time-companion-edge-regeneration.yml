name: One-time Companion progression Edge bundle parity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-companion-edge-regeneration.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Build both canonical Edge bundles
        working-directory: backend
        run: pnpm build:online
      - name: Verify generated Edge parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated files
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Bundles unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Edge bundles for Companion unlock balance"
          git push origin HEAD:main
