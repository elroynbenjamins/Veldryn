# Temporary trusted generator. Remove after generated files are committed.
name: Regenerate dungeon potion Edge bundles temporary
on:
  pull_request:
    paths:
      - '.github/workflows/regenerate-dungeon-potion-edge-temp.yml'
      - 'backend/online/**'
      - 'backend/src/**'
permissions:
  contents: write
jobs:
  generate:
    if: ${{ github.event.pull_request.head.ref == 'feat/dungeon-crafted-healing-potions-106' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate authoritative online Edge source
        run: pnpm --dir backend build:online
      - name: Commit generated artifacts only
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "Regenerate online Edge bundles for dungeon potion integration"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
