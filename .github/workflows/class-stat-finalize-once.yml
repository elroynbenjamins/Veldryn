name: Final class rebalance Edge synchronization
on:
  push:
    branches:
      - balance/class-gear-stat-identity
    paths:
      - '.github/workflows/class-stat-finalize-once.yml'
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Incorporate latest main without overwriting the class branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit --no-ff origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Build authoritative gameplay and co-op Edge bundles
        run: pnpm --dir backend build:online
      - name: Commit generated parity changes on review branch
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate combat-authoritative Edge bundles after class refinement'
          fi
          git push origin HEAD:refs/heads/balance/class-gear-stat-identity
