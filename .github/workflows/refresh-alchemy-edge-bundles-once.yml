name: One-shot Alchemy bundle refresh and backend typecheck
on:
  push:
    branches: [feat/alchemy-tiered-role-potions-106]
    paths: [.github/workflows/refresh-alchemy-edge-bundles-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Supply local workspace roots for pinned packages
        run: |
          printf '\npackages:\n  - "."\n' >> backend/pnpm-workspace.yaml
          printf '\npackages:\n  - "."\n' >> apps/mobile/pnpm-workspace.yaml
      - name: Install pinned backend and mobile type dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile --ignore-scripts
      - name: Typecheck pure backend and online runner
        run: |
          pnpm --dir backend exec tsc --noEmit
          pnpm --dir backend exec tsc -p tsconfig.online.json --noEmit
      - name: Regenerate online Edge gameplay and coop bundles
        run: |
          node tools/build-online.mjs
          node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated bundles, without unrelated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build: match co-op role potion catalog to pure backend and online Edge"
            git push origin HEAD:feat/alchemy-tiered-role-potions-106
          fi
