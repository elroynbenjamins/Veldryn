name: Mobile UX validation

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'tools/mobile-core-tests.json'
      - '.github/workflows/mobile-ux-validation.yml'
  workflow_dispatch:

jobs:
  typecheck-and-core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install backend dependencies for mobile checks
        run: pnpm --dir ../../backend install --frozen-lockfile
      - name: Validate Inventory storage controls
        run: node tests/inventory-storage-management-ui.cjs
      - name: Validate UX popup and activity Stop reliability
        run: |
          pnpm exec tsc -p tsconfig.ux-popup.json --outDir .ux-popup-build
          node .ux-popup-build/apps/mobile/tests/ux-popup-reliability.js
          node tests/ux-popup-reliability-ui.cjs
          node tests/settings-simplicity-ui.cjs
      - name: Typecheck app
        run: pnpm typecheck
      - name: Validate Gems storage and dungeon recovery UX
        run: node tests/storage-dungeon-refinement-ui.cjs
      - name: Validate Companion Collection and Codex UX
        run: node tests/companion-codex-focused-ui.cjs
      - name: Validate Companion layout and upgrade resource icons
        run: node tests/companion-layout-refinement-ui.cjs
      - name: Validate Account New Unlocks inbox
        run: node tests/account-unlock-inbox-ui.cjs
      - name: Typecheck Account unlock inbox UI
        run: pnpm exec tsc -p tsconfig.account-unlocks.json --noEmit
      - name: Typecheck core
        run: pnpm typecheck:core
      - name: Verify compact gathering Drops UI and real drop odds
        run: pnpm test:gathering-drops
      - name: Run mobile core tests
        run: pnpm test:core
