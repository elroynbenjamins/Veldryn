name: Rebuild dungeon Edge bundles (temporary)
on:
  push:
    branches:
      - feat/dungeon-boon-choices-fast-projection-20261107
    paths:
      - 'backend/**'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dungeon-boon-choices-fast-projection-20261107
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: node tools/build-online.mjs
      - run: node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate merged dungeon Edge bundles"
            git push origin HEAD:feat/dungeon-boon-choices-fast-projection-20261107
          fi
