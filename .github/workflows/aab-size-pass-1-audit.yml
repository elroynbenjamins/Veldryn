name: AAB size pass 1 asset audit (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aab-size-pass-1-audit.yml'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/src/**'
permissions:
  contents: read
jobs:
  asset-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/aab-size-pass-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure image inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick webp >/dev/null
      - name: Audit largest runtime images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('apps/mobile')
          files=[]
          for p in (root/'assets').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.png','.webp','.jpg','.jpeg'}:
                  files.append((p.stat().st_size,p))
          for p in (root/'src').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.png','.webp','.jpg','.jpeg'}:
                  files.append((p.stat().st_size,p))
          files.sort(reverse=True)
          print('TOP_IMAGE_ASSETS')
          for size,p in files[:120]:
              try:
                  out=subprocess.check_output(['identify','-format','%wx%h|%m|%[channels]',str(p)],text=True,stderr=subprocess.DEVNULL).strip()
              except Exception:
                  out='unknown'
              # reference count outside the asset file itself
              name=p.name
              proc=subprocess.run(['rg','-l','-F',name,'apps/mobile/src','apps/mobile/tests','backend','tools'],text=True,capture_output=True)
              refs=[x for x in proc.stdout.splitlines() if x]
              print(f'{size/1024:.1f}KB|{out}|refs={len(refs)}|{p}')
          print('CATEGORY_TOTALS')
          cats={}
          for size,p in files:
              rel=p.relative_to(root)
              parts=rel.parts
              cat='/'.join(parts[:2]) if parts[0]=='assets' and len(parts)>1 else '/'.join(parts[:3])
              cats.setdefault(cat,[0,0]);cats[cat][0]+=size;cats[cat][1]+=1
          for cat,(size,n) in sorted(cats.items(),key=lambda x:x[1][0],reverse=True)[:40]:
              print(f'{size/1024/1024:.2f}MiB|files={n}|{cat}')
          PY
      - name: Trial-lossless recompression potential on PNGs
        run: |
          mkdir -p /tmp/aab-audit
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,shutil
          rows=[]
          for p in Path('apps/mobile').rglob('*.png'):
              if not p.is_file(): continue
              size=p.stat().st_size
              if size<100*1024: continue
              out=Path('/tmp/aab-audit')/p.name
              subprocess.run(['convert',str(p),'-strip',str(out)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if out.exists():
                  new=out.stat().st_size
                  rows.append((size-new,size,new,p))
          rows.sort(reverse=True)
          print('PNG_STRIP_POTENTIAL')
          for save,old,new,p in rows[:80]:
              print(f'save={save/1024:.1f}KB|{100*save/old:.1f}%|old={old/1024:.1f}KB|new={new/1024:.1f}KB|{p}')
          print(f'TOTAL_PNG_STRIP_SAVE={sum(max(0,x[0]) for x in rows)/1024/1024:.2f}MiB')
          PY
