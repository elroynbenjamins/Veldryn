name: Temporary integration Edge parity rebuild

on:
  pull_request:
    paths:
      - '.github/workflows/nov18-integration-edge-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/nov18-crafting-equipment-safety
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install frozen backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Prove crafting and equipment source contracts
        run: node tools/run-mobile-tests.mjs cross-profession-crafting equipment-crafting-source-v33 equipment-set-runtime weapon-bonus-rolls ui-density-hierarchy-contract
      - name: Build and verify canonical gameplay and co-op bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated artifacts exclusively to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Canonical bundles are already synchronized.'
            exit 0
          fi
          git commit -m 'build(edge): sync generated gameplay and co-op bundles for Equipment 2.0'
          git push origin HEAD:integration/nov18-crafting-equipment-safety
