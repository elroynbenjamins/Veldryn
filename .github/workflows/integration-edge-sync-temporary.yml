name: Integration Edge parity sync (temporary)
# Build final combined source after main fellowship+Game Guide merge, chapter fixes and 82 localized techniques.
on:
  push:
    branches:
      - integration/regional-monsters-companion-combat-20261116
    paths:
      - .github/workflows/integration-edge-sync-temporary.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install mobile dependencies for shared React Native imports
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Generate canonical gameplay and co-op Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles only to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          # This branch-only workflow is a build tool, not a release feature.
          # Remove it in the same canonical-artifact commit so main stays clean.
          git rm -- .github/workflows/integration-edge-sync-temporary.yml
          if git diff --cached --quiet; then
            echo 'Canonical bundles are already current.'
            exit 0
          fi
          git commit -m 'build(edge): regenerate regional and companion combat bundles; remove temporary sync workflow'
          git push origin HEAD:integration/regional-monsters-companion-combat-20261116
