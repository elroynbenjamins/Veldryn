name: Class affinity implementation validation
on:
  push:
    branches: ['feature/class-skill-affinities']
    paths: ['tools/implement-class-affinities.mjs', 'apps/mobile/tests/class-skill-affinities.ts']
permissions:
  contents: write
concurrency:
  group: class-affinity-integration
  cancel-in-progress: false
jobs:
  implement-and-check:
    if: github.repository == 'elroynbenjamins/Veldryn' && github.ref == 'refs/heads/feature/class-skill-affinities'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/class-skill-affinities
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed affinity follow-up
        run: node tools/implement-class-affinities.mjs
      - name: Commit implementation only to the affinity branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src apps/mobile/tests apps/mobile/package.json docs/CLASS_SKILL_AFFINITIES.md
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve precise reserved activity progress with class affinities'
            git push origin HEAD:refs/heads/feature/class-skill-affinities
          fi
          echo "Validated source commit: $(git rev-parse HEAD)"
      - name: Install pinned mobile dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Typecheck shared core
        run: pnpm --dir apps/mobile typecheck:core
      - name: Typecheck mobile UI
        run: pnpm --dir apps/mobile typecheck
      - name: Test class affinities
        id: affinities
        run: pnpm --dir apps/mobile test:class-affinities
      - name: Rebuild shared online gameplay bundle
        run: |
          node tools/build-online.mjs
          git add backend/supabase/functions/gameplay/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild authoritative gameplay bundle with precise profession timing'
            git push origin HEAD:refs/heads/feature/class-skill-affinities
          fi
          echo "Source and bundle commit: $(git rev-parse HEAD)"
      - name: Run related regression suites
        working-directory: apps/mobile
        run: |
          status=0
          for suite in online-gameplay timed-processing equipment-timed-crafting-queue equipment-forge-backlog equipment-forge-management gem-progression-v1 save-transfer; do
            echo "::group::$suite"
            node ".affinity-build/apps/mobile/tests/$suite.js" || status=1
            echo '::endgroup::'
          done
          exit "$status"
      - name: Run full mobile core tests
        if: ${{ !cancelled() && steps.affinities.outcome == 'success' }}
        run: pnpm --dir apps/mobile test:core
