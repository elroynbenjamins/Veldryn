name: Frostfall branch Edge parity synchronization (temporary)
on:
  push:
    branches:
      - feat/frostfall-shop-tier-locked-crafting-bundles-20261116
    paths:
      - .github/workflows/frostfall-edge-sync-temporary.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate canonical gameplay and co-op bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated artifacts to this PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Edge bundles already match.'
            exit 0
          fi
          git commit -m 'build(edge): regenerate Frostfall gameplay and co-op bundles'
          git push origin HEAD:feat/frostfall-shop-tier-locked-crafting-bundles-20261116
