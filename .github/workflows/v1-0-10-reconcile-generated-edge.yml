# Regenerate the isolated 1.0.10 release candidate's canonical gameplay and co-op Edge bundles.
# Release-gate sync requested 2026-11-16; no deployment, feature activation, or mainline merge.
name: Veldryn 1.0.10 reconcile generated Edge bundles

on:
  push:
    branches: ['release/1.0.10-aab-prep-20261115']
    paths: ['.github/workflows/v1-0-10-reconcile-generated-edge.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v110-reconcile-generated-edge
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.10-aab-prep-20261115
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend and mobile packages
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate canonical gameplay and co-op Edge sources
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Reject unexpected tracked changes from Edge regeneration
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Refusing to commit generated artifacts alongside unrelated source changes:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit only canonical generated Edge bundles to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated Edge bundles already match shared code.'
            exit 0
          fi
          git commit -m 'build(edge): synchronize 1.0.10 release candidate gameplay and co-op bundles'
          git push origin HEAD:release/1.0.10-aab-prep-20261115
          echo 'Release branch Edge bundles updated; re-run all release CI on the resulting SHA.'
