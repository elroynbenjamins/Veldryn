name: Feature branch generated gameplay bundle
on:
  push:
    branches:
      - feature/fallen-knight-manual-heal-20261114
permissions:
  contents: write
jobs:
  rebuild-feature-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fallen-knight-manual-heal-20261114
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build and verify canonical gameplay and co-op bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated artifacts to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Canonical bundles are already up to date.'
            exit 0
          fi
          git commit -m 'build(edge): sync manual boss healing gameplay bundle'
          git push origin HEAD:feature/fallen-knight-manual-heal-20261114
