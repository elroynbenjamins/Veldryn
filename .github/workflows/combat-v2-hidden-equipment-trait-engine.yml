name: Combat 2.0 hidden equipment trait engine
on:
  pull_request:
    paths:
      - 'backend/src/server/combat/engine.ts'
      - 'backend/src/server/combat/types.ts'
      - 'backend/src/server/combat/v2/equipment-trait-engine-*.ts'
      - 'backend/src/server/combat/v2/equipment-trait-exact-copy-adapter.ts'
      - 'backend/src/server/combat/v2/unified-equipment-encounter.ts'
      - 'backend/src/server/combat/v2/__tests__/equipment-trait-*.ts'
      - 'backend/src/server/party/weekly-party-boss-traits-v90.ts'
      - 'backend/src/server/party/weekly-party-event-eq2-traits-v92.ts'
      - 'backend/src/server/party/weekly-party-event-result-audit-v95.ts'
      - 'backend/src/server/party/weekly-party-event-replay-v96.ts'
      - 'backend/src/server/party/weekly-party-event-review-ledger-v97.ts'
      - 'backend/src/server/party/__tests__/weekly-party-event-eq2-traits-v92.ts'
      - 'backend/src/server/party/party-role-swap-*.ts'
      - 'backend/src/server/party/party-chat-action-*.ts'
      - 'backend/tests/party-role-swap-chat-session-v119.cjs'
      - 'apps/mobile/src/core/party-chat-*-preview-v*.ts'
      - 'backend/src/server/party/__tests__/weekly-party-event-eq2-full-build-v92.ts'
      - 'backend/src/server/party/__tests__/weekly-party-event-eq2-class-spec-matrix-v93.ts'
      - '.github/workflows/combat-v2-hidden-equipment-trait-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Strict real backend TypeScript compilation
        run: pnpm --dir backend build
      - name: Token, hit, reflection, heal and replay safety
        run: node backend/dist/server/combat/v2/__tests__/equipment-trait-engine.js
      - name: Six regional bosses x nine classes x two real specialization paths with exact item receipts
        run: node backend/dist/server/combat/v2/__tests__/equipment-trait-exact-copy-boss-matrix.js
      - name: V92 full-duration four-family Party boss with real V2 equipped trait hooks (QA only)
        run: node backend/dist/server/party/__tests__/weekly-party-event-eq2-traits-v92.js
      - name: Verify role-swap chat session, mobile intent and atomic fixture receipt integration
        run: node backend/tests/party-role-swap-chat-session-v119.cjs
      - name: V92 verified full Equipment+Skill 2.0 compiler for two Party members
        run: node backend/dist/server/party/__tests__/weekly-party-event-eq2-full-build-v92.js
      - name: V93 all 9 classes and 18 specs against four Party bosses, three difficulties and three sizes (full EQ2 item source)
        run: node backend/dist/server/party/__tests__/weekly-party-event-eq2-class-spec-matrix-v93.js
      - name: Baseline legacy engine parity and Enemy V2 token coexistence
        run: |
          node backend/dist/server/combat/v2/__tests__/enemy-engine-coexistence.js
          node backend/dist/server/combat/__tests__/combat-smoke.js
      - name: V94 strict authored boss + V95 nonpaying review audit are covered by Party tests
        run: |
          grep -q 'noncanonical_v90_boss_kit' backend/src/server/party/weekly-party-event-eq2-traits-v92.ts
          grep -q 'PARTY_EVENT_RESULT_AUDIT_V95_RELEASED=false' backend/src/server/party/weekly-party-event-result-audit-v95.ts
          grep -q 'rewardGranted:false' backend/src/server/party/weekly-party-event-result-audit-v95.ts
          test ! -f supabase/migrations/20261122_party_event_result_audit_v95.sql
      - name: V96 and V97 must remain private nonpaying tests
        run: |
          grep -q 'PARTY_EVENT_REPLAY_V96_RELEASED=false' backend/src/server/party/weekly-party-event-replay-v96.ts
          grep -q 'PARTY_EVENT_REVIEW_LEDGER_V97_RELEASED=false' backend/src/server/party/weekly-party-event-review-ledger-v97.ts
          grep -q 'PARTY_EVENT_V96_V97_NONPAYING_REPLAY_LEDGER_PASS' backend/src/server/party/__tests__/weekly-party-event-eq2-traits-v92.ts
          test ! -f supabase/migrations/20261122_party_event_review_ledger_v97.sql
      - name: Assert V92 is private, unreleased and never a deployable migration
        run: |
          grep -q 'PARTY_EVENT_EQ2_TRAIT_V92_RELEASED=false' backend/src/server/party/weekly-party-event-eq2-traits-v92.ts
          grep -q 'PARTY_EVENT_BOSS_TRAITS_V90_RELEASED=false' backend/src/server/party/weekly-party-boss-traits-v90.ts
          test ! -f supabase/migrations/20261122_party_event_eq2_v92.sql
      - name: Reject new trait engine authority in live/public mobile or online code
        run: |
          if grep -R -E 'issueEquipmentV2TraitAuthority|authorizeEquipmentV2TraitEngine|EquipmentTraitRuntimeV2' backend/online apps/mobile/src backend/supabase/functions --include='*.ts' --include='*.tsx'; then
            echo 'Hidden Equipment 2.0 trait engine leaked into public routes'
            exit 1
          fi
