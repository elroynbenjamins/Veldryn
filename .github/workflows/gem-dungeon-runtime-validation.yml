name: Gem and dungeon runtime validation

# Focused tests must still run while the separate release gate detects
# out-of-date generated Edge bundles. This does not weaken that release gate.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/core/**'
      - 'apps/mobile/src/content/gems-v1.ts'
      - 'apps/mobile/tests/stat-gem-runtime-v1.ts'
      - 'backend/src/server/combat/**'
      - 'backend/src/server/equipment/**'
      - 'backend/src/server/coop/**'
      - 'backend/online/**'
      - '.github/workflows/gem-dungeon-runtime-validation.yml'
  pull_request:
    paths:
      - 'apps/mobile/src/core/**'
      - 'apps/mobile/src/content/gems-v1.ts'
      - 'apps/mobile/tests/stat-gem-runtime-v1.ts'
      - 'backend/src/server/combat/**'
      - 'backend/src/server/equipment/**'
      - 'backend/src/server/coop/**'
      - 'backend/online/**'
      - '.github/workflows/gem-dungeon-runtime-validation.yml'
  workflow_dispatch:

jobs:
  mobile:
    name: Mobile typing and full core regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Typecheck all mobile gameplay modules and tests
        run: pnpm --dir apps/mobile typecheck:core
      - name: Typecheck mobile app
        run: pnpm --dir apps/mobile typecheck
      - name: Run all mobile core regressions
        run: pnpm --dir apps/mobile test:core

  dungeon:
    name: Dungeon combat, effect gems and co-op simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Run canonical gem and effect-trigger combat tests
        run: pnpm --dir backend test:gems
      - name: Run unique-role and Echo/Q-mode composition
        run: pnpm --dir backend test:coop-composition
      - name: Verify dungeon tier difficulty and rewards
        run: pnpm --dir backend test:dungeon-tier-balance
      - name: Verify Live dungeon battle pacing
        run: pnpm --dir backend test:live-pacing
      - name: Prove equipped gems persist through frozen dungeon snapshots
        run: node backend/dist/online/backend/online/tests/coop-loadout.js
      - name: Verify dungeon potions and Q-mode merchant behavior
        run: pnpm --dir backend test:qmode-merchant

