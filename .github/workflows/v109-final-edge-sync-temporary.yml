name: Temporary v1.0.9 final main Edge sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v109-final-edge-sync-temporary.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild and verify consolidated Edge functions
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Edge bundles already synchronized.'
            exit 0
          fi
          git commit -m 'build(edge): synchronize consolidated v1.0.9 release sources'
          git push origin HEAD:main
