name: Regenerate Faith Edge bundles (temporary)
on:
  push:
    branches:
      - feature/faith-balanced-blessings-v2
    paths:
      - '.github/workflows/faith-edge-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install shared mobile and backend dependencies
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Regenerate canonical gameplay and co-op Edge bundles
        run: pnpm --dir backend build:online
      - name: Verify source-to-generated parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated artifacts to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Regenerate gameplay and co-op Edge bundles for Faith rework"
          git push origin "HEAD:feature/faith-balanced-blessings-v2"
