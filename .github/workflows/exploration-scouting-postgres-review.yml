name: Hidden Exploration 2.0 PostgreSQL transaction review
on:
  pull_request:
    paths:
      - 'tools/exploration-scouting-postgres-review*'
      - '.github/workflows/exploration-scouting-postgres-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: scouting_review_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scouting_review_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: scouting_review_ci
      PGUSER: postgres
      PGPASSWORD: disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -X -v ON_ERROR_STOP=1 -f tools/exploration-scouting-postgres-review.sql
      - run: node tools/exploration-scouting-postgres-review.mjs
