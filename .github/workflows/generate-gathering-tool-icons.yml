name: Generate standalone gathering-tool icons

on:
  push:
    branches:
      - fix/standalone-gathering-tool-icons
    paths:
      - .github/workflows/generate-gathering-tool-icons.yml
      - tools/split-gathering-tool-icons.py
      - apps/mobile/assets/tools/gathering-tools-v3.png
      - apps/mobile/tests/gathering-tool-individual-artwork.cjs
      - apps/mobile/src/theme/gathering-tool-assets.ts
      - apps/mobile/src/components/GatheringToolArtwork.tsx

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 12 distinct tool PNGs
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/split-gathering-tool-icons.py
      - name: Verify PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path("apps/mobile/assets/tools/individual")
          paths=sorted(folder.glob("*.png"))
          assert len(paths)==12, f"Expected 12 icons, got {len(paths)}"
          for path in paths:
              with Image.open(path) as icon:
                  assert icon.size==(256,256), (path,icon.size)
                  assert icon.mode=="RGBA", (path,icon.mode)
                  assert icon.getchannel("A").getbbox(), f"Blank tool: {path}"
          print("Verified 12 individual 256x256 transparent icons")
          PY
      - name: Check standalone asset references and UI contracts
        run: node apps/mobile/tests/gathering-tool-individual-artwork.cjs
      - name: Commit only generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/tools/individual/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: add 12 standalone gathering tool icons"
            git push origin HEAD:fix/standalone-gathering-tool-icons
          fi
