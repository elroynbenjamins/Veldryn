name: Mobile UX validation

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'tools/mobile-core-tests.json'
      - '.github/workflows/mobile-ux-validation.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'tools/mobile-core-tests.json'
      - '.github/workflows/mobile-ux-validation.yml'
  workflow_dispatch:

jobs:
  typecheck-and-core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install backend dependencies for mobile checks
        run: pnpm --dir ../../backend install --frozen-lockfile
      - name: Validate Inventory storage controls
        run: node tests/inventory-storage-management-ui.cjs
      - name: Validate UX popup and activity Stop reliability
        run: |
          pnpm exec tsc -p tsconfig.ux-popup.json --outDir .ux-popup-build
          node .ux-popup-build/apps/mobile/tests/ux-popup-reliability.js
          node tests/ux-popup-reliability-ui.cjs
          node tests/settings-simplicity-ui.cjs
      - name: Verify immersive active Dungeon flow and Live vote UI
        run: node tests/dungeon-active-run-immersive-ui.cjs && node tests/dungeon-flow-simplicity-ui.cjs && node tests/dungeon-route-choice-ui.cjs && node tests/dungeon-live-pacing-ui.cjs && node tests/dungeon-room-outcomes-merchant-ui.cjs
      - name: Verify compact dungeon lobby equipment and Echo companion UI
        run: node tests/coop-combat-setup-ui.cjs
      - name: Verify dungeon reward, tier and weekly budget UX
        run: node tests/dungeon-reward-balance-ui.cjs
      - name: Validate failure consolation and final Dungeon reward UX
        run: node tests/dungeon-failure-consolation-ui.cjs
      - name: Validate chat emote Settings navigation
        run: node tests/chat-emote-settings-navigation.cjs
      - name: Verify expanded chat tabs, keyboard clearance and floating emotes
        run: node tests/chat-channel-dropdown-ui-contract.cjs && node tests/chat-overlay-layout.cjs
      - name: Typecheck app
        run: pnpm typecheck
      - name: Validate focused Home layout and queue/reward safety
        run: node tests/home-priority-dashboard-ui.cjs
      - name: Verify compact Quest screens, modal safety and reward semantics
        run: node tests/quest-refined-ui.cjs
      - name: Validate Gems storage and dungeon recovery UX
        run: node tests/storage-dungeon-refinement-ui.cjs
      - name: Validate Frostfall 14-day preview and sealed rewards
        run: pnpm test:frostfall-preview
      - name: Validate Companion Collection and Codex UX
        run: node tests/companion-codex-focused-ui.cjs
      - name: Validate Companion layout and upgrade resource icons
        run: node tests/companion-layout-refinement-ui.cjs
      - name: Validate all Companion acquisition paths and redesigned Index
        run: pnpm test:companions
      - name: Validate Account New Unlocks inbox
        run: node tests/account-unlock-inbox-ui.cjs
      - name: Typecheck Account unlock inbox UI
        run: pnpm exec tsc -p tsconfig.account-unlocks.json --noEmit
      - name: Typecheck core
        run: pnpm typecheck:core
      - name: Test Guild onboarding, progress migration and detailed help
        run: |
          pnpm exec tsc -p tsconfig.onboarding.json
          node .onboarding-build/apps/mobile/tests/guild-tour-v2.js
          node tests/guild-guide-library-ui.cjs
          node tests/guild-guide-render-layout.cjs
      - name: Verify compact gathering Drops UI and real drop odds
        run: pnpm test:gathering-drops
      - name: Run mobile core tests
        run: pnpm test:core
