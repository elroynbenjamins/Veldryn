name: Regenerate gameplay bundle for hunt polish
on:
  push:
    branches: [polish/early-hunt-pacing-ui-and-forecast]
    paths:
      - '.github/workflows/regen-hunt-polish-edge.yml'
      - 'apps/mobile/src/core/game.ts'
      - 'apps/mobile/src/core/dashboard.ts'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/early-hunt-pacing-ui-and-forecast
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - name: Commit rebuilt gameplay bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate gameplay Edge bundle after early hunt polish"
          git fetch origin polish/early-hunt-pacing-ui-and-forecast
          git rebase origin/polish/early-hunt-pacing-ui-and-forecast
          git push origin HEAD:polish/early-hunt-pacing-ui-and-forecast
