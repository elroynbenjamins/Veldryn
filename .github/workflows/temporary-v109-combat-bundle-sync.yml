name: Temporary combat skill Edge bundle regeneration
on:
  push:
    branches:
      - feature/combat-skill-activation-feedback-20261114
    paths:
      - '.github/workflows/temporary-v109-combat-bundle-sync.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install pinned workspace dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build and check gameplay/co-op Edge parity
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles and self-delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          git rm -- .github/workflows/temporary-v109-combat-bundle-sync.yml
          git commit -m 'build(edge): verify combat skills and fractional hunt rewards bundle parity'
          git push origin HEAD:feature/combat-skill-activation-feedback-20261114
