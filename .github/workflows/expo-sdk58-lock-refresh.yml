name: Regenerate Expo 58 pnpm lockfile (temporary)

on:
  push:
    branches:
      - fix/expo-sdk58-compatible-dependencies
    paths:
      - 'apps/mobile/package.json'
      - 'apps/mobile/pnpm-lock.yaml'
      - '.github/workflows/expo-sdk58-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Resolve dependencies and refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Verify frozen-lockfile installation
        run: pnpm install --frozen-lockfile
      - name: Verify SDK-compatible versions
        run: npx -y expo-doctor
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(mobile): regenerate Expo SDK 58 pnpm lockfile'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Lockfile already synchronized.'
          fi
