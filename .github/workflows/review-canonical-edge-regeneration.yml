name: Review canonical Edge regeneration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/review-canonical-edge-regeneration.yml'
      - 'apps/mobile/src/**'
      - 'backend/online/**'
      - 'backend/src/**'
permissions:
  contents: read
concurrency:
  group: review-edge-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/economy-catalyst-review-20261126'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Regenerate and verify canonical bundles
        run: |
          node tools/build-online.mjs
          node tools/verify-gameplay-edge.mjs
          git diff --check -- backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          mkdir -p "$RUNNER_TEMP/edge-review"
          cp backend/supabase/functions/gameplay/index.ts "$RUNNER_TEMP/edge-review/gameplay.ts"
          cp backend/supabase/functions/coop/index.ts "$RUNNER_TEMP/edge-review/coop.ts"
          cd "$RUNNER_TEMP/edge-review"
          sha256sum gameplay.ts coop.ts > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-review-edge
          path: ${{ runner.temp }}/edge-review/
          retention-days: 1
          if-no-files-found: error
  commit-generated:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/economy-catalyst-review-20261126'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: canonical-review-edge
          path: ${{ runner.temp }}/edge-review
      - name: Commit only canonical output to exact review branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cd "$RUNNER_TEMP/edge-review"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/edge-review/gameplay.ts" backend/supabase/functions/gameplay/index.ts
          cp "$RUNNER_TEMP/edge-review/coop.ts" backend/supabase/functions/coop/index.ts
          git add -- backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate canonical review Edge bundles'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/integration/economy-catalyst-review-20261126
