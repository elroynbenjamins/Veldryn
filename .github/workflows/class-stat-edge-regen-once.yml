name: One-time class stat Edge bundle regeneration
on:
  push:
    branches: [balance/class-gear-stat-identity]
    paths: ['.github/workflows/class-stat-edge-regen-once.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - name: Commit only regenerated Edge bundles
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize gameplay and co-op Edge bundles with class balance'
          git push origin HEAD:refs/heads/balance/class-gear-stat-identity
