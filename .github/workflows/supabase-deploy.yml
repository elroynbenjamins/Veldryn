name: Deploy Supabase (manual)

# Manual-dispatch only. Database deployment and feature activation are owned by
# the database owner, so this never runs on push/merge — it is a controlled tool
# that a maintainer triggers deliberately, choosing the environment each time.
# Production is gated behind the "supabase-production" GitHub Environment, which
# can require a reviewer's approval before the job runs.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options: [staging, production]
        default: staging
      functions_only:
        description: Deploy Edge Functions only (recommended while migration histories diverge)
        type: boolean
        default: true

concurrency:
  group: supabase-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production maps to a protected environment so it can require approval.
    environment: supabase-${{ github.event.inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ github.event.inputs.environment == 'production' && 'nyjwigipamnvpdvpauuv' || 'iqfmmpvwanvvmxcftfxw' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate selected deployment credentials
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing in the selected supabase-${{ github.event.inputs.environment }} GitHub Environment."
            echo "::error::Configure the GitHub Environment secret before dispatching this deployment."
            exit 1
          fi
          if [ "${{ github.event.inputs.functions_only }}" != "true" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is required for the migrations-on deployment path."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies for reproducible Edge verification
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify committed gameplay Edge bundle matches the shared engine
        run: node tools/verify-gameplay-edge.mjs

      - name: Link project (only required for migrations)
        if: ${{ github.event.inputs.functions_only != 'true' }}
        run: supabase link --project-ref "$PROJECT_REF"
        working-directory: backend/supabase

      - name: Apply migrations
        if: ${{ github.event.inputs.functions_only != 'true' }}
        run: supabase db push
        working-directory: backend/supabase

      - name: Deploy gameplay function
        run: supabase functions deploy gameplay --project-ref "$PROJECT_REF"
        working-directory: backend/supabase

      - name: Deploy coop function
        run: supabase functions deploy coop --project-ref "$PROJECT_REF"
        working-directory: backend/supabase
