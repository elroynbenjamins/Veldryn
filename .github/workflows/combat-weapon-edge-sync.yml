name: Ported weapon swap Edge bundle parity (branch-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/mobile/src/core/game.ts'
      - 'apps/mobile/src/core/crafted-gear-ownership.ts'
      - '.github/workflows/combat-weapon-edge-sync.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/combat-weapon-swap-main-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - run: node tools/verify-gameplay-edge.mjs
      - name: Commit verified artifacts only on this PR
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build: sync in-combat equipment gameplay Edge output'
            git push origin HEAD:refs/heads/integration/combat-weapon-swap-main-20261115
          fi
