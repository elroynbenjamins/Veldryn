name: Regenerate Q-Mode Edge bundles (PR 775 only)

# Temporary release-preparation workflow restricted to this first-party PR.
# No Supabase credentials or deployment; it only refreshes generated code.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/regen-qmode-775.yml'
      - 'backend/src/**'
      - 'backend/online/**'
      - 'backend/supabase/functions/gameplay/index.ts'
      - 'backend/supabase/functions/coop/index.ts'

permissions:
  contents: write

concurrency:
  group: regen-qmode-775
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event.pull_request.number == 775 && github.event.pull_request.head.repo.full_name == 'elroynbenjamins/Veldryn' && github.event.pull_request.head.ref == 'balance/qmode-echo-enemy-pressure-variance-1.0.5' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/qmode-echo-enemy-pressure-variance-1.0.5
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Install locked mobile dependencies for shared imports
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile
      - name: Validate backend TypeScript before generating
        working-directory: backend
        run: pnpm typecheck:online
      - name: Build both authoritative Edge entrypoints
        run: pnpm --dir backend build:online
      - name: Verify gameplay bundle is exactly reproducible
        run: node tools/verify-gameplay-edge.mjs
      - name: Review generated changes and commit to the PR branch
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          git diff --cached --check
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(edge): regenerate Q-Mode 1.0.5 gameplay and coop bundles"
            git push origin HEAD:refs/heads/balance/qmode-echo-enemy-pressure-variance-1.0.5
          else
            echo "Both generated Edge bundles are already synchronized"
          fi
