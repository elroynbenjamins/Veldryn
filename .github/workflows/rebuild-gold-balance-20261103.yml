name: Regenerate gameplay bundle for gold balance
on:
  push:
    branches:
      - balance/gold-costs-inventory-sanctuary-crafting-20261103
    paths:
      - .github/workflows/rebuild-gold-balance-20261103.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Rebuild and verify gameplay Edge bundle parity
        run: |
          node tools/build-online.mjs
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate gameplay backend with new Gold costs'
            git push origin HEAD:balance/gold-costs-inventory-sanctuary-crafting-20261103
          fi
