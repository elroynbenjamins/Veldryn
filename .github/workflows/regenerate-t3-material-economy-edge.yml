name: Temporary T3 material economy Edge regeneration

on:
  push:
    branches:
      - balance/t3-dunewood-x3-xp20-goldx2-20261109
    paths:
      - '.github/workflows/regenerate-t3-material-economy-edge.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate canonical Gameplay and Co-op bundles
        run: pnpm --dir backend build:online
      - name: Verify generated bundle parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated files to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Both generated bundles already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize T3 material economy in Edge bundles"
          git push origin HEAD:balance/t3-dunewood-x3-xp20-goldx2-20261109
