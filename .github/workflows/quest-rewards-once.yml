name: Quest rewards one-time validation and gameplay bundle sync
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - apps/mobile/tests/seasonal-quests.ts
permissions:
  contents: write
jobs:
  quest-reward-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
      - name: Install mobile and backend dependencies
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Typecheck mobile and shared game engine
        run: |
          pnpm --dir apps/mobile typecheck:core
          pnpm --dir apps/mobile typecheck
      - name: Test Quest progression rewards
        run: node tools/run-mobile-tests.mjs seasonal-quests
      - name: Typecheck backend online
        run: pnpm --dir backend typecheck:online
      - name: Generate authoritative gameplay Edge bundle
        run: node tools/build-online.mjs
      - name: Commit regenerated bundle if changed
        run: |
          git config user.name "veldryn-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(gameplay): sync selectable Quest reward settlement"
            git push origin HEAD:feat/quest-progression-reward-choices-20261106
          fi
