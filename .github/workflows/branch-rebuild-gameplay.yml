name: Temporary gameplay bundle regeneration
on:
  push:
    branches: [feat/event-bond-candy-per-companion]
    paths: ['.github/workflows/branch-rebuild-gameplay.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Regenerate gameplay from canonical shared engine
        run: pnpm --dir backend build:online
      - name: Commit only generated gameplay bundle
        run: |
          git diff --stat -- backend/supabase/functions/gameplay/index.ts
          if git diff --quiet -- backend/supabase/functions/gameplay/index.ts; then
            echo "Gameplay bundle already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts
          git commit -m "build: regenerate gameplay Edge bundle from shared engine"
          git push origin HEAD:feat/event-bond-candy-per-companion
