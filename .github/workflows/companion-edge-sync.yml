name: Regenerate companion Edge bundles on feature PR

# Restricted to this companion feature branch; never runs on fork PRs, main,
# or production deployment. Only commits two reproducible generated files.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/src/server/companions/**'
      - 'backend/src/server/combat/engine.ts'
      - 'apps/mobile/src/content/combat-companions.ts'
      - '.github/workflows/companion-edge-sync.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/companion-identity-combat-2026-11-15'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch head, never the synthetic PR merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Build canonical gameplay and co-op Edge artifacts
        run: pnpm --dir backend build:online
      - name: Verify generated files are source-exact
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles only to same feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'build: sync companion combat gameplay and co-op Edge bundles'
            # Plain push is intentionally non-forced; concurrent PR commits win.
            git push origin HEAD:refs/heads/feature/companion-identity-combat-2026-11-15
          else
            echo 'Edge bundles are already in sync.'
          fi
