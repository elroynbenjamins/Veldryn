name: One-time class stat Edge bundle regeneration

# Temporary branch-scoped workflow: regenerate checked-in bundles for review.
# No deployment and no database operation.
on:
  push:
    branches:
      - balance/class-gear-stat-identity
    paths:
      - '.github/workflows/class-stat-edge-regen-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install shared mobile dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Rebuild server-authored gameplay and co-op Edge bundles
        run: pnpm --dir backend build:online
      - name: Commit generated bundles only to class balance branch
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Generated bundles were already synchronized."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate gameplay and co-op Edge bundles for class stat identity'
          git push origin HEAD:refs/heads/balance/class-gear-stat-identity
