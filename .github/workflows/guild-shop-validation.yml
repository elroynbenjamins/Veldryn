name: Guild Shop validation
on:
  pull_request:
    paths:
      - 'apps/mobile/src/**'
      - 'backend/online/**'
      - 'backend/supabase/migrations/20261018*_guild*.sql'
      - 'backend/test-guild-shop-migrations.mjs'
      - 'backend/package.json'
      - 'packages/guild-shop/**'
      - '.github/workflows/guild-shop-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Online backend and SQL integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Supply pnpm 9 workspace root (CI only)
        run: printf '\npackages:\n  - "."\n' >> backend/pnpm-workspace.yaml
      - name: Install pinned backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Install mobile cross-package type dependencies
        run: |
          printf '\npackages:\n  - "."\n' >> apps/mobile/pnpm-workspace.yaml
          pnpm --dir apps/mobile install --frozen-lockfile --ignore-scripts
      - name: Typecheck online backend and run focused Guild Shop tests
        run: |
          pnpm --dir backend exec tsc -p tsconfig.online.json
          node backend/dist/online/backend/online/tests/guild-shop-read.js
          node backend/dist/online/backend/online/tests/guild-shop-policies.js
      - name: Isolated database migration and purchase tests
        run: node backend/test-guild-shop-migrations.mjs

  mobile:
    name: Mobile TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Supply pnpm 9 workspace root (CI only)
        run: printf '\npackages:\n  - "."\n' >> apps/mobile/pnpm-workspace.yaml
      - name: Install pinned mobile dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile --ignore-scripts
      - name: Install backend cross-package type dependencies
        run: |
          printf '\npackages:\n  - "."\n' >> backend/pnpm-workspace.yaml
          pnpm --dir backend install --frozen-lockfile
      - name: Typecheck mobile
        run: pnpm --dir apps/mobile exec tsc --noEmit -p tsconfig.json
