name: PR 894 temporary gameplay bundle regeneration

on:
  push:
    branches:
      - feature/asterfall-sunscar-equipment-tier-material-alignment
    paths:
      - .github/workflows/pr-894-regenerate-edge.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/asterfall-sunscar-equipment-tier-material-alignment
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - run: node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated online bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate online Edge bundles for Sunscar T3/T4 material sourcing"
            git push origin HEAD:feature/asterfall-sunscar-equipment-tier-material-alignment
          fi
