name: Mobile UI validation

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ui-validation.yml'
  workflow_dispatch:

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install backend dependencies referenced by mobile types
        run: pnpm --dir ../../backend install --frozen-lockfile
      - name: Typecheck mobile app
        run: pnpm typecheck
      - name: Typecheck core
        run: pnpm typecheck:core
      - name: Run mobile core regressions
        run: pnpm test:core
