name: Equipment Pouch rebase validation and Edge sync
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - apps/mobile/tests/equipment-pouch.ts
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
      - name: Install dependencies
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Test combined Equipment Pouch code
        run: |
          pnpm --dir apps/mobile typecheck:core
          pnpm --dir apps/mobile typecheck
          node tools/run-mobile-tests.mjs equipment-pouch
          pnpm --dir backend typecheck:online
      - name: Regenerate and validate Edge bundle
        run: |
          node tools/build-online.mjs
          node tools/verify-gameplay-edge.mjs
      - name: Commit canonical generated bundles
        run: |
          git config user.name "veldryn-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(edge): sync rebased Equipment Pouch sale"
            git push origin HEAD:feat/equipment-pouch-safe-bulk-sell-20261106
          fi
