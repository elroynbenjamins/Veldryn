name: Rebuild shared gameplay Edge bundles

# Rebuild the canonical server game engines when shared balance and Guild Bank rules change.
# Other gameplay modifications can still request the workflow manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-shared-gameplay-bundles.yml'
      - 'apps/mobile/src/content/exploration.ts'
      - 'apps/mobile/src/content/faith.ts'
      - 'apps/mobile/src/content/monsters.ts'
      - 'apps/mobile/src/content/gathering-tools.ts'
      - 'apps/mobile/tests/gathering-tools.ts'
      - 'apps/mobile/tests/monster-drop-balance.ts'
      - 'apps/mobile/src/core/live-events.ts'
      - 'apps/mobile/src/core/permanent-boosts.ts'
      - 'apps/mobile/src/core/equipment-salvage.ts'
      - 'apps/mobile/src/core/crafted-gear-ownership.ts'
      - 'apps/mobile/src/core/equipment-pouch-selling.ts'
      - 'apps/mobile/tests/equipment-salvage-recovery.ts'
      - 'apps/mobile/tests/faith.ts'
      - 'apps/mobile/tests/exploration-balance.ts'
      - 'apps/mobile/src/core/gem-progression-v1.ts'
      - 'apps/mobile/tests/gem-progression-v1.ts'
      - 'backend/online/guild-shop-read.ts'
      - 'backend/online/tests/guild-shop-read.ts'
      - 'backend/src/server/expeditions/content/coop-route-content.ts'
      # Keep the deployable co-op Edge bundle synchronized whenever its
      # regional gates, roster snapshots, matchmaking, or combat logic changes.
      - 'backend/src/server/coop/dungeon-entry-policy.ts'
      - 'backend/src/server/coop/regional-power-balance.ts'
      - 'backend/src/server/coop/qmode.ts'
      - 'backend/src/server/coop/loadout-snapshots.ts'
      - 'backend/src/server/coop/echo-recruitment.ts'
      - 'backend/src/server/coop/qmode-npc-allies.ts'
      - 'backend/online/coop.ts'
      - 'backend/online/dungeon-shop.ts'
      - 'backend/src/server/expeditions/dungeon-shop-catalog-v1.ts'
      - 'apps/mobile/src/core/dungeon-marks-shop-types.ts'
      - 'backend/online/coop-entry.ts'
      - 'backend/online/coop-loadout.ts'
      - 'backend/online/qmode-runtime.ts'
      - 'backend/online/live-runtime.ts'
      - 'backend/online/live-ready.ts'
      - 'backend/online/live-queue.ts'
      - 'apps/mobile/src/core/combat-power.ts'
      - 'apps/mobile/src/core/class-combat.ts'
      - 'apps/mobile/src/core/game.ts'

permissions:
  contents: write

concurrency:
  group: rebuild-shared-gameplay-bundles-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Verify the two-path equipment and Exploration balance regressions
        run: node tools/run-mobile-tests.mjs equipment-two-path-balance exploration-balance equipment-salvage-recovery gathering-tools monster-drop-balance
      - name: Rebuild canonical generated bundles and commit them on top of current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            # This checkout is a disposable CI workspace; never rewrite remote history.
            git reset --hard origin/main
            pnpm --dir backend build:online
            node tools/verify-gameplay-edge.mjs
            git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
            if git diff --cached --quiet; then
              echo 'Gameplay and co-op generated bundles are already in sync.'
              exit 0
            fi
            git commit -m 'build(edge): sync canonical gameplay and co-op bundles after Exploration rebalance'
            if git push origin HEAD:main; then
              echo 'Generated Edge bundles committed to main.'
              exit 0
            fi
            echo "Main advanced during generated bundle push; rebuilding against latest main (attempt $attempt)."
          done
          echo 'Unable to push generated bundles without racing a new main commit.' >&2
          exit 1
