name: Temporary guild-cost gameplay bundle regeneration
on:
  push:
    branches:
      - feat/guild-construction-member-cost-scaling-20261103
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Compile and regenerate the committed gameplay Edge bundle
        run: node tools/build-online.mjs
      - name: Commit generated gameplay bundle (if changed)
        run: |
          git add backend/supabase/functions/gameplay/index.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: regenerate gameplay edge bundle for guild pricing'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
