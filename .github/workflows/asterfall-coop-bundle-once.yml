# Temporary, branch-scoped helper. Remove after the canonical generated bundle is committed.
name: One-time Asterfall co-op bundle regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asterfall-coop-bundle-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/asterfall-encounter-variety-20261107'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Regenerate canonical generated Edge bundles
        run: pnpm --dir backend build:online
      - name: Commit only regenerated co-op Edge bundle on the feature branch
        run: |
          git add backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(dungeon): regenerate co-op Edge bundle from shared engine'
            git push origin HEAD:refs/heads/feat/asterfall-encounter-variety-20261107
          fi
