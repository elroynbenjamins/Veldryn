name: Release PR-only gameplay Edge parity sync

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.github/workflows/mobile-release-edge-sync.yml'
      - 'apps/mobile/package.json'

concurrency:
  group: release-edge-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/mobile-ci-baseline-20261113' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked shared engine dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild both generated Edge bundles safely on this draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
            git reset --hard "refs/remotes/origin/${GITHUB_HEAD_REF}"
            pnpm --dir backend build:online
            node tools/verify-gameplay-edge.mjs
            git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
            if git diff --cached --quiet; then
              echo 'Generated gameplay and co-op bundles already match this PR.'
              exit 0
            fi
            git commit -m 'build(release): synchronize generated gameplay and co-op Edge bundles'
            if git push origin "HEAD:${GITHUB_HEAD_REF}"; then
              echo 'Committed generated artifacts to the draft PR branch only.'
              exit 0
            fi
            echo "PR changed while building (attempt ${attempt}); rebuilding from latest."
          done
          echo 'Unable to update generated bundles without overwriting newer branch work.' >&2
          exit 1
