name: Draft 1.0.10 release ancestry and guard validation
# Disposable CI helper for isolated reconciliation only.
on:
  push:
    branches: ['integration/v1010-latest-release-guard-merge-20261116']
    paths: ['.github/workflows/v1010-release-guard-reconcile-temp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual 1.0.10 release preflight
        run: node tools/check-v110-aab-readiness.mjs
      - name: Require both current reconciliation and latest release ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c46ee7d8099b38466fe02081ec4d66648fddb0f7 HEAD
          git merge-base --is-ancestor eee36a776e64c0cc5e2bcf1c5016d912cc98f4b2 HEAD
          grep -q '14227708964' docs/operations/2026-11-15-main-integration-register.md
