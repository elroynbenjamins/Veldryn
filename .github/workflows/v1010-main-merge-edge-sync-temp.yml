name: v1.0.10 combined main/release Edge parity regeneration
# Temporary integration-only workflow. Remove before main merge.
on:
  push:
    branches: ['integration/v1010-main-reconcile-20261116']
    paths: ['.github/workflows/v1010-main-merge-edge-sync-temp.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v1010-main-release-integration-edge-sync
  cancel-in-progress: false
jobs:
  source-and-generated-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1010-main-reconcile-20261116
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned mobile and backend packages
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Check integrated mobile and authoritative gameplay contracts
        run: |
          pnpm --dir apps/mobile typecheck
          node tools/run-mobile-tests.mjs account-progression offline-cap character-creation-onboarding equipment-timed-crafting-ui-contract
          cd apps/mobile
          node tests/german-expedition-shop-localization.cjs
          node tests/dungeon-room-outcomes-merchant-ui.cjs
          node tests/dungeon-compact-completion-ui.cjs
          node tests/dungeon-flow-simplicity-ui.cjs
          node tests/companion-layout-refinement-ui.cjs
          node tests/companion-codex-focused-ui.cjs
      - name: Rebuild canonical gameplay and co-op Edge artifacts
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Reject non-generated code changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed paths:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit only the two generated bundles to the integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated code matches the reconciled engine.'
            exit 0
          fi
          git commit -m 'build(edge): sync reconciled main and v1.0.10 gameplay/co-op bundles'
          git push origin HEAD:integration/v1010-main-reconcile-20261116
