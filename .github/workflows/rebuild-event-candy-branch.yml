name: Rebuild gameplay bundle for event candy fix
on:
  push:
    branches:
      - fix/event-candy-purchases-after-end-20261103
    paths:
      - '.github/workflows/rebuild-event-candy-branch.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Rebuild and verify deterministic gameplay bundle
        run: |
          node tools/build-online.mjs
          node tools/verify-gameplay-edge.mjs
      - name: Commit gameplay bundle to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild gameplay Edge bundle for candy lifecycle'
            git push origin HEAD:fix/event-candy-purchases-after-end-20261103
          fi
