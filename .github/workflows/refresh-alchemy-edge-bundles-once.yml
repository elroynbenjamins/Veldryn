name: Refresh Alchemy Edge bundles once (integration branch)
on:
  push:
    branches:
      - feat/alchemy-tiered-role-potions-106
    paths:
      - .github/workflows/refresh-alchemy-edge-bundles-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Supply CI workspace roots
        run: |
          printf '\npackages:\n  - "."\n' >> backend/pnpm-workspace.yaml
          printf '\npackages:\n  - "."\n' >> apps/mobile/pnpm-workspace.yaml
      - name: Install pinned backend tooling
        run: pnpm --dir backend install --frozen-lockfile
      - name: Install cross-package mobile type dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile --ignore-scripts
      - name: Typecheck updated online dungeon combat
        run: pnpm exec tsc -p tsconfig.online.json --noEmit
        working-directory: backend
      - name: Rebuild both Edge bundles from authoritative source
        run: node tools/build-online.mjs
      - name: Verify generated gameplay parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit only the two generated Edge bundles to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate gameplay and co-op Edge bundles for Alchemy dungeon potions"
            git push origin HEAD:feat/alchemy-tiered-role-potions-106
          fi
