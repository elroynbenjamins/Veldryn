name: Hotfix exact-copy legacy salvage Edge sync
on:
  push:
    branches: ['fix/legacy-enchantment-exact-copy-salvage-20261121']
    paths:
      - 'apps/mobile/src/core/crafted-gear-ownership.ts'
      - '.github/workflows/hotfix-legacy-enchantment-edge-sync.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-enchantment-exact-copy-salvage-20261121
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build and verify canonical Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated Edge artifacts on isolated hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Bundles are in sync.'
            exit 0
          fi
          git commit -m 'build(edge): synchronize gameplay bundle for legacy salvage hotfix'
          git fetch origin fix/legacy-enchantment-exact-copy-salvage-20261121
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/fix/legacy-enchantment-exact-copy-salvage-20261121)" ]; then
            echo 'Branch advanced; refuse to push stale generated artifacts.'
            exit 1
          fi
          git push origin HEAD:fix/legacy-enchantment-exact-copy-salvage-20261121
