name: One-time Veldryn 1.0.9 Edge bundle parity sync

on:
  push:
    branches:
      - release/v109-edge-parity-main-20261114
    paths:
      - '.github/workflows/release-v109-edge-parity-sync.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Regenerate gameplay and co-op Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit verified generated output and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          git rm -- .github/workflows/release-v109-edge-parity-sync.yml
          git commit -m 'build(edge): synchronize 1.0.9 generated gameplay and co-op bundles'
          git push origin HEAD:release/v109-edge-parity-main-20261114
