name: Rankings branch - generated Edge bundle review

# This check deliberately has NO repository write permission. Pull request
# code must never run with a token capable of pushing commits.
on:
  pull_request:
    paths:
      - '.github/workflows/rankings-repair-edge-bundles.yml'
      - 'backend/online/edge.ts'
      - 'backend/online/rankings-handler.ts'
      - 'apps/mobile/src/core/**'
      - 'backend/online/**'
      - 'backend/supabase/functions/gameplay/index.ts'
      - 'backend/supabase/functions/coop/index.ts'

permissions:
  contents: read

jobs:
  regenerate-for-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Rebuild the two canonical generated Edge bundles
        run: node tools/build-online.mjs
      - name: Verify outputs against the shared engine
        run: node tools/verify-gameplay-edge.mjs
      - name: Upload generated bundles for review
        uses: actions/upload-artifact@v4
        with:
          name: rankings-generated-gameplay-coop-edge
          retention-days: 3
          if-no-files-found: error
          path: |
            backend/supabase/functions/gameplay/index.ts
            backend/supabase/functions/coop/index.ts
      - name: Report whether checked-in bundles need updating
        shell: bash
        run: |
          if git diff --quiet -- backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts; then
            echo "Generated Edge bundles are already synchronized."
          else
            echo "::warning::The two generated Edge bundles need a reviewed commit; uploaded artifacts contain canonical rebuilds."
          fi
