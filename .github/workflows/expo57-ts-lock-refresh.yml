name: Expo 57 TypeScript lock refresh

on:
  push:
    branches:
      - upgrade/expo57-api36-edge-to-edge-20261006
    paths:
      - '.github/workflows/expo57-ts-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh mobile lockfile through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: upgrade/expo57-api36-edge-to-edge-20261006
        run: |
          set -euo pipefail
          mkdir -p /tmp/veldryn-mobile
          cd /tmp/veldryn-mobile
          api="https://api.github.com/repos/$REPO/contents/apps/mobile/package.json?ref=$BRANCH"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" |
            jq -r '.content' | base64 -d > package.json
          pnpm install --lockfile-only --no-frozen-lockfile
          python - <<'PY'
          import base64, json, os, urllib.request
          token=os.environ["GH_TOKEN"]; repo=os.environ["REPO"]; branch=os.environ["BRANCH"]
          path="apps/mobile/pnpm-lock.yaml"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"veldryn-expo57-lock-refresh"}
          with urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}",headers=headers)) as response:
              sha=json.load(response)["sha"]
          with open("pnpm-lock.yaml","rb") as fh:
              content=base64.b64encode(fh.read()).decode("ascii")
          payload=json.dumps({"message":"chore: refresh Expo 57 TypeScript lockfile","content":content,"sha":sha,"branch":branch}).encode()
          request=urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/{path}",data=payload,headers={**headers,"Content-Type":"application/json"},method="PUT")
          with urllib.request.urlopen(request) as response:
              print(json.load(response)["commit"]["sha"])
          PY
