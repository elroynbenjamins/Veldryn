name: Veldryn v1.0.9 final integration gate (branch only)

on:
  push:
    branches: [integration/v1-0-9-badges-pager-tier-memory-20261112]
    paths: ['.github/workflows/v109-final-integration-gate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref_name == 'integration/v1-0-9-badges-pager-tier-memory-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v1-0-9-badges-pager-tier-memory-20261112
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Typecheck all app and online backend
        run: |
          pnpm --dir apps/mobile typecheck:core
          pnpm --dir apps/mobile typecheck
          pnpm --dir backend typecheck:online
      - name: Verify gameplay and co-op Edge parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Verify real badge SQL in PGlite
        run: node tools/test-player-badge-tenure-db.mjs
      - name: Run entire registered mobile core suite
        run: node tools/run-mobile-core-tests.mjs
