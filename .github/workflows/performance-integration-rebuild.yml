name: Rebuild performance integration candidate (temporary)

on:
  push:
    branches: [perf/final-performance-integration-20261127]
    paths:
      - '.github/workflows/performance-integration-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/final-performance-integration-20261127
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Canonical Edge build and focused tests
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
          node backend/dist/online/backend/online/tests/release-gate.js
          node backend/dist/online/backend/online/tests/guild-shop-read.js
          node apps/mobile/tests/chat-online-player-roster.cjs
      - name: Generate three forward migrations with pinned CLI (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new --help
          cd backend
          for name in online_player_count_v1 reward_inbox_duplicate_scope_20261127 guild_shop_batch_snapshot_server_v1; do
            if compgen -G "supabase/migrations/*_${name}.sql" > /dev/null; then
              echo "Existing migration for $name; refusing overwrite"
              exit 1
            fi
            supabase migration new "$name"
            sleep 1
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('supabase')
          for name in ('online_player_count_v1', 'reward_inbox_duplicate_scope_20261127', 'guild_shop_batch_snapshot_server_v1'):
              draft = (root / 'drafts' / (name + '.sql')).read_text()
              match = re.search(r'^begin;\s*\n(.*)\n(?:rollback|commit);\s*$', draft, re.M | re.S | re.I)
              assert match, name
              files = list((root / 'migrations').glob('*_' + name + '.sql'))
              assert len(files) == 1, (name, files)
              files[0].write_text('-- Forward migration from rollback-only staging-verified performance review.\n' + match.group(1).strip() + '\n')
          PY
      - name: Commit only canonical output and generated migration files on review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "perf/final-performance-integration-20261127"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          git add backend/supabase/migrations/*_online_player_count_v1.sql backend/supabase/migrations/*_reward_inbox_duplicate_scope_20261127.sql backend/supabase/migrations/*_guild_shop_batch_snapshot_server_v1.sql
          git diff --cached --stat
          git commit -m 'build(edge): regenerate performance bundles and validated forward migrations'
          git push origin HEAD:refs/heads/perf/final-performance-integration-20261127
