name: Hidden Guild PvE V9 transaction-port QA

# Development-only: no Supabase credentials, schema migrations or deployment.
on:
  pull_request:
    paths:
      - 'backend/src/server/combat/guild-pve-transaction-v9.ts'
      - 'backend/src/server/combat/guild-pve-shared-v8.ts'
      - 'apps/mobile/tests/guild-pve-transaction-v9.ts'
      - 'apps/mobile/tsconfig.guild-pve-v9.json'
      - '.github/workflows/guild-pve-v9-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-port-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ../../backend install --frozen-lockfile
      - name: Typecheck V9 domain and fixture
        run: pnpm exec tsc -p tsconfig.guild-pve-v9.json --noEmit
      - name: Compile V9 fixture
        run: pnpm exec tsc -p tsconfig.guild-pve-v9.json --outDir .core-build
      - name: Run atomic rollback, retry and 21 campaign scenarios
        run: node .core-build/apps/mobile/tests/guild-pve-transaction-v9.js
