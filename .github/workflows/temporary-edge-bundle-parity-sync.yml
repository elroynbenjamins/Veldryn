# Temporary, review-only parity job; no deployment or production flags.
name: Temporary canonical Edge bundle parity rebuild
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-edge-bundle-parity-sync.yml'
permissions:
  contents: write
concurrency:
  group: veldryn-edge-bundle-parity-rebuild-20261118
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edge-bundle-parity-20261118
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend and shared mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Compile the authoritative backend and regenerate both bundles
        run: pnpm --dir backend build:online
      - name: Verify exact generated parity and untouched hidden feature fences
        run: |
          node tools/verify-gameplay-edge.mjs
          node tools/validate-hidden-feature-release-fences.mjs --self-test
          node backend/dist/online/backend/online/tests/coop-loadout.js
      - name: Commit generated artifacts to review branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Both Edge bundles already match the source.'
            exit 0
          fi
          git commit -m 'build(edge): sync gameplay and co-op bundles after shared source changes'
          git push origin HEAD:fix/edge-bundle-parity-20261118
