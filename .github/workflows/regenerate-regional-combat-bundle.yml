name: Regenerate regional combat gameplay bundle

on:
  push:
    branches:
      - feature/regional-combat-runtime-v1
    paths:
      - backend/online/**
      - backend/src/server/combat/regional-combat-runtime-v1.ts
      - backend/src/server/equipment/gems/regional-gem-settlement-v1.ts
      - tools/build-online.mjs
      - .github/workflows/regenerate-regional-combat-bundle.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regional-combat-runtime-v1
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Regenerate online bundles
        working-directory: backend
        run: pnpm build:online
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Generated bundles already current."
            exit 0
          fi
          git commit -m "Regenerate online Edge Function bundles for regional combat"
          git push origin HEAD:feature/regional-combat-runtime-v1
