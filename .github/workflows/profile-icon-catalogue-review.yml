name: Profile icon catalogue art review

on:
  pull_request:
    paths:
      - 'tools/review-profile-icon-catalogue.py'
      - '.github/workflows/profile-icon-catalogue-review.yml'
      - 'apps/mobile/src/theme/profile-icon-assets.ts'
      - 'apps/mobile/src/theme/profile-cosmetic-wave2-assets.ts'
      - 'apps/mobile/assets/profile-icons-v1/**'
      - 'apps/mobile/assets/profile-cosmetics-wave2/**'
      - 'apps/mobile/assets/ascendant/shared/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/review-profile-icon-catalogue.py --out /tmp/veldryn-profile-icon-review
      - uses: actions/upload-artifact@v4
        with:
          name: profile-icon-catalogue-review
          path: /tmp/veldryn-profile-icon-review
          if-no-files-found: error
          retention-days: 14
