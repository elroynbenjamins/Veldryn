name: Mobile core validation

# Cancel superseded PR checks; never cancel main, scheduled, or manual release checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/mobile-core-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/mobile-core-validation.yml'
  workflow_dispatch:

jobs:
  mobile-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate Expo SDK dependency compatibility
        run: pnpm exec expo install --check
      - name: Validate six transparent 64px cross-profession component icons
        run: pnpm test:cross-profession-art
      - name: Install backend dependencies used by reconciliation tests
        run: pnpm --dir ../../backend install --frozen-lockfile
      - name: Verify generated gameplay Edge bundle matches shared engine
        run: node ../../tools/verify-gameplay-edge.mjs
      # Compile backend TS projects once, preserve original node assertions.
      # A normal pnpm test:* still rebuilds independently for local use.
      - name: Backend release, Q-Mode, dungeon, gems and market regressions
        run: |
          node ../../tools/run-backend-test-batch.mjs \
            test:release-gate test:coop-composition test:qmode-merchant \
            test:live-pacing test:dungeon-tier-balance test:market-readiness \
            test:gems test:coop-rewards test:coop-live-social test:event-expedition-online
      - name: Validate Q-Mode offline settlement and reconnect idempotency
        run: node ../../backend/dist/online/backend/online/tests/qmode-runtime.js
      - name: Validate recent Supabase migration versions
        run: node ../../tools/validate-recent-migration-versions.mjs
      - name: Test chat retry receipts and read cursors in PostgreSQL
        run: node ../../tools/test-chat-reliability-db.mjs
      - name: Validate regional combat cadence migration
        run: node ../../tools/validate-regional-combat-cadence.mjs
      # test:core compiles tsconfig.core.json with typechecking before running checks.
      - name: Typecheck mobile app
        run: pnpm typecheck
      - name: Validate compact Inventory and Gear Option A interaction contracts
        run: node tests/compact-inventory-pouch-option-a.cjs
      - name: Validate chat unread opening and keyboard anchor
        run: node tests/chat-keyboard-anchor.cjs
      - name: Verify native Google nonce generation, identity binding, and account safety
        run: pnpm test:google-native-auth
      - name: Validate Google Play billing
        run: |
          node ../../tools/test-play-billing.mjs
          node ../../tools/test-play-billing-transport.mjs
      - name: Validate Android performance reports and staging load safety
        run: |
          node ../../tools/test-android-perf-report.mjs
          node ../../tools/test-staging-gameplay-profile.mjs
      - name: Run core tests
        run: pnpm test:core
      - name: Validate Frostfall event teaser gating and read-only safety
        run: pnpm test:frostfall-preview
      - name: Run onboarding lock tests
        run: pnpm test:onboarding-locks
      - name: Run co-op LFG TTL validation
        run: node .core-build/apps/mobile/tests/coop-live-recruitment.js
      - name: Run collectible tests
        run: pnpm test:collectibles
      - name: Run companion validation
        run: pnpm test:companions
      - name: Run online gameplay regression on freshly compiled backend
        run: node ../../backend/dist/online/backend/online/tests/gameplay.js
      - name: Profile synthetic multi-account contention and account isolation
        run: node ../../backend/dist/online/backend/online/tests/gameplay-load.js
