name: Regenerate current gameplay bundle
on:
  push:
    branches: [chore/regenerate-current-gameplay-bundle]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone current branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch chore/regenerate-current-gameplay-bundle "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install backend dependencies
        working-directory: repo
        run: pnpm --dir backend install --frozen-lockfile
      - name: Generate online bundles
        working-directory: repo
        run: node tools/build-online.mjs
      - name: Verify generated Admin QA path
        working-directory: repo
        run: |
          grep -q "qa_prepare" backend/supabase/functions/gameplay/index.ts
          grep -q "admin_qa_required" backend/supabase/functions/gameplay/index.ts
      - name: Commit generated bundles
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate online Edge Function bundles"
            git push origin HEAD:chore/regenerate-current-gameplay-bundle
          fi
