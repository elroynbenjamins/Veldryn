name: Equipment + Combat 2.0 expanded-set integration (private)
on:
  pull_request:
    paths:
      - 'backend/src/server/combat/v2/equipment-forge-set-identity-review.ts'
      - 'backend/src/server/combat/v2/equipment-forge-set-effect-authoring-review.ts'
      - 'backend/src/server/combat/v2/equipment-online-readback-review.ts'
      - 'backend/src/server/combat/v2/equipment-online-cas-recheck.ts'
      - 'backend/src/server/combat/v2/equipment-forge-set-worn-readiness.ts'
      - 'backend/src/server/combat/v2/__tests__/equipment-forge-set-effect-authoring-review.ts'
      - 'backend/src/server/combat/v2/__tests__/equipment-forge-set-identity-review.ts'
      - 'backend/src/server/combat/v2/__tests__/equipment-frozen-forge-mechanics.ts'
      - 'backend/src/server/combat/types.ts'
      - 'backend/src/server/combat/engine.ts'
      - 'backend/src/server/combat/v2/equipment-affixes.ts'
      - 'backend/src/server/combat/v2/ability-counterplay-strategies.ts'
      - 'backend/src/server/combat/v2/equipment-frozen-forge-handoff-audit.ts'
      - 'backend/src/server/combat/v2/equipment-frozen-forge-bridge.ts'
      - 'backend/src/server/combat/v2/__tests__/equipment-frozen-forge-bridge.ts'
      - 'backend/src/server/combat/v2/equipment-expanded-launch-registry.ts'
      - 'backend/src/server/combat/v2/equipment-expanded-member-source-audit.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-material-source-review.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-stackable-material-boundary-review.ts'
      - 'tools/test-eq2-stackable-material-boundary-v5.mjs'
      - 'backend/src/server/equipment/equipment-crafting-v2-material-origins-v6-review.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-atomic-handoff-v7-review.ts'
      - 'tools/test-eq2-material-origin-atomic-v6-v7.mjs'
      - 'backend/src/server/equipment/equipment-crafting-v2-unified-reservation-review.ts'
      - 'tools/test-eq2-material-source-and-reservation-v4.mjs'
      - 'docs/equipment-2-0/t1-t4-48-set-unified-recipe-review-v2.json'
      - 'docs/equipment-2-0/T1_T4_48_SET_CRAFTING_RECONCILIATION_V2.md'
      - 'tools/test-eq2-48-set-crafting-review-v2.mjs'
      - 'tools/test-eq2-48-set-source-reconciliation-v3.mjs'
      - 'docs/equipment-2-0/eq2-expanded-48-set-member-authoring-v1.json'
      - 'docs/equipment-2-0/t1-t4-48-set-unified-recipe-review-v3.json'
      - 'docs/equipment-2-0/T1_T4_48_SET_SOURCES_AND_SCARCITY_V3.md'
      - 'backend/src/server/combat/v2/__tests__/equipment-expanded-member-source-audit.ts'
      - 'backend/src/server/combat/v2/equipment-expanded-set-synergy-review.ts'
      - 'tools/test-equipment-combat-v2-expanded-synergy.mjs'
      - 'docs/equipment-2-0/eq2-combat-affix-trait-proposal-v1.json'
      - 'backend/src/server/combat/v2/__tests__/equipment-expanded-launch-registry.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-manifest.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-expansion-manifest.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-armament-manifest.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-weapon-families.ts'
      - 'backend/src/server/combat/v2/set-catalog.ts'
      - 'backend/tsconfig.equipment-combat-v2-launch.json'
      - '.github/workflows/equipment-combat-v2-expanded-sets-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install frozen backend deps
        run: pnpm --dir backend install --frozen-lockfile
      - name: Compile real Forge and Combat 2.0 manifest imports, strict TypeScript
        run: pnpm --dir backend exec tsc -p tsconfig.equipment-combat-v2-launch.json
      - name: Review 15 original Forge set tactical identities without granting unapproved bonuses
        run: node backend/dist-equipment-combat-v2-launch/server/combat/v2/__tests__/equipment-forge-set-effect-authoring-review.js
      - name: Verify source-only 15 original Forge set identities versus 48 unreleased set concepts
        run: node backend/dist-equipment-combat-v2-launch/server/combat/v2/__tests__/equipment-forge-set-identity-review.js
      - name: Prove original Forge Tenacity, direct ability damage and class-healing rolls hit only their intended engine events
        run: node backend/dist-equipment-combat-v2-launch/server/combat/v2/__tests__/equipment-frozen-forge-mechanics.js
      - name: Rehearse 324 authored skill selections with REAL frozen Forge copies plus 4-player party source replay
        run: node backend/dist-equipment-combat-v2-launch/server/combat/v2/__tests__/equipment-frozen-forge-bridge.js
      - name: Validate 48 launch set concepts, 204 item identities and 108 source-tagged bonus ideas
        run: node backend/dist-equipment-combat-v2-launch/server/combat/v2/__tests__/equipment-expanded-launch-registry.js
      - name: Enforce exact source-gapped 204 member plan and no legacy set hijacking
        run: node backend/dist-equipment-combat-v2-launch/server/combat/v2/__tests__/equipment-expanded-member-source-audit.js
      - name: Verify every one of 17 proposed affixes and 27 combat traits maps to safe set-family boss scenarios
        run: |
          node tools/test-equipment-combat-v2-expanded-synergy.mjs
          node tools/validate-eq2-affix-traits-review.mjs
      - name: Validate 746 nonissuable Crafting 2.0 recipe previews and profession-only gates
        run: node tools/test-eq2-48-set-crafting-review-v2.mjs
      - name: Verify 130 authored templates, 74 protected source links and 746 material-corrected routes
        run: node tools/test-eq2-48-set-source-reconciliation-v3.mjs
      - name: Verify 14 unregistered sources and 746 fail-closed CAS reservation previews
        run: node tools/test-eq2-material-source-and-reservation-v4.mjs
      - name: Verify exact unregistered EQ2 material identities against all 746 crafting paths
        run: node tools/test-eq2-stackable-material-boundary-v5.mjs
      - name: Verify V6 source processing and V7 atomic craft preflight hold
        run: node tools/test-eq2-material-origin-atomic-v6-v7.mjs
      - name: Forbid staging-only set authorizer in public entrypoints
        run: |
          if grep -R -E 'PLANNED_T1_T4_SETS_V2|PLANNED_T1_T4_MEMBERS_V2|auditUnifiedSetLaunchV2|EXPANDED_SET_FAMILY_SYNERGIES_V2|auditRealExpandedSetSourceGapsV2|reviewExpandedSetSourceCoverageV2|EQ2_REVIEW_MATERIAL_IDENTITIES|reviewEq2MaterialStack|reviewEq2PendingStackBalances|EQ2_V6_DRAFT_PROCESSES|reviewEq2V6MaterialOrigin|previewEq2V7AtomicCraftHandoff|auditEq2V7ReviewLots|compileRealFrozenForgeActorV2|simulateRealFrozenForgeCombatV2|auditRealForgeSetIdentityV2|reviewWornForgeSetSourcesV2|reviewForgeSetEffectAuthoringV2|inspectOnlineGameStateForgeCombatV2|reviewWornRealForgeSetsV2|prepareForgeCombatRevisionPreflightV2|recheckForgeCombatPartyRevisionsV2|inspectFrozenForgeCombatHandoffV2|selectReviewSkillLoadoutV2' backend/online apps/mobile/src backend/supabase/functions --include='*.ts' --include='*.tsx'; then
            echo 'Unissued 2.0 set draft leaked into live routes'; exit 1
          fi
