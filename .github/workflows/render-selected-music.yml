name: Render selected Veldryn music

on:
  push:
    branches: [feature/selected-v11-game-music-20261120]
    paths:
      - 'tools/audio/render-selected-music.py'
      - 'tools/audio/selected-music-scores.zip'
      - '.github/workflows/render-selected-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthesis tooling
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 pretty_midi==0.2.11
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Re-render original scores without third-party samples
        run: python tools/audio/render-selected-music.py
      - name: Verify packaged music and selection manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('apps/mobile/assets/audio')
          rows=json.loads((base/'manifest.json').read_text())['music']
          expected={'town','asterfall','sunscar','frostmarch','dungeon','boss','world_boss'}
          assert set(rows)==expected, (set(rows),expected)
          files=[base/'music'/f'{k}.mp3' for k in sorted(expected)]
          assert all(f.is_file() and 50_000<f.stat().st_size<700_000 for f in files)
          assert sum(f.stat().st_size for f in files)<4_000_000
          assert all(rows[k].get('render')=='original sample-free synthesis' for k in expected)
          print('Verified seven selected themes:',sum(f.stat().st_size for f in files),'bytes')
          PY
      - name: Commit approved replacement tracks to source branch
        run: |
          if ! git diff --quiet -- apps/mobile/assets/audio/music apps/mobile/assets/audio/manifest.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/mobile/assets/audio/music apps/mobile/assets/audio/manifest.json
            git commit -m 'audio: package selected seven sample-free music tracks'
            git push origin HEAD:feature/selected-v11-game-music-20261120
          fi
