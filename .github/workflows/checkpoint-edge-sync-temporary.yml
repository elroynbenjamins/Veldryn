name: Checkpoint co-op bundle build (temporary)
# Retry after strict checkpoint tampering assertion and legacy fixture guard fixes.
on:
  push:
    branches:
      - feat/endurance-boss-camp-boon-choice-v2-20261121
    paths:
      - .github/workflows/checkpoint-edge-sync-temporary.yml
permissions:
  contents: write
jobs:
  checkpoint-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked packages
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build and verify co-op Edge bundle from exact checkpoint branch
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Check server contracts and checkpoint route tests
        run: |
          pnpm --dir backend typecheck:online
          pnpm --dir backend build
          pnpm --dir backend coop-phase4
          pnpm --dir backend coop-phase5
      - name: Commit only generated Edge bundles to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/coop/index.ts backend/supabase/functions/gameplay/index.ts
          if git diff --cached --quiet; then
            echo 'No bundle changes.'
            exit 0
          fi
          git commit -m 'build(edge): sync checkpoint co-op bundle for release'
          git push origin HEAD:feat/endurance-boss-camp-boon-choice-v2-20261121
