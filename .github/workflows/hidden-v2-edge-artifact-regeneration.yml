# TEMPORARY one-shot repair workflow. Restricted to this private draft branch.
# No release/deployment. Delete after generated artifacts have been committed.
name: Hidden Combat 2.0 - regenerate isolated Edge artifacts
on:
  push:
    branches:
      - feature/combat-v2-dungeon-rewards-and-combat-qa-20261121
    paths:
      - '.github/workflows/hidden-v2-edge-artifact-regeneration.yml'
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/hidden-v2-edge-artifact-regeneration.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/combat-v2-dungeon-rewards-and-combat-qa-20261121') ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 1569 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feature/combat-v2-dungeon-rewards-and-combat-qa-20261121')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/combat-v2-dungeon-rewards-and-combat-qa-20261121
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Compile private backend before generating artifacts
        run: pnpm --dir backend build
      - name: Build both legacy Edge functions using fail-closed Combat 2.0 isolation
        run: node tools/build-online.mjs
      - name: Verify generated artifacts exactly match isolated Edge engine
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit ONLY generated Edge files to private branch
        shell: bash
        run: |
          set -euo pipefail
          if test "${GITHUB_EVENT_NAME}" = "pull_request"; then
            test "${{ github.event.pull_request.number }}" = "1569"
            test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
            test "${{ github.event.pull_request.head.ref }}" = "feature/combat-v2-dungeon-rewards-and-combat-qa-20261121"
          else
            test "${GITHUB_REF}" = "refs/heads/feature/combat-v2-dungeon-rewards-and-combat-qa-20261121"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Both isolated Edge artifacts were already reproducible and current."
          else
            git commit -m "build(hidden 2.0): regenerate isolated Edge gameplay and co-op artifacts"
            git push origin HEAD:feature/combat-v2-dungeon-rewards-and-combat-qa-20261121
          fi
