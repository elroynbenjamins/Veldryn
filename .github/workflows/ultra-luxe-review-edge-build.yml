name: Review-only Ultra Luxe Edge regeneration
# Temporary read-only build for PR 1834; remove before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/ultra-luxe-review-edge-build.yml'
      - 'backend/online/gameplay.ts'
      - 'apps/mobile/src/core/ultra-luxe-grants.ts'
permissions:
  contents: read
jobs:
  regenerate:
    if: github.event.pull_request.number == 1834 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/ultra-luxe-four-set-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild with repository canonical tool
        run: pnpm --dir backend build:online
      - name: Verify rebuilt bundles
        run: node tools/verify-gameplay-edge.mjs
      - name: Emit generated-only patch and exact digests for review
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['backend/supabase/functions/gameplay/index.ts','backend/supabase/functions/coop/index.ts'];
          const sha=buf=>createHash('sha256').update(buf).digest('hex');
          const patch=execFileSync('git',['diff','--no-ext-diff','--no-color','--unified=3','--',...paths],{maxBuffer:8*1024*1024});
          const encoded=Buffer.from(JSON.stringify({head:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),patch:patch.toString('utf8'),files:paths.map(path=>({path,sha256:sha(readFileSync(path))}))}),'utf8').toString('base64');
          for(let i=0;i<encoded.length;i+=3000)console.log('ULTRA_LUXE_BUNDLE_PATCH_'+String(i/3000).padStart(5,'0')+'='+encoded.slice(i,i+3000));
          NODE
