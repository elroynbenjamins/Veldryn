name: Refresh dungeon Edge bundles (temporary)
on:
  push:
    branches:
      - feat/dungeon-boon-choices-fast-projection-20261107
    paths:
      - 'backend/**'
      - 'tools/build-online.mjs'
      - '.github/workflows/refresh-dungeon-edge-temporary.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-dungeon-edge-bundles
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend toolchain
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Rebuild both canonical Edge bundles
        run: node tools/build-online.mjs
      - name: Validate parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles to this feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate dungeon gameplay and co-op Edge bundles"
            git push origin HEAD:feat/dungeon-boon-choices-fast-projection-20261107
          fi
