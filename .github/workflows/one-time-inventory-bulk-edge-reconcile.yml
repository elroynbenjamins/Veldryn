# TEMPORARY PR-only canonical bundle reconciliation; remove before merging.
name: One-time inventory bulk Edge bundle reconciliation
on:
  push:
    branches: ['integration/1-0-11-inventory-bulk-protection-reconciled-20261122']
    paths:
      - '.github/workflows/one-time-inventory-bulk-edge-reconcile.yml'
permissions:
  contents: write
concurrency:
  group: one-time-inventory-bulk-edge
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/1-0-11-inventory-bulk-protection-reconciled-20261122
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install frozen backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Generate and verify canonical bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit artifacts on PR branch only
        shell: bash
        run: |
          set -euo pipefail
          branch=integration/1-0-11-inventory-bulk-protection-reconciled-20261122
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated Edge bundles already match.'
            exit 0
          fi
          git commit -m 'build(edge): reconcile inventory bulk authority and gem balance on release branch'
          git fetch origin "$branch"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse "origin/$branch")"
          git push origin "HEAD:$branch"
