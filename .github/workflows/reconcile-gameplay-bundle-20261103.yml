name: Reconcile shared gameplay Edge bundle (temporary)
on:
  push:
    branches:
      - consolidate/account-collections-20261103
      - consolidate/combat-balance-20261103
    paths:
      - 'apps/mobile/src/core/**'
      - 'backend/online/**'
      - '.github/workflows/reconcile-gameplay-bundle-20261103.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reconcile-gameplay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install pinned backend and shared engine dependencies
        run: |
          printf '\npackages:\n  - "."\n' >> backend/pnpm-workspace.yaml
          pnpm --dir backend install --frozen-lockfile
          printf '\npackages:\n  - "."\n' >> apps/mobile/pnpm-workspace.yaml
          pnpm --dir apps/mobile install --frozen-lockfile --ignore-scripts
      - name: Regenerate committed gameplay and co-op Edge bundles
        run: pnpm --dir backend build:online
      - name: Verify source/generated gameplay parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated entrypoints on same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Generated bundles already match source."
          else
            git commit -m "build: synchronize generated gameplay and co-op Edge bundles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
