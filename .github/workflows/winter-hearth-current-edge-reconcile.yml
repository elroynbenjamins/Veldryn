name: Winter Hearth current Edge reconciliation
# Exact-head rebuild trigger after current-main reconciliation.
on:
  push:
    branches: ['feat/frostfall-winter-hearth-reconcile-20261125']
    paths:
      - '.github/workflows/winter-hearth-current-edge-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: winter-hearth-current-edge-reconcile
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.ref == 'refs/heads/feat/frostfall-winter-hearth-reconcile-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild and verify canonical bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated bundles to candidate only
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/frostfall-winter-hearth-reconcile-20261125'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          test -z "$unexpected"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(edge): synchronize Winter Hearth runtime'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
