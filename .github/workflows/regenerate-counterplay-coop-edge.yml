name: Temporary regenerate companion-counterplay co-op Edge bundle

on:
  push:
    branches:
      - codex/dungeon-companion-counterplay-20261110
    paths:
      - .github/workflows/regenerate-counterplay-coop-edge.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dungeon-companion-counterplay-20261110
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Regenerate bundles from canonical shared backend
        run: node tools/build-online.mjs
      - name: Commit generated co-op artifact only
        run: |
          git add backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(coop): regenerate Edge bundle for dungeon companion counterplay"
            git push origin HEAD:codex/dungeon-companion-counterplay-20261110
          fi
