name: Temporary Edge parity rebuild on CI repair PR

on:
  pull_request:
    paths:
      - '.github/workflows/nov18-edge-parity-pr-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nov18-ci-baseline-tool-odds-roadmap
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install frozen backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Prove restored source balance tests
        run: node tools/run-mobile-tests.mjs equipment-two-path-balance exploration-balance equipment-salvage-recovery gathering-tools monster-drop-balance
      - name: Build and verify canonical gameplay and co-op bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated artifacts exclusively to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'No generated parity changes required.'
            exit 0
          fi
          git commit -m 'build(edge): resync generated gameplay and co-op bundles after dungeon and tool changes'
          git push origin HEAD:fix/nov18-ci-baseline-tool-odds-roadmap
