name: PR 880 temporary online bundle synchronization

on:
  push:
    branches:
      - feature/ch1-weekly-boss-and-early-tier-sources
    paths:
      - .github/workflows/pr-880-online-bundle-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ch1-weekly-boss-and-early-tier-sources
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend build dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Install mobile dependencies imported by the shared runtime
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Build both shared-engine Edge bundles
        run: pnpm --dir backend build:online
      - name: Verify bundle parity
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit updated bundles to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate gameplay and co-op Edge bundles for T3 ingredient sources"
            git push origin HEAD:feature/ch1-weekly-boss-and-early-tier-sources
          fi
