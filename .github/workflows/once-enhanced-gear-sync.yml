name: One-time enhanced equipment gameplay bundle sync
on:
  push:
    branches:
      - fix/auto-lock-enhanced-gear-and-allow-manual-sale
    paths:
      - '.github/workflows/once-enhanced-gear-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-lock-enhanced-gear-and-allow-manual-sale
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated gameplay bundle
        run: |
          if ! git diff --quiet -- backend/supabase/functions/gameplay/index.ts; then
            git config user.name "veldryn-ci"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/supabase/functions/gameplay/index.ts
            git commit -m "build(gameplay): sync enhanced equipment Edge bundle"
            git push origin HEAD:refs/heads/fix/auto-lock-enhanced-gear-and-allow-manual-sale
          fi
