// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url = uri('https://www.jitpack.io') }
  }
}

// expo-iap references its own BuildConfig, but AGP 8 (Expo SDK 58) no longer
// generates BuildConfig for library modules by default and the module does not
// enable the feature itself. Force it on for that subproject so its Kotlin
// compiles (":expo-iap:compileReleaseKotlin" -> Unresolved reference 'BuildConfig').
subprojects { subproject ->
  if (subproject.name == 'expo-iap') {
    afterEvaluate {
      if (subproject.extensions.findByName('android') != null) {
        subproject.android {
          buildFeatures {
            buildConfig true
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
