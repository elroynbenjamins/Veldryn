name: Reconcile vendor resale candidate Edge bundles

on:
  push:
    branches: ['feature/equipment-vendor-gold-preview-20261115']
    paths: ['.github/workflows/reconcile-resale-edge-candidate.yml']

permissions:
  contents: write

concurrency:
  group: reconcile-vendor-resale-edge-candidate
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/equipment-vendor-gold-preview-20261115
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Generate canonical shared gameplay and co-op bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Enforce only generated files changed
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked file differences:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit generated sources to this development branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Canonical Edge bundles are already in sync.'
            exit 0
          fi
          git commit -m 'build(edge): sync gated vendor resale candidate bundles'
          git push origin HEAD:feature/equipment-vendor-gold-preview-20261115
