name: Dungeon mechanics validation

on:
  pull_request:
    paths:
      - 'backend/online/live-runtime.ts'
      - 'backend/online/tests/dungeon-variety.ts'
      - 'backend/src/server/expeditions/**'
      - 'backend/src/server/combat/**'
      - 'backend/src/server/coop/**'
      - 'backend/package.json'
      - 'apps/mobile/src/core/coop-qmode.ts'
      - 'apps/mobile/src/core/coop-presentation.ts'
      - 'apps/mobile/src/components/coop/**'
      - 'apps/mobile/src/i18n/dungeon-room-modifiers.ts'
      - '.github/workflows/dungeon-mechanics-validation.yml'
  push:
    branches: [main]
    paths:
      - 'backend/online/live-runtime.ts'
      - 'backend/online/tests/dungeon-variety.ts'
      - 'backend/src/server/expeditions/**'
      - 'backend/src/server/combat/**'
      - 'backend/src/server/coop/**'
      - '.github/workflows/dungeon-mechanics-validation.yml'
  workflow_dispatch:

jobs:
  dungeon-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Install mobile workspace types used by shared backend snapshots
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
      - name: Validate real encounters, room rewards, modifiers, and Live vote authority
        run: pnpm test:dungeon-variety
        working-directory: backend
      - name: Validate new dungeon unlocks, three tiers and authored drops
        run: pnpm test:coop-live-social
        working-directory: backend
