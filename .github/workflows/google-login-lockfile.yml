name: Refresh Google login lockfile

on:
  push:
    branches:
      - feature/google-play-login

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/google-play-login
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only
      - name: Commit refreshed lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Google login lockfile"
          git push origin HEAD:feature/google-play-login
