name: Temporary gameplay bundle build
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-gameplay-bundle-build.yml'
      - 'apps/mobile/src/core/feature-unlocks.ts'
      - 'backend/online/**'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend
        run: pnpm --dir backend install --frozen-lockfile
      - name: Install shared mobile types
        run: pnpm --dir apps/mobile install --frozen-lockfile --ignore-scripts
      - name: Build online functions from current source
        run: pnpm --dir backend build:online
      - name: Verify event gate and bundle integrity
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('backend/supabase/functions/gameplay/index.ts','utf8');
          const gate=/function earlyFeatureUnlocked\(state, id\)\s*\{\s*if \(id === "events"\) return true;/;
          if(!gate.test(s)||!s.includes('Deno.serve(')||s.length<2_000_000)throw Error('Gameplay bundle failed integrity checks');
          console.log('PASS: freshly generated backend bundle includes level-one Events access');
          NODE
      - name: Commit freshly generated gameplay bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate online Edge bundles from tested source'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
