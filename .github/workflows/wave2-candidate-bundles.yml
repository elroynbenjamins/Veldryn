name: Wave 2 release candidate bundle generation (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/wave2-candidate-bundles.yml'
      - 'apps/mobile/src/core/profile-cosmetic-wave2.ts'
      - 'apps/mobile/tests/profile-cosmetic-store.ts'
      - 'apps/mobile/tests/profile-cosmetic-commerce-grants.ts'
permissions:
  contents: write
concurrency:
  group: wave2-candidate-bundles
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'elroynbenjamins/Veldryn' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/wave2-ordinary-release-candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wave2-ordinary-release-candidate
          fetch-depth: 0
      - name: Reconcile current main without overriding conflicts
        run: |
          git config user.name 'Veldryn candidate bundle generation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Regenerate and verify canonical bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Verify mobile types and core tests
        run: |
          pnpm --dir apps/mobile typecheck
          pnpm --dir apps/mobile test:core
      - name: Commit only canonical generated artifacts to candidate branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'chatgpt/wave2-ordinary-release-candidate'
          git diff --check
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if ! git diff --cached --quiet; then
            git config user.name 'Veldryn candidate bundle generation'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "Regenerate shared Edge bundles for Wave 2 release candidate"
          fi
          # Core tests and EAS post-install may create disposable outputs. Never stage them.
          git restore -- apps/mobile/assets/events/frostfall/currency_aurora_chime.png apps/mobile/assets/events/frostfall/currency_frostbell_token.png
          git status --short
          git diff --exit-code
          git diff --cached --exit-code
          # Only the two explicitly staged canonical files may be committed.
          git diff-tree --no-commit-id --name-only -r HEAD
          git push --dry-run origin HEAD:refs/heads/chatgpt/wave2-ordinary-release-candidate
          git push origin HEAD:refs/heads/chatgpt/wave2-ordinary-release-candidate
