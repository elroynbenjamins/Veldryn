name: Temporary dungeon preview branch Edge regeneration

on:
  push:
    branches: ['feature/dungeon-instant-combat-preview-20261119']
    paths:
      - '.github/workflows/dungeon-preview-edge-sync-branch.yml'

permissions:
  contents: write

concurrency:
  group: dungeon-preview-edge-sync-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dungeon-instant-combat-preview-20261119
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend and mobile workspace dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild canonical Edge artifacts
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Push only generated Edge artifacts to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated Edge artifacts already synchronized'
            exit 0
          fi
          git commit -m 'build(edge): regenerate co-op combat preview projection'
          git push origin HEAD:feature/dungeon-instant-combat-preview-20261119
