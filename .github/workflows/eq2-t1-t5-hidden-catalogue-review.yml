name: Equipment 2.0 T1-T5 Hidden Catalogue Review

on:
  push:
    branches:
      - 'review/eq2-t1-t5-canonical-catalog-hidden-gate-20261124'
    paths:
      - 'docs/2-0/eq2-t1-t5-unified-hidden-review-catalogue-v1.json'
      - 'docs/2-0/eq2-t1-t5-canonical-membership-reconciliation-v2.json'
      - 'docs/2-0/eq2-t4-replacement-recipe-review-v2.json'
      - 'docs/2-0/eq2-universal-affix-cap-review-v3.json'
      - 'docs/2-0/eq2-universal-affix-overlap-review-v4.json'
      - 'docs/2-0/eq2-equipment-power-review-v5.json'
      - 'docs/2-0/eq2-innate-and-set-budget-review-v7.json'
      - 'docs/2-0/eq2-consolidated-review-index-v8.json'
      - 'docs/2-0/eq2-t5-material-production-review-v11.json'
      - 'docs/2-0/eq2-unified-economy-policy-v12.json'
      - 'docs/2-0/eq2-consolidated-review-index-v14.json'
      - 'docs/2-0/eq2-profile-extension-review-v16.json'
      - 'docs/2-0/eq2-set-trait-authoring-review-v17.json'
      - 'docs/2-0/eq2-normalized-effects-review-v18.json'
      - 'docs/equipment-2-0/**'
      - 'docs/2-0/EQUIPMENT_2_0_CANONICAL_APPROVAL_RECORD_20261124.md'
      - 'tools/eq2-review/t1-t5/**'
      - 'backend/src/server/equipment/equipment-crafting-v2-gate.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-manifest.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-armament-manifest.ts'
      - 'backend/src/server/equipment/equipment-crafting-v2-expansion-manifest.ts'
      - '.github/workflows/eq2-t1-t5-hidden-catalogue-review.yml'
  pull_request:
    paths:
      - 'docs/2-0/eq2-t1-t5-unified-hidden-review-catalogue-v1.json'
      - 'docs/2-0/eq2-t1-t5-canonical-membership-reconciliation-v2.json'
      - 'docs/2-0/eq2-t4-replacement-recipe-review-v2.json'
      - 'docs/2-0/eq2-universal-affix-cap-review-v3.json'
      - 'docs/2-0/eq2-universal-affix-overlap-review-v4.json'
      - 'docs/2-0/eq2-equipment-power-review-v5.json'
      - 'docs/2-0/eq2-innate-and-set-budget-review-v7.json'
      - 'docs/2-0/eq2-consolidated-review-index-v8.json'
      - 'docs/2-0/eq2-t5-material-production-review-v11.json'
      - 'docs/2-0/eq2-unified-economy-policy-v12.json'
      - 'docs/2-0/eq2-consolidated-review-index-v14.json'
      - 'docs/2-0/eq2-profile-extension-review-v16.json'
      - 'docs/2-0/eq2-set-trait-authoring-review-v17.json'
      - 'docs/2-0/eq2-normalized-effects-review-v18.json'
      - 'docs/equipment-2-0/**'
      - 'tools/eq2-review/t1-t5/**'
      - 'backend/src/server/equipment/equipment-crafting-v2-gate.ts'
      - '.github/workflows/eq2-t1-t5-hidden-catalogue-review.yml'

permissions:
  contents: read

jobs:
  source-reconciliation:
    name: All T1-T5 sources, duplicate proofs, 2.0 no-release gates
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout review branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24 for review-only JSON integrity tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit 554 exact item IDs, 95 sets and fail-closed visibility
        run: node --test tools/eq2-review/t1-t5/*.test.mjs
      - name: Refuse public-app or online-server imports of hidden source registry
        run: |
          if git grep -n -E 'eq2-t1-t5-(unified-hidden-review-catalogue-v1|canonical-membership-reconciliation-v2)\.json|eq2-t4-replacement-recipe-review-v2\.json|eq2-universal-affix-cap-review-v3\.json|universal-affix-cap-review-v3\.mjs|eq2-universal-affix-overlap-review-v4\.json|universal-affix-overlap-review-v4\.mjs|eq2-equipment-power-review-v5\.json|equipment-power-review-v5\.mjs|set-combination-review-v5\.mjs|hand-budget-review-v6\.mjs|eq2-innate-and-set-budget-review-v7\.json|eq2-consolidated-review-index-v8\.json|hand-economy-review-v8\.mjs|component-economy-review-v9\.mjs|economy-simulation-review-v10\.mjs|economy-production-review-v11\.mjs|eq2-t5-material-production-review-v11\.json|unified-economy-review-v12\.mjs|eq2-unified-economy-policy-v12\.json|economy-balance-review-v13\.mjs|consolidated-economy-review-v14\.mjs|eq2-consolidated-review-index-v14\.json|equipment-power-contract-review-v15\.mjs|profile-premium-review-v16\.mjs|eq2-profile-extension-review-v16\.json|set-trait-cp-review-v17\.mjs|eq2-set-trait-authoring-review-v17\.json|normalized-effect-review-v18\.mjs|effect-trace-review-v18\.mjs|eq2-normalized-effects-review-v18\.json|effect-compiler-review-v19\.mjs|permanent-sensitivity-review-v19\.mjs|multislot-sensitivity-review-v21\.mjs|current-hit-review-v22\.mjs' -- apps/mobile/src backend/src; then
            echo 'Hidden Equipment 2.0 registry leaked into player-facing source' >&2
            exit 1
          fi
      - name: Prohibit enabled equipment server gate
        run: |
          grep -Eq 'export const EQUIPMENT_CRAFTING_V2_SERVER_RELEASED=false;' backend/src/server/equipment/equipment-crafting-v2-gate.ts
          ! grep -Eq '"releaseActivation": true|"mayMint": true|"mayEquip": true|"mayTrade": true|"mayCraft": true|"mayDrop": true|"mayRenderInLiveUI": true' docs/2-0/eq2-t1-t5-unified-hidden-review-catalogue-v1.json
