name: Rebuild gem merge Edge bundles (PR only)
on:
  push:
    branches:
      - feat/gem-combine-success-rates-20261115
    paths:
      - '.github/workflows/rebuild-gem-merge-pr.yml'

permissions:
  contents: write

concurrency:
  group: gem-merge-edge-pr-only
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gem-combine-success-rates-20261115
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Generate canonical Edge bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated bundles to the PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Both generated bundles are already current.'
            exit 0
          fi
          git commit -m 'build(edge): synchronize generated gem merge runtime bundles'
          git push origin HEAD:feat/gem-combine-success-rates-20261115
