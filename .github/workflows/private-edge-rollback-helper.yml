name: Private rollback capture helper tests
on:
  pull_request:
    paths:
      - 'tools/capture-production-edge-rollback.py'
      - 'tools/test-capture-production-edge-rollback.py'
      - '.github/workflows/private-edge-rollback-helper.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/test-capture-production-edge-rollback.py
