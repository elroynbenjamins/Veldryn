name: Billing lockfile helper

on:
  push:
    branches:
      - feat/google-play-billing-pipeline
    paths:
      - '.github/workflows/billing-lockfile-helper.yml'

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print npm registry integrity
        run: pnpm view expo-iap@5.6.3 dist.integrity
      - name: Regenerate lockfile metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile --fix-lockfile
      - name: Print expo-iap lock entries
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('pnpm-lock.yaml','utf8');
          for (const needle of ['      expo-iap:','  expo-iap@5.6.3:','  expo-iap@5.6.3(expo@']) {
            const i=s.indexOf(needle);
            console.log('\n--- '+needle+' ---');
            console.log(i<0?'NOT FOUND':s.slice(i,i+2200));
          }
          NODE
