name: Chat dock candidate Edge reconciliation
on:
  push:
    branches: ['fix/chat-dock-lines-preference']
    paths: ['.github/workflows/chat-dock-edge-reconcile.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir backend build:online
      - run: node tools/verify-gameplay-edge.mjs
      - run: pnpm --dir backend test:online
      - name: Commit only canonical Edge bundles to the candidate branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/fix/chat-dock-lines-preference'
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          test -z "$unexpected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(edge): reconcile chat dock preference bundle'
          git push origin HEAD:refs/heads/fix/chat-dock-lines-preference
