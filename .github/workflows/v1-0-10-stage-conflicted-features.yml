name: Stage remaining v1.0.10 feature merges in isolation

on:
  push:
    branches: ['release/1.0.10-merge-resolution-20261115']
    paths: ['.github/workflows/v1-0-10-stage-conflicted-features.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v110-conflict-stage
  cancel-in-progress: false

jobs:
  stage-merges:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.10-merge-resolution-20261115
          fetch-depth: 0
      - name: Squash stage remaining release features, retaining both parties outside overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for branch in feat/gem-combine-success-rates-20261115 feat/system-exceptional-forge-notices-20261115 ui/dungeon-command-event-first-nov14; do
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            echo "::group::Squash-stage $branch, default to current branch for overlapping lines"
            git merge --squash -X ours "origin/$branch"
            # Keep release workflow stable: changes here only stage product features.
            if git ls-files --error-unmatch .github/workflows/rebuild-gem-merge-pr.yml >/dev/null 2>&1; then
              git rm -f .github/workflows/rebuild-gem-merge-pr.yml
            fi
            git restore --source=HEAD --staged --worktree .github/workflows/rebuild-shared-gameplay-bundles.yml
            git diff --cached --stat
            git commit -m "release(v1.0.10): squash-stage $branch pending full regression"
            echo "::endgroup::"
          done
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const file='tools/mobile-core-tests.json';
          const current=JSON.parse(fs.readFileSync(file,'utf8'));
          const incoming=JSON.parse(cp.execFileSync('git',['show','origin/feat/system-exceptional-forge-notices-20261115:'+file],{encoding:'utf8'}));
          const all=[...new Set([...current,...incoming])];
          if (!all.some(x=>x.includes('forge-system-announcements'))) throw Error('Forge notice core test missing');
          fs.writeFileSync(file,JSON.stringify(all,null,2)+'\n');
          console.log('Combined mobile core checks:',all.length);
          NODE
          git add tools/mobile-core-tests.json
          git diff --cached --quiet || git commit -m "test(release): retain combined core regression tests"
          if git grep -n -e '^<<<<<<<' -e '^=======' -e '^>>>>>>>' -- apps/mobile/src backend/src tools/mobile-core-tests.json; then
            echo 'Unresolved conflict markers detected' >&2
            exit 1
          fi
          git push origin HEAD:release/1.0.10-merge-resolution-20261115
      - name: Report staged result (not a production deployment)
        run: |
          git log --oneline -7
          echo 'Not ready to ship until full integration CI, Edge sync and Android AAB tests pass.'
