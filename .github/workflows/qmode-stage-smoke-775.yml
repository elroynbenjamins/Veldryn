name: Staging Q-Mode Edge smoke test (PR 775 only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/qmode-stage-smoke-775.yml']

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.pull_request.number == 775 }}
    runs-on: ubuntu-latest
    steps:
      - name: Check staged gameplay/co-op boot, release policy and auth
        shell: bash
        run: |
          set -euo pipefail
          base="https://iqfmmpvwanvvmxcftfxw.supabase.co/functions/v1"
          for path in "coop/entry" "gameplay"; do
            echo "Checking $path"
            status=$(curl --retry 2 --max-time 15 -sS -o /tmp/resp -w '%{http_code}' "$base/$path")
            cat /tmp/resp
            test "$status" = "401"
            grep -q '"error":"auth_required"' /tmp/resp
            status=$(curl --retry 2 --max-time 15 -sS -o /tmp/resp -w '%{http_code}' \
              -H 'authorization: Bearer invalid-test-token' -H 'x-app-version: 1.0.5' \
              -H 'x-app-platform: android' "$base/$path")
            cat /tmp/resp
            test "$status" = "401"
            grep -q '"error":"invalid_session"' /tmp/resp
            status=$(curl --retry 2 --max-time 15 -sS -o /tmp/options -w '%{http_code}' -X OPTIONS "$base/$path")
            test "$status" = "204"
          done
          echo "PASS: both staged Edge functions boot, enforce auth, and load release policies"
