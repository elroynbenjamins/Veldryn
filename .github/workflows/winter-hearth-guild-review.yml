name: Winter Hearth 2026 Guild Market Review

on:
  push:
    branches:
      - 'feature/frostfall-2026-winter-hearth-guild-market-review'
    paths:
      - 'tools/frostfall-winter-hearth-2026-rules*'
      - 'tools/winter-hearth-review/**'
      - 'backend/supabase/migrations/*winter_hearth*'
      - 'apps/mobile/src/core/winter-hearth-*'
      - 'apps/mobile/src/components/WinterHearthGuildScreen.tsx'
      - 'apps/mobile/src/online/winter-hearth-*'
      - 'apps/mobile/tests/winter-hearth-2026.ts'
      - 'docs/roadmap/frostfall-winter-hearth-2026-guild-market.md'
      - '.github/workflows/winter-hearth-guild-review.yml'
  pull_request:
    paths:
      - 'tools/frostfall-winter-hearth-2026-rules*'
      - 'tools/winter-hearth-review/**'
      - 'backend/supabase/migrations/*winter_hearth*'
      - 'apps/mobile/src/core/winter-hearth-*'
      - 'apps/mobile/src/components/WinterHearthGuildScreen.tsx'
      - 'apps/mobile/src/online/winter-hearth-*'
      - 'apps/mobile/tests/winter-hearth-2026.ts'
      - 'docs/roadmap/frostfall-winter-hearth-2026-guild-market.md'
      - '.github/workflows/winter-hearth-guild-review.yml'

permissions:
  contents: read

jobs:
  pure-rules:
    name: Isolated 2026 milestone and cap rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Winter Hearth domain rule tests
        run: |
          node --test tools/frostfall-winter-hearth-2026-rules.test.mjs
          node --test tools/winter-hearth-review/v2/wisp-craft-supply-review.test.mjs
          node --test tools/winter-hearth-review/v2/actual-crafting-source.test.mjs
  disposable-guild-donations:
    name: PG17 Winter Hearth donation ledger and Guild Gold review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: winter_hearth_review
          POSTGRES_PASSWORD: disposable-only-winter-hearth
          POSTGRES_DB: winter_hearth_review_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U winter_hearth_review -d winter_hearth_review_2026"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: winter_hearth_review
      PGPASSWORD: disposable-only-winter-hearth
      PGDATABASE: winter_hearth_review_2026
      PGSSLMODE: disable
    steps:
      - name: Checkout hidden review with no persistent token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm only disposable database is reachable
        run: test "$(psql -X -v ON_ERROR_STOP=1 -Atc 'select current_database()')" = 'winter_hearth_review_2026'
      - name: Execute isolated winter-hearth PG17 source and adversarial donation tests
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tools/winter-hearth-review/v2/00_disposable_pg17_guild_donation_model.sql
          psql -X -v ON_ERROR_STOP=1 -f tools/winter-hearth-review/v2/01_disposable_pg17_guild_donation_tests.sql
      - name: Check concurrent account caps and two-member milestone race
        run: bash tools/winter-hearth-review/v2/02_pg17_parallel_guild_donations.sh
      - name: Assert no actual app inventory or Guild PVE tables exist
        run: |
          test "$(psql -X -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('guild_members','account_bank_items','guild_pve_treasury_v1')")" = '0'

      - name: Run exact donation RPC migrations in a separate disposable database
        run: |
          test "$PGDATABASE" = 'winter_hearth_review_2026'
          createdb winter_hearth_rpc_review_2026
          PGDATABASE=winter_hearth_rpc_review_2026 psql -X -v ON_ERROR_STOP=1 -f tools/winter-hearth-review/v2/03_actual_rpc_fixture.sql

  crafting-runtime:
    name: Christmas Lights actual shared-engine processing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked backend and mobile dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Execute actual crafting with test-only in-memory flag
        run: node tools/winter-hearth-review/v2/run-crafting-runtime.mjs
      - name: Confirm no tracked source or generated bundle changed
        run: git diff --exit-code
