name: One-time approved encounter music import
on:
  push:
    branches:
      - chatgpt/encounter-music-expansion-20261125
    paths:
      - '.github/workflows/encounter-music-import-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/chatgpt/encounter-music-expansion-20261125'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract only the approved audio masters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          dest=Path('apps/mobile/assets/audio/music')
          archive=dest/'Veldryn_GitHub_Music_Upload.zip'
          expected={
            'boss_A.mp3':'861043b5131a315035aa5e431a52a57f3fa64270',
            'boss_B.mp3':'274eebd779eeea1f998e753de2f3de4c1be1e91f',
            'dungeon_A.mp3':'41b0b95c62785a554050fad044c0ce1a0d8bb04c',
            'dungeon_B.mp3':'98528652d94ae485fe183995ed2e770fdf0d578e',
            'frostfall_dungeon.mp3':'30ba7e65e568ee5221bea91955fb8a5791a9f396',
            'world_boss_A.mp3':'ad8dacb411ddf98a3216303bc6015439b9498384',
            'world_boss_B.mp3':'600842001e6de3854db8374662a91e9f4ee42f20',
          }
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='26e1525c572822fcfc06bb8a8c063a0bcd47163672eb5464f89035fa8ff16c03'
          with zipfile.ZipFile(archive) as z:
            assert sorted(z.namelist())==sorted(expected)
            assets={name:z.read(name) for name in expected}
          for name,data in assets.items():
            assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected[name],name
            assert not (dest/name).exists() or (dest/name).read_bytes()==data,name
          for name,data in assets.items():
            (dest/name).write_bytes(data)
          archive.unlink()
          PY
      - name: Commit exact audio assets to the existing draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- apps/mobile/assets/audio/music
          git diff --cached --stat
          git commit -m 'Extract verified encounter soundtrack masters'
          git push origin HEAD:refs/heads/chatgpt/encounter-music-expansion-20261125
