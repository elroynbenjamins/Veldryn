name: AAB size pass 1 quality gate (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aab-size-pass-1-fast.yml'
permissions:
  contents: read
jobs:
  quality:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/aab-size-pass-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp ripgrep >/dev/null
      - name: Measure high-quality WebP encode PSNR and savings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          def enc(p,q,out):
              x=subprocess.run(['cwebp','-q',str(q),'-m','4','-alpha_q','100','-metadata','none','-print_psnr',str(p),'-o',str(out)],capture_output=True,text=True,check=True)
              txt=x.stdout+x.stderr
              m=re.search(r'PSNR Y: ([0-9.]+)',txt)
              return out.stat().st_size,float(m.group(1)) if m else None
          cards=[]
          for p in Path('apps/mobile/assets/card-backgrounds').glob('*.webp'):
              if p.stat().st_size<1024*1024: continue
              if not subprocess.run(['rg','-l','-F',p.name,'apps/mobile/src'],capture_output=True,text=True).stdout.strip(): continue
              cards.append(p)
          pets=[*Path('apps/mobile/assets/master_roster/pets/portraits_512').glob('*.png'),*Path('apps/mobile/assets/guild-token-shop/pets/portraits').glob('*.png')]
          runtime=[Path('apps/mobile/assets/gem-sprite-v2.png'),Path('apps/mobile/assets/unrefined-gem.png'),Path('apps/mobile/assets/regional-resources-v2.png'),Path('apps/mobile/assets/events/frostfall/candy_frostmint.png')]
          for label,paths,q in [('CARDS',cards,85),('PETS',pets,90),('RUNTIME',runtime,90)]:
              old=new=0;ps=[]
              for i,p in enumerate(paths):
                  z,v=enc(p,q,Path('/tmp')/f'{label}-{i}.webp');old+=p.stat().st_size;new+=z
                  if v is not None: ps.append(v)
              print(f'{label}_QUALITY q={q} files={len(paths)} old={old/1048576:.2f}MiB new={new/1048576:.2f}MiB save={(old-new)/1048576:.2f}MiB psnr_min={min(ps) if ps else None} psnr_avg={sum(ps)/len(ps) if ps else None}')
          PY
