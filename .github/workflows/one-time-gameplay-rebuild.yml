name: One-time gameplay engine rebuild
on:
  push:
    branches: [feat/gamewide-protection-optimization-pass]
    paths: ['.github/workflows/one-time-gameplay-rebuild.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Rebuild from canonical game engine
        run: pnpm --dir backend build:online
      - name: Verify fresh gameplay artifact
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit regenerated gameplay bundle
        run: |
          git diff --stat -- backend/supabase/functions/gameplay/index.ts
          if git diff --quiet -- backend/supabase/functions/gameplay/index.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/supabase/functions/gameplay/index.ts
          git commit -m "build: reconcile game-wide gameplay Edge bundle with shared engine"
          git push origin HEAD:feat/gamewide-protection-optimization-pass
