name: Temporary T2-T5 rolls integration and Edge rebuild

on:
  pull_request:
    paths:
      - '.github/workflows/nov18-rolls-edge-rebuild.yml'

permissions:
  contents: write

jobs:
  validate-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/nov18-t2-t5-rolls
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend and mobile dependencies from checked-in locks
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Verify current mobile types and Equipment 2.0 integration contracts
        run: |
          pnpm --dir apps/mobile typecheck:core
          pnpm --dir apps/mobile typecheck
          node tools/run-mobile-tests.mjs equipment-bonus-rolls weapon-bonus-rolls equipment-set-runtime equipment-crafting-source-v33 cross-profession-crafting ui-density-hierarchy-contract hunt-active-abilities
      - name: Rebuild both canonical server-authoritative gameplay bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Commit generated files only to isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Both Edge bundles are already synchronized.'
            exit 0
          fi
          git commit -m 'build(edge): sync shared gameplay and co-op with T2-T5 stat rolls'
          git push origin HEAD:integration/nov18-t2-t5-rolls
