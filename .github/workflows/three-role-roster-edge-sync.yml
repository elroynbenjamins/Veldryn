name: Three-role roster branch-only Edge parity rebuild
# Disposable integration-only helper. Remove before merging into main.
# Retrigger after exact-boundary account-skill fixture repair; no production writes.
# Rerun after verified all role-order tests passed and final 13-skill watermark expectation corrected.
# Rerun after distinguishing permanent story-boss bonus from per-region AFK milestone in test.
on:
  push:
    branches: ['feat/three-role-roster-region-afk-milestones-20261116']
    paths: ['.github/workflows/three-role-roster-edge-sync.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: three-role-roster-edge-sync-draft
  cancel-in-progress: false

jobs:
  canonical-shared-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-role-roster-region-afk-milestones-20261116
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked mobile and backend dependencies
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
      - name: Validate role creation and AFK milestone contracts before rebuilding
        run: |
          node tools/run-mobile-tests.mjs account-progression offline-cap character-creation-onboarding equipment-timed-crafting-queue vip-supporter-entitlements character-delete-management online-roster account-collectibles
          pnpm --dir apps/mobile typecheck
      - name: Build both canonical gameplay and co-op Edge functions
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Reject all non-generated changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated changes:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit only generated Edge files to the exact draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Canonical bundles already match source.'
            exit 0
          fi
          git commit -m 'build(edge): sync three-role roster and regional AFK milestones'
          git push origin HEAD:feat/three-role-roster-region-afk-milestones-20261116
