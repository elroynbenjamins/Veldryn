name: Safe cleanup of merged branch refs

# Runs once when this workflow is introduced on main; also supports an
# explicitly requested repeat. Never processes open/unmerged or protected work.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-merged-branch-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete only exact-head branches already integrated in main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            // Backup snapshots remain protected; old release branches may be removed
            // only after GitHub verifies that their exact heads were merged.
            const protectedPrefixes = ['backup/'];
            // Closed superseded drafts documented as replaced by already merged PRs,
            // or explicitly retired in their closed PR discussions. Never widen
            // this allowlist automatically or infer deletion from branch age.
            const retired = {
              'balance/fallen-knight-gear-food-checkpoint-1.0.5': { legacy: 757, replacement: 768 },
              'balance/meaningful-overworld-gear-and-food-1.0.5': { legacy: 754, replacement: 768 },
              'chore/release-notes-1-0-4-final': { legacy: 732, replacement: null },
              'consolidate/account-collections-20261103': { legacy: 766, replacement: 768 },
              'consolidate/combat-balance-20261103': { legacy: 767, replacement: 768 },
              'consolidate/1-0-5-combat-and-account-collections-20261103': { legacy: 765, replacement: 768 },
              'feat/guild-bank-needed-materials-20261031': { legacy: 677, replacement: 680 },
              'feature/account-wide-collections-20261101': { legacy: 700, replacement: 768 },
              'feature/journal-skill-learning-paths-20261103': { legacy: 764, replacement: 769 },
              'fix/auto-lock-enhanced-gear-and-allow-manual-sale': { legacy: 709, replacement: null },
              'fix/compact-section-guide-replay-20261102': { legacy: 707, replacement: 763 },
              'fix/guild-guide-and-skills-unavailable-20261103': { legacy: 747, replacement: 762 },
              'fix/inventory-lock-invalid-settings-20261102': { legacy: 703, replacement: null },
              'fix/mobile-core-seven-contracts-20261031': { legacy: 682, replacement: 681 },
            };
            const eligible = [];
            const skipped = [];
            for (const branch of branches) {
              const name = branch.name;
              if (name === 'main' || branch.protected ||
                  protectedPrefixes.some(prefix => name.startsWith(prefix))) {
                skipped.push({ branch: name, reason: 'protected or retained' });
                continue;
              }
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, head: owner + ':' + name, state: 'all', per_page: 100
              });
              if (prs.some(pr => pr.state === 'open')) {
                skipped.push({ branch: name, reason: 'open PR' });
                continue;
              }
              const merged = prs.find(pr =>
                pr.merged_at && pr.base.ref === 'main' &&
                pr.head.repo?.full_name === owner + '/' + repo &&
                pr.head.sha === branch.commit.sha && pr.merge_commit_sha);
              if (!merged) {
                const entry = retired[name];
                const old = entry && prs.find(pr =>
                  pr.number === entry.legacy && pr.state === 'closed' &&
                  !pr.merged_at && pr.base.ref === 'main' &&
                  pr.head.repo?.full_name === owner + '/' + repo &&
                  pr.head.ref === name && pr.head.sha === branch.commit.sha &&
                  /supersed|reconcil|current main|already works|duplicate/i.test(pr.body || ''));
                if (!old) {
                  skipped.push({ branch: name, reason: 'not an exact merged or verified retired head' });
                  continue;
                }
                if (entry.replacement) {
                  const replacement = await github.rest.pulls.get({
                    owner, repo, pull_number: entry.replacement
                  });
                  const pr = replacement.data;
                  if (!pr.merged || pr.base.ref !== 'main' || !pr.merge_commit_sha) {
                    skipped.push({ branch: name, reason: 'replacement not merged' });
                    continue;
                  }
                  const check = await github.rest.repos.compareCommits({
                    owner, repo, base: pr.merge_commit_sha, head: 'main', per_page: 1
                  });
                  if (!['ahead', 'identical'].includes(check.data.status)) {
                    skipped.push({ branch: name, reason: 'replacement not on main' });
                    continue;
                  }
                }
                // Three explicitly retired branches (old 1.0.4 note draft,
                // auto-lock duplicate, inventory-lock duplicate) have no
                // separate replacement PR; their closed reviews explain why.
                eligible.push({ name, sha: branch.commit.sha, pr: old.number });
                continue;
              }
              // A branch is removable only while its merge commit is still
              // an ancestor of main (squashed/rebased work is included).
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: merged.merge_commit_sha, head: 'main', per_page: 1
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                skipped.push({ branch: name, reason: 'merge not ancestor of main' });
                continue;
              }
              eligible.push({ name, sha: branch.commit.sha, pr: merged.number });
            }
            if (eligible.length > 110) throw new Error('Unsafe deletion volume');
            core.info('Eligible: ' + eligible.map(x => x.name).join(', '));
            const deleted = [];
            const failed = [];
            for (const item of eligible) {
              try {
                // Re-read the tip immediately before deletion. Do not delete
                // anything a contributor has advanced after the audit.
                const fresh = await github.rest.repos.getBranch({
                  owner, repo, branch: item.name
                });
                if (fresh.data.protected || fresh.data.commit.sha !== item.sha) {
                  skipped.push({ branch: item.name, reason: 'ref changed' });
                  continue;
                }
                // Retry transient GitHub 5xx errors, but recheck the exact
                // branch SHA before every retry. Never delete a moved ref.
                for (let attempt = 1; attempt <= 3; attempt++) {
                  try {
                    await github.rest.git.deleteRef({
                      owner, repo, ref: 'heads/' + item.name
                    });
                    deleted.push(item.name);
                    break;
                  } catch (err) {
                    if (attempt === 3 || (err.status && err.status < 500)) throw err;
                    await new Promise(resolve => setTimeout(resolve, attempt * 1200));
                    const retryHead = await github.rest.repos.getBranch({
                      owner, repo, branch: item.name
                    });
                    if (retryHead.data.protected || retryHead.data.commit.sha !== item.sha) {
                      skipped.push({ branch: item.name, reason: 'changed during retry' });
                      break;
                    }
                  }
                }
              } catch (err) {
                failed.push({ branch: item.name, error: String(err.message) });
              }
            }
            await core.summary
              .addHeading('Merged branch cleanup')
              .addRaw('Removed ' + deleted.length + ' verified merged branches; preserved ' +
                skipped.length + ' other branches; errors ' + failed.length + '.')
              .addHeading('Removed', 3)
              .addList(deleted.length ? deleted : ['None'])
              .addHeading('Preserved', 3)
              .addList(skipped.map(x => x.branch + ': ' + x.reason).slice(0, 160))
              .write();
            for (const issue of failed) core.error(issue.branch + ': ' + issue.error);
            if (failed.length) throw new Error(failed.length + ' branch deletion(s) failed');
