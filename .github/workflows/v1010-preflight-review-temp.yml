name: v1.0.10 draft preflight safety review
# Branch-only disposable validation; remove before any release merge.
on:
  push:
    branches: ['integration/v1010-preflight-safety-and-release-copy-20261116']
    paths: ['.github/workflows/v1010-preflight-review-temp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run actual candidate metadata and hidden-feature release guard
        run: node tools/check-v110-aab-readiness.mjs
      - name: Preserve unpublished 1.0.10 release copy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Unpublished release-copy concept' marketing/release-notes/1.0.10.md
          grep -q 'three characters per account' marketing/release-notes/1.0.10.md
          grep -q 'ff628071873215781ce4508bc394b61911e9d334' docs/operations/2026-11-15-main-integration-register.md
          grep -q '14227708964' docs/operations/2026-11-15-main-integration-register.md
