# Source-only branch reconciliation for timed tool crafting. Never deploys.
name: Timed gathering tools Edge reconciliation
on:
  push:
    branches: ['fix/tools-inspect-and-timed-forging-20261121']
    paths:
      - '.github/workflows/timed-gathering-tools-edge-reconcile.yml'
      - 'apps/mobile/App.tsx'
      - 'apps/mobile/src/**'
      - 'apps/mobile/tests/**'
      - 'backend/online/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timed-gathering-tools-edge-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tools-inspect-and-timed-forging-20261121
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
      - name: Typecheck and smoke test gathering tools
        run: |
          pnpm --dir apps/mobile typecheck:core
          pnpm --dir apps/mobile exec tsc -p tsconfig.core.json --outDir .core-build
          node apps/mobile/.core-build/apps/mobile/tests/gathering-tool-affixes.js
      - name: Regenerate canonical server gameplay bundles
        run: |
          pnpm --dir backend build:online
          node tools/verify-gameplay-edge.mjs
      - name: Restrict generated changes to canonical Edge artifacts
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^backend/supabase/functions/(gameplay|coop)/index\.ts$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Refusing unrelated generator changes:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit generated artifacts to this branch only
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/tools-inspect-and-timed-forging-20261121
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo 'Generated Edge bundles already match source.'
            exit 0
          fi
          git commit -m 'build(edge): reconcile timed tool crafting gameplay bundles'
          git fetch origin "$branch"
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse "origin/$branch")" ]; then
            echo 'Branch moved during rebuild; refusing stale generated push.'
            exit 1
          fi
          git push origin "HEAD:$branch"
 || true)
