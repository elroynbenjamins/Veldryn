name: Temporary Frostfall review Edge bundle regeneration
on:
  push:
    branches:
      - feat/frostfall-endurance-review-20261122
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'elroynbenjamins/Veldryn'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/frostfall-endurance-review-20261122
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/build-online.mjs
      - run: node tools/verify-gameplay-edge.mjs
      - name: Commit exact-source Edge bundles to review branch only
        shell: bash
        run: |
          git add backend/supabase/functions/coop/index.ts backend/supabase/functions/gameplay/index.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(frostfall): regenerate exact-source co-op Edge bundle"
            git push origin HEAD:refs/heads/feat/frostfall-endurance-review-20261122
          fi
