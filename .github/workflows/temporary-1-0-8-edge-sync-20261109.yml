name: Temporary 1.0.8 Edge bundle regeneration
on:
  push:
    branches:
      - release/1.0.8-ironwood-resin-aab-ready-20261109
    paths:
      - .github/workflows/temporary-1-0-8-edge-sync-20261109.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.8-ironwood-resin-aab-ready-20261109
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install locked mobile dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: Install locked backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Regenerate gameplay and co-op Edge bundles
        run: pnpm --dir backend build:online
      - name: Verify both generated bundles match the shared engine
        run: node tools/verify-gameplay-edge.mjs
      - name: Commit generated Edge files
        run: |
          git add backend/supabase/functions/gameplay/index.ts backend/supabase/functions/coop/index.ts
          if git diff --cached --quiet; then
            echo "Both bundles already match"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(edge): regenerate 1.0.8 Ironwood resin bundles"
          git push origin HEAD:release/1.0.8-ironwood-resin-aab-ready-20261109
